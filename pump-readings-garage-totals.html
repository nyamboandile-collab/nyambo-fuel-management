<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Pump Meter Readings</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#172033}.top{background:#111b29;color:white;padding:16px;position:sticky;top:0}.wrap{max-width:1150px;margin:auto;padding:14px}.back,.btn{border:0;background:#e20d18;color:#fff;padding:11px 14px;border-radius:9px;font-weight:bold}.back{margin-bottom:14px}.summary,.garageStats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.garage,.pump{background:white;border:1px solid #e1e6ec;border-radius:14px;padding:15px}.label{font-size:12px;color:#667085;font-weight:bold}.value{font-size:25px;font-weight:bold;margin-top:6px}.green{color:#239447}.purple{color:#7b3fc6}.garage{margin-top:14px}.garage h2{margin:0 0 10px}.garageStats{grid-template-columns:repeat(4,1fr);margin-bottom:12px}.mini{background:#f7f8fa;padding:10px;border-radius:9px}.mini span{font-size:11px;color:#667085}.mini b{display:block;font-size:18px;margin-top:4px}.pump{margin-top:10px;background:#fbfcfd}.head{display:flex;justify-content:space-between}.tag{padding:6px 9px;border-radius:20px;font-size:12px;font-weight:bold}.petrol{background:#e9f7ee;color:#239447}.diesel{background:#f1eafa;color:#7b3fc6}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}label{font-size:12px;font-weight:bold;color:#667085}input{width:100%;padding:11px;margin-top:5px;border:1px solid #ccd3dc;border-radius:9px;font-size:16px}.readonly{background:#eef1f4}.calc{margin-top:9px;padding:10px;background:#f1f3f5;border-radius:9px}.actions{display:flex;gap:8px;margin-top:9px}.secondary{background:#172033}.history{margin-top:14px;overflow:auto}.history table{width:100%;border-collapse:collapse;font-size:12px}.history th,.history td{padding:9px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}.history th{background:#f1f3f5}.empty{text-align:center;padding:20px;color:#667085}@media(max-width:700px){.summary,.garageStats,.fields{grid-template-columns:1fr 1fr}}@media(max-width:450px){.summary,.garageStats,.fields{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}}</style></head><body><div class="top"><h1>NYAMBO FUEL MANAGEMENT</h1><small>Pump Meter Readings</small></div><div class="wrap"><button class="back" onclick="location.href='/'">← Dashboard</button><div class="summary"><div class="card"><div class="label">PETROL SOLD</div><div id="petrol" class="value green">0.00 L</div><div id="petrolMoney">$0.00</div></div><div class="card"><div class="label">DIESEL SOLD</div><div id="diesel" class="value purple">0.00 L</div><div id="dieselMoney">$0.00</div></div><div class="card"><div class="label">TOTAL LITRES</div><div id="total" class="value">0.00 L</div></div><div class="card"><div class="label">TOTAL MONEY SOLD</div><div id="money" class="value">$0.00</div></div></div><div id="garages"></div><div class="history card"><h2>Recent Reading History</h2><p>Every saved reading remains in the history.</p><table><thead><tr><th>Date</th><th>Garage</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr></thead><tbody id="history"></tbody></table></div></div><script>const db=supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');let stations=[],pumps=[],readings=[];const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L',sum=a=>a.reduce((z,x)=>z+Number(x.litres_sold||0),0),cash=a=>a.reduce((z,x)=>z+Number(x.money||x.money_received||0),0),same=(a,b)=>String(a)===String(b),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function latest(pid){return readings.filter(r=>same(r.pump_id,pid)).sort((a,b)=>String(b.reading_date).localeCompare(String(a.reading_date)))[0]}function render(){let pt=readings.filter(r=>String(r.fuel_type).toLowerCase()==='petrol'),ds=readings.filter(r=>String(r.fuel_type).toLowerCase()==='diesel');petrol.textContent=lit(sum(pt));diesel.textContent=lit(sum(ds));total.textContent=lit(sum(readings));petrolMoney.textContent=money(cash(pt));dieselMoney.textContent=money(cash(ds));moneyEl=money(cash(readings));document.getElementById('money').textContent=moneyEl;garages.innerHTML=stations.map(s=>{let ps=pumps.filter(p=>same(p.station_id,s.id)),rs=readings.filter(r=>same(r.station_id,s.id)),p=rs.filter(r=>String(r.fuel_type).toLowerCase()==='petrol'),d=rs.filter(r=>String(r.fuel_type).toLowerCase()==='diesel');return '<section class="garage"><h2>'+esc(s.name)+'</h2><div class="garageStats"><div class="mini"><span>Total litres sold</span><b>'+lit(sum(rs))+'</b></div><div class="mini"><span>Total money sold</span><b>'+money(cash(rs))+'</b></div><div class="mini"><span>Petrol litres</span><b class="green">'+lit(sum(p))+'</b></div><div class="mini"><span>Diesel litres</span><b class="purple">'+lit(sum(d))+'</b></div></div>'+(ps.length?ps.map(q=>{let h=latest(q.id),o=h?Number(h.closing_meter):0,cls=String(q.fuel_type).toLowerCase()==='petrol'?'petrol':'diesel';return '<div class="pump"><div class="head"><b>'+esc(q.fuel_type)+' Pump '+esc(q.pump_number)+'</b><span class="tag '+cls+'">'+esc(q.fuel_type)+'</span></div><div class="fields"><div><label>Opening meter</label><input id="o-'+q.id+'" class="readonly" value="'+o.toFixed(3)+'" readonly></div><div><label>Closing meter</label><input id="c-'+q.id+'" type="number" step="0.001" min="'+o+'"></div><div><label>Price / litre</label><input id="pr-'+q.id+'" type="number" step="0.01" min="0"></div><div><label>Date</label><input id="dt-'+q.id+'" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><div class="calc" id="x-'+q.id+'">Enter closing meter and price.</div><div class="actions"><button class="btn" onclick="save(\''+q.id+'\')">Save Reading</button><button class="btn secondary" onclick="hist(\''+q.id+'\')">View History</button></div></div>'}).join(''):'<div class="empty">No pumps configured.</div>')+'</section>'}).join('')||'<div class="card empty">No garages found.</div>';pumps.forEach(q=>{let c=document.getElementById('c-'+q.id),pr=document.getElementById('pr-'+q.id);if(c)c.oninput=()=>calc(q.id);if(pr)pr.oninput=()=>calc(q.id)});history.innerHTML=readings.slice(0,60).map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+esc(r.station_name)+'</td><td>'+esc(r.pump_number)+'</td><td>'+esc(r.fuel_type)+'</td><td>'+esc(r.opening_meter)+'</td><td>'+esc(r.closing_meter)+'</td><td>'+lit(r.litres_sold)+'</td><td>'+money(r.money||r.money_received)+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">No readings saved yet.</td></tr>'}function calc(id){let o=+document.getElementById('o-'+id).value,c=+document.getElementById('c-'+id).value,p=+document.getElementById('pr-'+id).value,b=document.getElementById('x-'+id);if(!document.getElementById('c-'+id).value||!document.getElementById('pr-'+id).value){b.textContent='Enter closing meter and price.';return}if(c<o){b.textContent='Invalid: closing cannot be lower than opening.';return}b.textContent='Litres sold: '+lit(c-o)+' • Money sold: '+money((c-o)*p)}async function save(id){let o=+document.getElementById('o-'+id).value,c=+document.getElementById('c-'+id).value,p=+document.getElementById('pr-'+id).value,d=document.getElementById('dt-'+id).value;if(!d||!Number.isFinite(c)||!Number.isFinite(p))return alert('Enter closing meter, price and date.');if(c<o)return alert('Closing meter cannot be lower than opening meter.');let r=await db.from('pump_readings').insert({pump_id:id,reading_date:d,opening_meter:o,closing_meter:c,price_per_litre:p,money_received:(c-o)*p});if(r.error)alert(r.error.message);else{alert('Reading saved successfully.');load()}}function hist(id){let p=pumps.find(q=>same(q.id,id)),r=readings.filter(q=>same(q.pump_id,id)).sort((a,b)=>String(b.reading_date).localeCompare(String(a.reading_date)));alert((p?p.fuel_type+' Pump '+p.pump_number:'Pump')+' history\n\n'+(r.map(q=>q.reading_date+' | '+q.opening_meter+' → '+q.closing_meter+' | '+lit(q.litres_sold)+' | '+money(q.money||q.money_received)).join('\n')||'No readings.'))}async function load(){let a=await Promise.all([db.from('stations').select('id,name').order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type').order('pump_number'),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);stations=a[0].data||[];pumps=a[1].data||[];readings=a[2].data||[];render()}load();</script></body></html>
