<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Customers</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#172033}.head{background:#111b29;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:21px}.wrap{max-width:1200px;margin:auto;padding:14px}.panel,.cust{background:#fff;border:1px solid #e1e6ec;border-radius:12px;padding:15px}.layout{display:grid;grid-template-columns:320px 1fr;gap:14px}.cust{margin-top:9px;cursor:pointer}.cust.active{border:2px solid #e20d18;background:#fff8f8}.muted{color:#667085;font-size:13px}.red{color:#d71920;font-weight:bold}.green{color:#239447;font-weight:bold}.btn{border:0;border-radius:8px;padding:10px 14px;background:#e20d18;color:#fff;font-weight:bold}.dark{background:#172033}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.card{border:1px solid #e1e6ec;border-radius:10px;padding:14px}.value{font-size:22px;font-weight:bold;margin-top:5px}.tabs{display:flex;gap:6px;margin:16px 0 10px;overflow:auto}.tab{border:0;padding:10px 13px;border-radius:7px;font-weight:bold;white-space:nowrap}.tab.active{background:#e20d18;color:#fff}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f1f3f5}.empty{text-align:center;padding:25px;color:#667085;border:1px dashed #ccd2da;border-radius:10px}.notice{padding:12px;background:#fff3cd;color:#705b00;border-radius:8px;margin-bottom:12px}@media(max-width:750px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.head h1{font-size:18px}}</style></head><body><div class="head"><div><h1>NYAMBO FUEL MANAGEMENT</h1><div class="muted" style="color:#cbd2dc">Credit Customers</div></div><div><button class="btn" onclick="location.href='credit-sale.html'">+ Credit Sale</button> <button class="btn dark" onclick="location.href='/'">Dashboard</button></div></div><div class="wrap"><div id="msg" class="notice">Loading credit customers...</div><div class="layout"><aside class="panel"><h2>Credit Customers</h2><input id="search" placeholder="Search customer..." style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px"><div id="list"></div></aside><main id="detail"><div class="empty">Select a customer to view their credit account.</div></main></div></div><script>
const U='https://dyqwsydxyhomudujumxs.supabase.co',K=['sb_publishable_','rH-erFTla9rTfqA5eGwwNA_ad0BgDq6'].join('');let db,customers=[],sales=[],payments=[],stations=[],selected=null,tab='report';const seed=['Malandu','Pride','Sandile','Rhino Rue','Townsend High School','Ardar','Histeel'];const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function load(){try{db=window.supabase.createClient(U,K);let r=await Promise.all([db.from('credit_customers').select('*').order('name'),db.from('credit_sales').select('*').order('sale_date',{ascending:false}),db.from('credit_payments').select('*').order('payment_date',{ascending:false}),db.from('stations').select('id,name').order('name')]);customers=r[0].data||[];sales=r[1].data||[];payments=r[2].data||[];stations=r[3].data||[]}catch(e){}if(!customers.length)customers=seed.map((name,i)=>({id:'local-'+i,name,is_active:true}));let ls=JSON.parse(localStorage.getItem('nyambo_credit_sales')||'[]');sales=[...sales,...ls];msg.innerHTML='Credit customer accounts are ready. Select a customer to see credit, payments, invoices and balance.';renderList()}
function totals(c){let cs=sales.filter(x=>String(x.customer_id)===String(c.id)),ps=payments.filter(x=>String(x.customer_id)===String(c.id));let cr=cs.reduce((a,x)=>a+Number(x.amount||0),0),pa=ps.reduce((a,x)=>a+Number(x.amount||0),0);return{cs,ps,cr,pa,bal:cr-pa}}
function renderList(){let q=search.value.toLowerCase(),a=customers.filter(c=>c.name.toLowerCase().includes(q));list.innerHTML=a.length?a.map(c=>{let t=totals(c);return '<div class="cust '+(selected===c.id?'active':'')+'" onclick="selectC(\''+c.id+'\')"><b>'+esc(c.name)+'</b><div class="muted">Balance owing</div><div class="red">'+money(t.bal)+'</div></div>'}).join(''):'<div class="empty">No customers found.</div>'}
function selectC(id){selected=id;tab='report';renderList();renderDetail()}
function garage(id){let s=stations.find(x=>String(x.id)===String(id));return s?s.name:'—'}
function renderDetail(){let c=customers.find(x=>String(x.id)===String(selected));if(!c)return;let t=totals(c);detail.innerHTML='<div class="panel"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><div class="muted">Customer</div><h2 style="margin:4px 0">'+esc(c.name)+'</h2></div><button class="btn" onclick="location.href=\'credit-sale.html?customer='+encodeURIComponent(c.id)+'\'">+ Add Credit Sale</button></div><div class="summary"><div class="card"><div class="muted">CREDIT MADE</div><div class="value">'+money(t.cr)+'</div></div><div class="card"><div class="muted">PAYMENTS MADE</div><div class="value green">'+money(t.pa)+'</div></div><div class="card"><div class="muted">BALANCE OWING</div><div class="value red">'+money(t.bal)+'</div></div></div><div class="tabs"><button class="tab '+(tab==='report'?'active':'')+'" onclick="setTab(\'report\')">Customer Report</button><button class="tab '+(tab==='credits'?'active':'')+'" onclick="setTab(\'credits\')">Credit Made</button><button class="tab '+(tab==='payments'?'active':'')+'" onclick="setTab(\'payments\')">Payments Made</button><button class="btn dark" onclick="window.print()">Print Report</button></div><div id="body"></div></div>';renderTab(c,t)}
function setTab(x){tab=x;renderDetail()}
function renderTab(c,t){let b=body;if(tab==='credits'){b.innerHTML='<h3>Credit Made by '+esc(c.name)+'</h3><div class="scroll"><table><tr><th>Date</th><th>Invoice Number</th><th>Garage</th><th>Amount</th></tr>'+(t.cs.length?t.cs.map(x=>'<tr><td>'+String(x.sale_date||'').slice(0,10)+'</td><td>'+esc(x.invoice_number||'—')+'</td><td>'+esc(garage(x.station_id))+'</td><td>'+money(x.amount)+'</td></tr>').join(''):'<tr><td colspan="4">No credit sales yet.</td></tr>')+'<tr><th colspan="3">TOTAL CREDIT MADE</th><th>'+money(t.cr)+'</th></tr></table></div>'}else if(tab==='payments'){b.innerHTML='<h3>Payments Made by '+esc(c.name)+'</h3><div class="scroll"><table><tr><th>Date</th><th>Payment Invoice / Reference</th><th>Method</th><th>Amount</th></tr>'+(t.ps.length?t.ps.map(x=>'<tr><td>'+String(x.payment_date||'').slice(0,10)+'</td><td>'+esc(x.reference||'—')+'</td><td>'+esc(x.payment_method||'—')+'</td><td>'+money(x.amount)+'</td></tr>').join(''):'<tr><td colspan="4">No payments recorded yet.</td></tr>')+'<tr><th colspan="3">TOTAL PAYMENTS</th><th>'+money(t.pa)+'</th></tr></table></div>'}else{let ev=[...t.cs.map(x=>({d:String(x.sale_date||'').slice(0,10),desc:'Credit Sale',ref:x.invoice_number||'—',cr:+x.amount||0,pa:0})),...t.ps.map(x=>({d:String(x.payment_date||'').slice(0,10),desc:'Payment',ref:x.reference||'—',cr:0,pa:+x.amount||0}))].sort((a,z)=>a.d.localeCompare(z.d));let bal=0;b.innerHTML='<h3>Customer Report — '+esc(c.name)+'</h3><div class="scroll"><table><tr><th>Date</th><th>Description</th><th>Invoice / Payment Invoice</th><th>Credit</th><th>Payment</th><th>Balance</th></tr>'+(ev.length?ev.map(x=>{bal+=x.cr-x.pa;return '<tr><td>'+x.d+'</td><td>'+x.desc+'</td><td>'+esc(x.ref)+'</td><td>'+money(x.cr)+'</td><td>'+money(x.pa)+'</td><td>'+money(bal)+'</td></tr>'}).join(''):'<tr><td colspan="6">No transactions recorded yet.</td></tr>')+'<tr><th colspan="3">CURRENT BALANCE OWING</th><th>'+money(t.cr)+'</th><th>'+money(t.pa)+'</th><th class="red">'+money(t.bal)+'</th></tr></table></div>'}}
search.oninput=renderList;load();
</script></body></html>
