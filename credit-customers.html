<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Credit Customers</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}.header h1{margin:0;font-size:22px}.header small{color:#cbd2dc}.btn{border:0;border-radius:7px;padding:10px 14px;font-weight:bold;background:#e20d18;color:#fff}.secondary{background:#172033}.container{max-width:1450px;margin:auto;padding:16px}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel,.customer{background:#fff;border:1px solid #e1e6ec;border-radius:12px;padding:16px}.customer{margin-top:10px;cursor:pointer}.customer.active{border:2px solid #e20d18;background:#fff8f8}.customer h3{margin:0 0 5px}.muted{color:#667085;font-size:13px}.money{font-weight:bold}.red{color:#d71920}.green{color:#239447}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e6ec;border-radius:12px;padding:15px}.label{font-size:11px;font-weight:bold;color:#667085}.value{font-size:23px;font-weight:bold;margin-top:7px}.tabs{display:flex;gap:6px;border-bottom:1px solid #ddd;margin:18px 0 12px;overflow:auto}.tab{border:0;background:#f1f3f5;padding:10px 13px;border-radius:7px 7px 0 0;font-weight:bold;white-space:nowrap}.tab.active{background:#e20d18;color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}th{background:#f4f6f8}.total{font-weight:bold;background:#fafafa}.empty{text-align:center;padding:25px;color:#667085;border:1px dashed #ccd2da;border-radius:10px}.notice{padding:10px;background:#fff3cd;border-radius:8px;color:#705b00;margin-bottom:10px}.print-only{display:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:520px){.container{padding:10px}.summary{grid-template-columns:1fr}.header h1{font-size:18px}}@media print{.header,.customer-list,.actions,.tabs{display:none!important}.layout{display:block}.panel{border:0}.print-only{display:block}.summary{grid-template-columns:repeat(3,1fr)}table{font-size:10px}}
</style></head>
<body><div class="header"><div><h1>NYAMBO FUEL MANAGEMENT</h1><small>Credit Customers</small></div><button class="btn" onclick="location.href='/'">← Dashboard</button></div><div class="container"><div class="layout"><aside class="panel customer-list"><h2 style="margin-top:0">Credit Customers</h2><input id="search" style="width:100%;padding:12px;border:1px solid #d7dce3;border-radius:7px" placeholder="Search customer..." oninput="renderCustomers()"><div id="customers"><div class="empty">Loading customers...</div></div></aside><main id="detail"><div class="empty">Select a customer to view their credit account.</div></main></div></div>
<script>
let db=null,customers=[],sales=[],payments=[],stations=[],selected=null,activeTab='report';
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const date=v=>v?String(v).slice(0,10):'';const esc=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));
async function getConfig(){const html=await fetch('/').then(r=>r.text());const u=html.match(/const projectUrl=['\"]([^'\"]+)['\"]/);const k=html.match(/const projectKey=\[(?:['\"][^'\"]*['\"],\s*)['\"]([^'\"]+)['\"]\]/);if(!u||!k)throw Error('Database configuration not found');db=supabase.createClient(u[1],['sb_publishable_',k[1]].join(''))}
async function load(){try{await getConfig();const r=await Promise.all([db.from('credit_customers').select('*').eq('is_active',true).order('name'),db.from('credit_sales').select('*').order('sale_date',{ascending:false}),db.from('credit_payments').select('*').order('payment_date',{ascending:false}),db.from('stations').select('id,name').order('name')]);if(r.some(x=>x.error))throw Error('Unable to load credit data');customers=r[0].data||[];sales=r[1].data||[];payments=r[2].data||[];stations=r[3].data||[];renderCustomers()}catch(e){document.getElementById('customers').innerHTML='<div class="notice">Unable to load credit customer data.</div>';console.error(e)}}
function totals(c){const cs=sales.filter(x=>x.customer_id===c.id),ps=payments.filter(x=>x.customer_id===c.id),credit=cs.reduce((a,x)=>a+Number(x.amount||0),0),paid=ps.reduce((a,x)=>a+Number(x.amount||0),0);return{cs,ps,credit,paid,balance:credit-paid}}
function renderCustomers(){const q=(document.getElementById('search').value||'').toLowerCase(),list=customers.filter(c=>String(c.name||'').toLowerCase().includes(q));document.getElementById('customers').innerHTML=list.length?list.map(c=>{const t=totals(c);return `<div class="customer ${selected===c.id?'active':''}" onclick="selectCustomer('${c.id}')"><h3>${esc(c.name)}</h3><div class="muted">${esc(c.phone||'')}</div><div style="margin-top:8px">Balance Owing: <span class="money red">${money(t.balance)}</span></div></div>`}).join(''):'<div class="empty">No active customers found.</div>'}
function selectCustomer(id){selected=id;activeTab='report';renderCustomers();renderDetail()}function garageName(id){const s=stations.find(x=>x.id===id);return s?s.name:'—'}
function renderDetail(){const c=customers.find(x=>x.id===selected);if(!c){document.getElementById('detail').innerHTML='<div class="empty">Select a customer to view their credit account.</div>';return}const t=totals(c);document.getElementById('detail').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><div class="muted">Credit Customer</div><h1 style="margin:4px 0">${esc(c.name)}</h1><div class="muted">${esc(c.phone||'')} ${c.address?' • '+esc(c.address):''}</div></div><div class="actions"><button class="btn secondary" onclick="window.print()">🖨 Print Customer Report</button></div></div><div class="summary" style="margin-top:15px"><div class="card"><div class="label">CREDIT MADE</div><div class="value">${money(t.credit)}</div><small>All credit sales</small></div><div class="card"><div class="label">PAYMENTS MADE</div><div class="value green">${money(t.paid)}</div><small>All customer payments</small></div><div class="card"><div class="label">BALANCE OWING</div><div class="value red">${money(t.balance)}</div><small>Credit less payments</small></div></div><div class="tabs"><button class="tab ${activeTab==='report'?'active':''}" onclick="tab('report')">Customer Report</button><button class="tab ${activeTab==='credits'?'active':''}" onclick="tab('credits')">Credit Made</button><button class="tab ${activeTab==='payments'?'active':''}" onclick="tab('payments')">Payments Made</button></div><div id="tabbody"></div></div>`;renderTab(c,t)}
function tab(x){activeTab=x;renderDetail()}
function renderTab(c,t){const b=document.getElementById('tabbody');if(activeTab==='credits'){b.innerHTML=`<h2>Credit Made by ${esc(c.name)}</h2><div class="table-wrap"><table><tr><th>Date</th><th>Invoice Number</th><th>Garage</th><th>Amount</th><th>Notes</th></tr>${t.cs.length?t.cs.map(x=>`<tr><td>${date(x.sale_date)}</td><td>${esc(x.invoice_number||'—')}</td><td>${esc(garageName(x.station_id))}</td><td>${money(x.amount)}</td><td>${esc(x.notes||'')}</td></tr>`).join(''):'<tr><td colspan="5">No credit sales.</td></tr>'}<tr class="total"><td colspan="3">TOTAL CREDIT MADE</td><td>${money(t.credit)}</td><td></td></tr></table></div>`}else if(activeTab==='payments'){b.innerHTML=`<h2>Payments Made by ${esc(c.name)}</h2><div class="table-wrap"><table><tr><th>Date</th><th>Payment Invoice / Reference</th><th>Method</th><th>Amount</th><th>Notes</th></tr>${t.ps.length?t.ps.map(x=>`<tr><td>${date(x.payment_date)}</td><td>${esc(x.reference||'—')}</td><td>${esc(x.payment_method||'—')}</td><td>${money(x.amount)}</td><td>${esc(x.notes||'')}</td></tr>`).join(''):'<tr><td colspan="5">No payments recorded.</td></tr>'}<tr class="total"><td colspan="3">TOTAL PAYMENTS</td><td>${money(t.paid)}</td><td></td></tr></table></div>`}else{const events=[...t.cs.map(x=>({d:date(x.sale_date),type:'Credit Sale',ref:x.invoice_number||'—',credit:Number(x.amount||0),payment:0})),...t.ps.map(x=>({d:date(x.payment_date),type:'Payment Received',ref:x.reference||'—',credit:0,payment:Number(x.amount||0)}))].sort((a,b)=>a.d.localeCompare(b.d));let bal=0;const rows=events.map(e=>{bal+=e.credit-e.payment;return `<tr><td>${e.d}</td><td>${e.type}</td><td>${esc(e.ref)}</td><td>${e.credit?money(e.credit):'—'}</td><td>${e.payment?money(e.payment):'—'}</td><td>${money(bal)}</td></tr>`}).join('');b.innerHTML=`<div class="print-only"><h2>Customer Statement — ${esc(c.name)}</h2><p>Generated ${new Date().toLocaleDateString()}</p></div><h2>Customer Report</h2><div class="table-wrap"><table><tr><th>Date</th><th>Description</th><th>Invoice / Payment Invoice</th><th>Credit</th><th>Payment</th><th>Balance</th></tr>${rows||'<tr><td colspan="6">No transactions recorded.</td></tr>'}<tr class="total"><td colspan="3">CURRENT BALANCE OWING</td><td>${money(t.credit)}</td><td>${money(t.paid)}</td><td class="red">${money(t.balance)}</td></tr></table></div>`}}
load();
</script></body></html>
