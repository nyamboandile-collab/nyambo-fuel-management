<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Range Petroleum - Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f9;font-family:Arial,sans-serif;color:#151515}.box{width:min(420px,92vw);background:#fff;border:1px solid #e3e7ec;border-radius:16px;padding:30px;box-shadow:0 12px 35px #0001}.logo{display:block;width:100%;height:110px;margin:0 auto 10px}.title{text-align:center;font-size:24px;font-weight:800;margin:0}.sub{text-align:center;color:#667085;margin:8px 0 24px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:8px;font-size:16px}button{width:100%;border:0;background:#ef101b;color:#fff;padding:13px;border-radius:8px;font-weight:800;font-size:16px;margin-top:20px;cursor:pointer}button:disabled{opacity:.6}.forgot{display:block;text-align:right;margin-top:10px;color:#ef101b;text-decoration:none;font-size:13px;font-weight:700}.msg{min-height:22px;margin-top:14px;text-align:center;font-size:13px}.error{color:#d71920}.ok{color:#239447}</style></head><body><div class="box"><svg class="logo" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8 8)"><rect x="0" y="18" width="42" height="62" rx="3" fill="#f4d33e" stroke="#172033" stroke-width="4"/><rect x="8" y="27" width="26" height="18" rx="2" fill="#fff"/><rect x="15" y="31" width="12" height="8" fill="#ef101b"/><rect x="12" y="80" width="30" height="7" fill="#172033"/><path d="M42 31h11v42c0 9 5 14 13 14" fill="none" stroke="#f4d33e" stroke-width="5"/></g><text x="78" y="52" font-family="Georgia,serif" font-weight="700" font-size="30" fill="#151515">RED RANGE</text><text x="78" y="84" font-family="Georgia,serif" font-weight="700" font-size="25" fill="#151515">PETROLEUM</text><g transform="skewX(-18)"><rect x="82" y="94" width="45" height="14" fill="#d21862"/><rect x="127" y="94" width="45" height="14" fill="#5d2b88"/><rect x="172" y="94" width="45" height="14" fill="#f4d33e"/></g></svg><h1 class="title">Sign in</h1><p class="sub">Red Range Petroleum Management</p><form id="form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><a class="forgot" href="reset-request.html">Forgot Password?</a><button id="btn" type="submit">Sign In</button><div id="msg" class="msg"></div></form></div><script>const db=supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');const form=document.getElementById('form'),btn=document.getElementById('btn'),msg=document.getElementById('msg');db.auth.getSession().then(({data})=>{if(data.session)location.replace('index.html')});form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';msg.className='msg';btn.disabled=true;btn.textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent=error.message;msg.className='msg error';btn.disabled=false;btn.textContent='Sign In';return}msg.textContent='Signed in successfully.';msg.className='msg ok';location.replace('index.html')});</script></body></html>
