<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Payment</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}.header h1{margin:0;font-size:22px}.header small{color:#cbd2dc}.container{max-width:1000px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:13px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px;color:#475467}.field input,.field select{width:100%;padding:13px;border:1px solid #d7dce3;border-radius:8px;font-size:15px;background:#fff}.balance{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 18px}.card{border:1px solid #e1e6ec;border-radius:10px;padding:14px}.label{font-size:11px;color:#667085;font-weight:bold}.value{font-size:22px;font-weight:bold;margin-top:6px}.red{color:#d71920}.green{color:#239447}.btn{border:0;border-radius:8px;padding:13px 18px;background:#e20d18;color:#fff;font-weight:bold;cursor:pointer}.secondary{background:#172033}.notice,.success,.error{padding:12px;border-radius:8px;margin-bottom:14px}.notice{background:#fff3cd;color:#705b00}.success{background:#e9f8ef;color:#176b36}.error{background:#fde8e8;color:#a61b1b}.history{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f1f3f5}.empty{text-align:center;padding:22px;color:#667085}@media(max-width:650px){.grid,.balance{grid-template-columns:1fr}.header h1{font-size:18px}.container{padding:10px}}@media print{.header{color:#000;background:#fff;border-bottom:1px solid #222}.actions{display:none}.panel{border:0}.history{display:block}}</style></head><body><div class="header"><div><h1>NYAMBO FUEL MANAGEMENT</h1><small>Customer Payment</small></div><div><button class="btn secondary" onclick="location.href='credit-customers.html'">Credit Customers</button> <button class="btn secondary" onclick="location.href='/'">Dashboard</button></div></div><div class="container"><div id="msg"></div><div class="panel"><h2>Record Customer Payment</h2><p style="color:#667085">Record money received from a customer and immediately reduce the amount they owe.</p><div class="field"><label>Customer</label><select id="customer"><option value="">Loading customers...</option></select></div><div class="balance"><div class="card"><div class="label">TOTAL CREDIT</div><div class="value" id="creditTotal">$0.00</div></div><div class="card"><div class="label">PAYMENTS MADE</div><div class="value green" id="paymentTotal">$0.00</div></div><div class="card"><div class="label">BALANCE OWING</div><div class="value red" id="balanceOwing">$0.00</div></div></div><div class="grid"><div class="field"><label>Payment Reference / Receipt Number</label><input id="reference" placeholder="e.g. PAY-0001"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Payment Method</label><select id="method"><option>Cash</option><option>Bank Transfer</option><option>Ecocash</option><option>Swipe / POS</option><option>Other</option></select></div><div class="field"><label>Amount Paid</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div></div><div class="field"><label>Notes</label><input id="notes" placeholder="Optional notes"></div><div class="actions"><button class="btn" id="save">Save Payment</button><button class="btn secondary" onclick="window.print()">Print</button></div></div><div class="panel history"><h2>Recent Payments</h2><div id="history"><div class="empty">Select a customer to view payments.</div></div></div></div><script>
const U='https://dyqwsydxyhomudujumxs.supabase.co',K='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6';let db=null,customers=[],sales=[],payments=[],selectedCustomer='';const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const fmt=v=>{if(!v)return'—';let p=String(v).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function show(t,c='notice'){msg.innerHTML='<div class="'+c+'">'+t+'</div>'}function localCustomers(){return JSON.parse(localStorage.getItem('nyambo_credit_customers')||'[]')}function localSales(){return JSON.parse(localStorage.getItem('nyambo_credit_sales')||'[]')}function localPayments(){return JSON.parse(localStorage.getItem('nyambo_credit_payments')||'[]')}
async function init(){date.value=new Date().toISOString().slice(0,10);try{db=window.supabase.createClient(U,K);let [c,s,p]=await Promise.all([db.from('credit_customers').select('*').eq('is_active',true).order('name'),db.from('credit_sales').select('*'),db.from('credit_payments').select('*').order('payment_date',{ascending:false})]);if(!c.error)customers=c.data||[];if(!s.error)sales=s.data||[];if(!p.error)payments=p.data||[]}catch(e){}if(!customers.length)customers=localCustomers();if(!customers.length)customers=['Malandu','Pride','Sandile','Rhino Rue','Townsend High School','Ardar','Histeel'].map((name,i)=>({id:'local-'+i,name,is_active:true}));sales=[...sales,...localSales()];payments=[...payments,...localPayments()];customer.innerHTML='<option value="">Select customer...</option>'+customers.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');let q=new URLSearchParams(location.search).get('customer');if(q&&customers.some(c=>String(c.id)===q)){customer.value=q;selectedCustomer=q;updateCustomer()}else renderHistory()}
function customerTotals(id){let cr=sales.filter(x=>String(x.customer_id)===String(id)).reduce((a,x)=>a+Number(x.amount||0),0),pa=payments.filter(x=>String(x.customer_id)===String(id)).reduce((a,x)=>a+Number(x.amount||0),0);return{cr,pa,bal:cr-pa}}
function updateCustomer(){selectedCustomer=customer.value;let t=customerTotals(selectedCustomer);creditTotal.textContent=money(t.cr);paymentTotal.textContent=money(t.pa);balanceOwing.textContent=money(t.bal);renderHistory();amount.max=Math.max(0,t.bal).toFixed(2)}
function renderHistory(){if(!selectedCustomer){history.innerHTML='<div class="empty">Select a customer to view payments.</div>';return}let rows=payments.filter(x=>String(x.customer_id)===String(selectedCustomer)).sort((a,b)=>String(b.payment_date||'').localeCompare(String(a.payment_date||'')));history.innerHTML=rows.length?'<table><tr><th>Date</th><th>Reference</th><th>Method</th><th>Amount</th><th>Notes</th></tr>'+rows.map(x=>'<tr><td>'+fmt(x.payment_date)+'</td><td>'+esc(x.reference||'—')+'</td><td>'+esc(x.payment_method||'—')+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.notes||'—')+'</td></tr>').join('')+'</table>':'<div class="empty">No payments recorded for this customer yet.</div>'}
async function savePayment(){let id=customer.value,ref=reference.value.trim(),amt=Number(amount.value||0),d=date.value;if(!id||!ref||amt<=0||!d)return show('Please select a customer and enter a receipt/reference, date and payment amount.','error');let t=customerTotals(id);if(amt>Math.max(0,t.bal)+0.0001)return show('Payment cannot be greater than the customer balance owing of '+money(t.bal)+'.','error');let row={customer_id:id,payment_date:new Date(d+'T12:00:00').toISOString(),reference:ref,payment_method:method.value,amount:amt,notes:notes.value.trim()};let saved=false;if(db&&!String(id).startsWith('local-')){let r=await db.from('credit_payments').insert({customer_id:id,payment_date:row.payment_date,reference:row.reference,payment_method:row.payment_method,amount:row.amount,notes:row.notes});if(!r.error)saved=true;else return show('Could not save payment: '+esc(r.error.message),'error')}if(!saved){let arr=localPayments();arr.push(row);localStorage.setItem('nyambo_credit_payments',JSON.stringify(arr));payments.push(row)}else payments.unshift(row);let name=customers.find(c=>String(c.id)===String(id))?.name||'customer';show('Payment '+esc(ref)+' of '+money(amt)+' recorded successfully for '+esc(name)+'.','success');reference.value='';amount.value='';notes.value='';updateCustomer()}
customer.onchange=updateCustomer;save.onclick=savePayment;init();
</script></body></html>
