<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Credit Sale</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:22px}.container{max-width:900px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;padding:13px;border:1px solid #d7dce3;border-radius:8px;font-size:15px}.amount{font-size:28px;font-weight:bold;color:#d71920}.btn{border:0;border-radius:8px;padding:13px 18px;font-weight:bold;background:#e20d18;color:#fff}.dark{background:#172033}.notice,.success,.error{padding:12px;border-radius:8px;margin-bottom:14px}.notice{background:#fff3cd;color:#705b00}.success{background:#e9f8ef;color:#176b36}.error{background:#fde8e8;color:#a61b1b}.hint{font-size:13px;color:#667085;margin-top:6px}@media(max-width:600px){.grid{grid-template-columns:1fr}.header h1{font-size:18px}.header{gap:8px}.header .btn{padding:10px 12px}}</style></head><body><div class="header"><div><h1>NYAMBO FUEL MANAGEMENT</h1><small>Credit Sale</small></div><button class="btn dark" onclick="location.href='credit-customers.html'">Credit Customers</button></div><div class="container"><div id="msg"></div><div class="panel"><h2>Record Credit Sale</h2><p style="color:#667085">Save the customer, garage, fuel, litres, price, amount and invoice together.</p><div class="grid"><div class="field"><label>Customer</label><select id="customer"><option value="">Loading customers...</option></select><div class="hint">Select the customer who is buying on credit.</div></div><div class="field"><label>Garage</label><select id="station"><option value="">Loading garages...</option></select></div><div class="field"><label>Invoice Number</label><input id="invoice" placeholder="e.g. INV-0001"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Fuel Type</label><select id="fuel"><option>Petrol</option><option>Diesel</option></select></div><div class="field"><label>Litres</label><input id="litres" type="number" step="0.01" min="0"></div><div class="field"><label>Price per Litre</label><input id="price" type="number" step="0.01" min="0"></div><div class="field"><label>Amount</label><div class="amount" id="amount">$0.00</div></div></div><div class="field"><label>Notes</label><input id="notes" placeholder="Optional notes"></div><button class="btn" id="save">Save Credit Sale</button></div></div><script>const U='https://dyqwsydxyhomudujumxs.supabase.co',K='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6',db=supabase.createClient(U,K);let customers=[],stations=[];const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});function show(t,c='notice'){$('msg').innerHTML='<div class="'+c+'">'+t+'</div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}async function init(){ $('date').value=new Date().toISOString().slice(0,10);let[c,s]=await Promise.all([db.from('credit_customers').select('id,name').eq('is_active',true).order('name'),db.from('stations').select('id,name').eq('is_active',true).order('name')]);customers=c.data||[];stations=s.data||[];renderCustomers();renderStations();let q=new URLSearchParams(location.search).get('customer');if(q&&customers.some(x=>String(x.id)===q))$('customer').value=q;if(c.error||s.error)show('There was a problem loading database records. Please refresh and try again.','error');else show('Customers and garages loaded.','success')}function renderCustomers(){let el=$('customer');el.innerHTML=customers.length?'<option value="">Select customer...</option>'+customers.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join(''):'<option value="">No customers found</option>'}function renderStations(){let el=$('station');el.innerHTML=stations.length?'<option value="">Select garage...</option>'+stations.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join(''):'<option value="">No garages found</option>'}function recalc(){$('amount').textContent=money((+$('litres').value||0)*(+$('price').value||0))}$('litres').oninput=recalc;$('price').oninput=recalc;async function save(){let customer_id=$('customer').value,station_id=$('station').value,l=+$('litres').value||0,p=+$('price').value||0,a=l*p,invoice=$('invoice').value.trim();if(!customer_id||!station_id||!invoice||l<=0||p<=0)return show('Please select a customer and garage, then complete invoice, litres and price.','error');let r=await db.from('credit_sales').insert({station_id,customer_id,sale_date:$('date').value+'T12:00:00Z',invoice_number:invoice,amount:a,notes:$('notes').value.trim()||null,fuel_type:$('fuel').value,litres:l,price_per_litre:p}).select('id').single();if(r.error)return show('Could not save credit sale: '+r.error.message,'error');show('Credit sale '+esc(invoice)+' saved successfully.','success');$('invoice').value='';$('litres').value='';$('price').value='';$('notes').value='';recalc()}$('save').onclick=save;init();</script></body></html>
