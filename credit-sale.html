<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Credit Sale</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-size:22px}.header small{color:#cbd2dc}.container{max-width:900px;margin:auto;padding:18px}.panel{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:12px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px;color:#475467}.field input,.field select{width:100%;padding:13px;border:1px solid #d7dce3;border-radius:8px;font-size:15px;background:#fff}.amount{font-size:28px;font-weight:bold;color:#d71920}.btn{border:0;border-radius:8px;padding:13px 18px;font-weight:bold;background:#e20d18;color:#fff}.secondary{background:#172033}.notice{padding:12px;background:#fff3cd;color:#705b00;border-radius:8px;margin-bottom:14px}.success{padding:12px;background:#e9f8ef;color:#176b36;border-radius:8px;margin-bottom:14px}.error{padding:12px;background:#fde8e8;color:#a61b1b;border-radius:8px;margin-bottom:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}.header h1{font-size:18px}}
</style></head><body><div class="header"><div><h1>NYAMBO FUEL MANAGEMENT</h1><small>Credit Sale</small></div><button class="btn" onclick="location.href='credit-customers.html'">Credit Customers</button></div><div class="container"><div id="msg"></div><div class="panel"><h2>Record Credit Sale</h2><p style="color:#667085">Save a credit sale against a customer. The customer account will immediately show the credit, invoice number and balance.</p><div class="grid"><div class="field"><label>Customer</label><select id="customer"></select></div><div class="field"><label>Garage</label><select id="station"></select></div><div class="field"><label>Invoice Number</label><input id="invoice" placeholder="e.g. INV-0001"></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Fuel Type</label><select id="fuel"><option>Petrol</option><option>Diesel</option></select></div><div class="field"><label>Litres</label><input id="litres" type="number" step="0.01" min="0" placeholder="0.00"></div><div class="field"><label>Price per Litre</label><input id="price" type="number" step="0.01" min="0" placeholder="0.00"></div><div class="field"><label>Amount</label><div class="amount" id="amount">$0.00</div></div></div><div class="field"><label>Notes</label><input id="notes" placeholder="Optional notes"></div><button class="btn" id="save">Save Credit Sale</button></div></div><script>
const SUPA_URL='https://dyqwsydxyhomudujumxs.supabase.co',SUPA_KEY=['sb_publishable_','rH-erFTla9rTfqA5eGwwNA_ad0BgDq6'].join('');let db=null,customers=[],stations=[];
const seedCustomers=['Malandu','Pride','Sandile','Rhino Rue','Townsend High School','Ardar','Histeel'];
const msg=document.getElementById('msg');const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
function localCustomers(){return JSON.parse(localStorage.getItem('nyambo_credit_customers')||'[]')}
function localSales(){return JSON.parse(localStorage.getItem('nyambo_credit_sales')||'[]')}
function show(t,c='notice'){msg.innerHTML='<div class="'+c+'">'+t+'</div>'}
async function init(){document.getElementById('date').value=new Date().toISOString().slice(0,10);try{db=window.supabase.createClient(SUPA_URL,SUPA_KEY);let [c,s]=await Promise.all([db.from('credit_customers').select('*').order('name'),db.from('stations').select('id,name').eq('is_active',true).order('name')]);if(!c.error)customers=c.data||[];if(!s.error)stations=s.data||[]}catch(e){}if(!customers.length){customers=seedCustomers.map((name,i)=>({id:'local-'+i,name,is_active:true}))}if(!stations.length){stations=[{id:'local-r',name:'Renkini'},{id:'local-12',name:'12th Avenue'},{id:'local-p',name:'Pumula South'},{id:'local-m',name:'Maphisa'},{id:'local-f',name:'FairBridge'}]}document.getElementById('customer').innerHTML=customers.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');document.getElementById('station').innerHTML=stations.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');}
function recalc(){document.getElementById('amount').textContent=money((+document.getElementById('litres').value||0)*(+document.getElementById('price').value||0))}litres.oninput=recalc;price.oninput=recalc;
async function save(){let customer_id=customer.value,station_id=station.value,litres_n=+litres.value||0,price_n=+price.value||0,amount=litres_n*price_n;if(!customer_id||!station_id||!invoice.value.trim()||amount<=0)return show('Please select a customer and garage, enter an invoice number, litres and price.','error');let row={customer_id,station_id,sale_date:new Date(date.value+'T12:00:00').toISOString(),invoice_number:invoice.value.trim(),amount,notes:notes.value.trim(),fuel_type:fuel.value,litres:litres_n,price_per_litre:price_n};let saved=false;if(db&&!String(customer_id).startsWith('local-')){let r=await db.from('credit_sales').insert({station_id,customer_id,sale_date:row.sale_date,invoice_number:row.invoice_number,amount:row.amount,notes:row.notes});if(!r.error)saved=true}if(!saved){let arr=localSales();arr.push(row);localStorage.setItem('nyambo_credit_sales',JSON.stringify(arr));let existing=localCustomers();if(!existing.some(x=>x.id===customer_id)){let c=customers.find(x=>x.id===customer_id);existing.push({id:customer_id,name:c?c.name:'Customer',is_active:true});localStorage.setItem('nyambo_credit_customers',JSON.stringify(existing))}}show('Credit sale '+row.invoice_number+' saved successfully for '+(customers.find(c=>c.id===customer_id)?.name||'customer')+'.','success');invoice.value='';litres.value='';price.value='';notes.value='';recalc()}
save.onclick=save;init();
</script></body></html>
