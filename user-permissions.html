<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Permissions | Red Range Petroleum</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.side{position:fixed;inset:0 auto 0 0;width:240px;background:#0d1b2a;color:#fff}.brand{background:#ef101b;padding:20px;text-align:center;font-weight:bold;font-family:Georgia,serif}.brand small{display:block;font-size:11px}.nav a{display:block;color:#fff;text-decoration:none;padding:13px 15px}.nav a.active{background:#ef101b}.main{margin-left:240px;padding:24px}.panel{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:20px;max-width:1000px}.msg{padding:12px;border-radius:8px;margin:12px 0;display:none}.msg.show{display:block}.ok{background:#eaf7ef;color:#176b37}.err{background:#fdecec;color:#9d2026}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.user{border:1px solid #e1e6ec;border-radius:12px;padding:16px}.user h3{margin:0 0 4px}.id{font-size:11px;color:#667085;word-break:break-all}label{display:block;font-size:12px;font-weight:bold;color:#667085;margin-top:12px}select{width:100%;padding:11px;border:1px solid #ccd3dc;border-radius:8px;background:#fff}.btn{border:0;background:#ef101b;color:#fff;padding:11px 15px;border-radius:8px;font-weight:bold;margin-top:14px;cursor:pointer}.mobile{display:none}@media(max-width:700px){.side{transform:translateX(-100%)}.main{margin-left:0;padding:14px}.mobile{display:block;margin-bottom:12px}.mobile button{font-size:22px;padding:6px 10px}.grid{grid-template-columns:1fr}}</style></head><body><aside class="side"><div class="brand">RED RANGE<small>PETROLEUM</small></div><nav class="nav"><a href="index.html">Dashboard</a><a href="garage-dashboard.html">Garages</a><a href="pump-readings.html">Pump Meter Readings</a><a href="credit-customers.html">Credit Customers</a><a href="credit-sale.html">Credit Sale</a><a href="payment.html">Payment</a><a href="swipe.html">Swipe Received</a><a href="fuel-purchase.html">Fuel Purchase</a><a href="fuel-stock.html">Fuel Stock and Levels</a><a href="expenses.html">Expenses</a><a href="reports.html">Reports</a><a href="settings.html">Settings</a><a class="active" href="user-permissions.html">User Permissions</a></nav></aside><main class="main"><div class="mobile"><button onclick="document.querySelector('.side').style.transform='translateX(0)'">☰</button></div><h1>👥 User Permissions</h1><p>Owner/Admin only. Control each user's role, assigned garage and account status.</p><div id="msg" class="msg"></div><div id="users" class="grid">Loading...</div></main><script>const db=window.supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');let stations=[];const msg=document.getElementById('msg');function notice(t,c){msg.textContent=t;msg.className='msg show '+c}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}async function load(){const [u,s]=await Promise.all([db.from('user_profiles').select('id,full_name,role,station_id,is_active,created_at').order('created_at'),db.from('stations').select('id,name').eq('is_active',true).order('name')]);if(u.error){notice('Unable to load users: '+u.error.message,'err');return}stations=s.data||[];document.getElementById('users').innerHTML=(u.data||[]).map(x=>'<article class="user"><h3>'+esc(x.full_name||'Unnamed user')+'</h3><div class="id">'+esc(x.id)+'</div><label>Role</label><select id="r-'+x.id+'"><option value="owner" '+(x.role==='owner'?'selected':'')+'>Owner / Admin</option><option value="manager" '+(x.role==='manager'?'selected':'')+'>Manager</option><option value="staff" '+(x.role==='staff'?'selected':'')+'>Staff</option></select><label>Assigned Garage</label><select id="s-'+x.id+'"><option value="">All / None</option>'+stations.map(st=>'<option value="'+st.id+'" '+(x.station_id===st.id?'selected':'')+'>'+esc(st.name)+'</option>').join('')+'</select><label>Status</label><select id="a-'+x.id+'"><option value="true" '+(x.is_active?'selected':'')+'>Active</option><option value="false" '+(!x.is_active?'selected':'')+'>Disabled</option></select><button class="btn" onclick="save(\''+x.id+'\')">Save Permissions</button></article>').join('')||'<div>No profiles found. The first authenticated account becomes Owner / Admin automatically.</div>'}async function save(id){const role=document.getElementById('r-'+id).value,station_id=document.getElementById('s-'+id).value||null,is_active=document.getElementById('a-'+id).value==='true';const r=await db.from('user_profiles').update({role,station_id,is_active}).eq('id',id);if(r.error){notice('Could not save: '+r.error.message,'err');return}notice('Permissions saved successfully.','ok');load()}window.addEventListener('red-range-auth-ready',e=>{if(e.detail.role==='owner')load()});</script></body></html>
