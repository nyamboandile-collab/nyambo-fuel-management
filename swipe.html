<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Range Petroleum - Swipe Received</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.top{background:#111b29;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:22px}.top small{color:#cbd2dc}.wrap{max-width:1000px;margin:auto;padding:16px}.back,.btn{border:0;background:#e20d18;color:#fff;padding:12px 16px;border-radius:9px;font-weight:bold;font-size:15px;cursor:pointer}.back{margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:16px}.label{font-size:12px;color:#667085;font-weight:bold}input,select{width:100%;padding:13px;margin-top:7px;border:1px solid #ccd3dc;border-radius:9px;font-size:16px;background:#fff}.btn{margin-top:14px;width:100%}.msg{display:none;padding:13px;border-radius:10px;margin-bottom:14px;font-weight:bold}.ok{background:#eaf7ef;color:#176b37}.err{background:#fdecec;color:#9d2026}.value{font-size:28px;font-weight:bold;margin-top:7px}.green{color:#239447}.table{overflow:auto;margin-top:14px}.table table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}.table th{background:#f1f3f5}.danger{background:#172033;padding:7px 10px;border:0;border-radius:7px;color:#fff;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="top"><h1>RED RANGE PETROLEUM</h1><small>Swipe Money Received</small></div><div class="wrap"><button class="back" onclick="location.href='/'">← Dashboard</button><div id="msg" class="msg"></div><div class="grid"><div class="card"><div class="label">RECORD SWIPE RECEIVED</div><label>Garage</label><select id="station"></select><label>Date</label><input id="date" type="date"><label>Swipe amount ($)</label><input id="amount" type="number" min="0" step="0.01" placeholder="0.00"><label>Notes (optional)</label><input id="notes" type="text" placeholder="e.g. card/swipe sales"><button class="btn" onclick="saveSwipe()">+ Record Swipe Money</button></div><div class="card"><div class="label">TOTAL SWIPE RECEIVED</div><div id="total" class="value green">$0.00</div><p>Swipe is recorded as <b>money received</b>, not as an expense. It will reduce the cash expected at the garage because the customer paid by swipe.</p></div></div><div class="card" style="margin-top:14px"><h2>Swipe History</h2><div class="table"><table><thead><tr><th>Date</th><th>Garage</th><th>Amount</th><th>Notes</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const stations=[['3724f21d-466a-4c11-88fc-3b539906a6d3','12th Avenue'],['40419e28-21c3-4230-ae03-a2e3866b2a9f','Renkini'],['9a33b834-5daf-404d-af27-f8c07f966103','Pumula South'],['95e3eb03-08a9-444e-b874-3df1a93a8360','Maphisa'],['c0a2f3f2-c15e-433e-acf7-7397e14a0fe8','FairBridge']];const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let data=[];function msg(t,c){$('msg').textContent=t;$('msg').className='msg '+c;$('msg').style.display='block'}function init(){ $('station').innerHTML=stations.map(s=>'<option value="'+s[0]+'">'+s[1]+'</option>').join('');$('date').value=new Date().toISOString().slice(0,10);load()}async function load(){const {data:r,error}=await authClient.from('swipe_collections').select('*').order('collection_date',{ascending:false}).order('created_at',{ascending:false});if(error){data=[];msg('Could not load swipe records. Please refresh and try again.','err');return}data=r||[];render()}function render(){ $('total').textContent=money(data.reduce((s,x)=>s+Number(x.amount||0),0));$('rows').innerHTML=data.map(x=>'<tr><td>'+x.collection_date+'</td><td>'+((stations.find(s=>s[0]===x.station_id)||[])[1]||x.station_id)+'</td><td>'+money(x.amount)+'</td><td>'+(x.notes||'')+'</td><td><button class="danger" onclick="removeSwipe(\''+x.id+'\')">Delete</button></td></tr>').join('')||'<tr><td colspan="5">No swipe records yet.</td></tr>'}async function saveSwipe(){const amount=Number($('amount').value||0);if(amount<=0){msg('Enter a swipe amount greater than zero.','err');return}if(!window.RED_RANGE_USER){msg('Please wait for your account to finish loading, then try again.','err');return}const body={station_id:$('station').value,collection_date:$('date').value,amount,notes:$('notes').value.trim()};const {error}=await authClient.from('swipe_collections').insert(body);if(error){msg('Could not save swipe record: '+(error.message||'Database permission error.'),'err');return}$('amount').value='';$('notes').value='';msg('Swipe money recorded successfully.','ok');load()}async function removeSwipe(id){if(!confirm('Delete this swipe record?'))return;const {error}=await authClient.from('swipe_collections').delete().eq('id',id);if(error){msg('Could not delete the record: '+(error.message||'Database permission error.'),'err');return}load()}if(window.RED_RANGE_USER)init();else window.addEventListener('red-range-auth-ready',init,{once:true});</script></body></html>
