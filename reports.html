<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyambo Fuel Management - Reports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fa;
  color:#172033;
}

.header{
  background:#111b29;
  color:white;
  padding:18px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header small{
  display:block;
  margin-top:5px;
  color:#cbd2dc;
}

.back{
  background:#e20d18;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:7px;
  font-weight:bold;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:18px;
}

.filters{
  background:white;
  border:1px solid #e1e6ec;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.filters h2{
  margin-top:0;
}

.filter-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

label{
  font-size:13px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:11px;
  margin-top:6px;
  border:1px solid #d7dce3;
  border-radius:7px;
  background:white;
}

.actions{
  margin-top:14px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:11px 16px;
  border-radius:7px;
  background:#e20d18;
  color:white;
  font-weight:bold;
}

.btn.secondary{
  background:#172033;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.card{
  background:white;
  border:1px solid #e1e6ec;
  border-radius:12px;
  padding:16px;
}

.card .label{
  color:#667085;
  font-size:12px;
}

.card .value{
  font-size:24px;
  font-weight:bold;
  margin-top:8px;
}

.green{color:#239447}
.red{color:#d71920}
.purple{color:#7b3fc6}

.panel{
  background:white;
  border:1px solid #e1e6ec;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
}

.panel h2{
  margin-top:0;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th,td{
  padding:10px;
  border-bottom:1px solid #e8ebef;
  text-align:left;
  white-space:nowrap;
}

th{
  background:#f4f6f8;
  color:#4b5565;
}

.total{
  font-weight:bold;
  background:#fafafa;
}

.report-title{
  display:none;
}

.loading{
  padding:30px;
  text-align:center;
  color:#667085;
}

@media(max-width:800px){
  .filter-grid{
    grid-template-columns:1fr 1fr;
  }

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .header{
    align-items:flex-start;
  }
}

@media(max-width:500px){
  .filter-grid,
  .summary{
    grid-template-columns:1fr;
  }

  .container{
    padding:10px;
  }

  .header{
    padding:14px;
  }

  .header h1{
    font-size:18px;
  }
}

@media print{
  body{
    background:white;
  }

  .header{
    background:white;
    color:black;
    border-bottom:2px solid #111;
  }

  .header small{
    color:#555;
  }

  .back,
  .filters,
  .actions{
    display:none!important;
  }

  .container{
    max-width:none;
    padding:0;
  }

  .panel,
  .card{
    border:1px solid #bbb;
    break-inside:avoid;
  }

  .report-title{
    display:block;
    margin:15px 0;
  }

  table{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>NYAMBO FUEL MANAGEMENT</h1>
    <small>Complete Business Reports</small>
  </div>

  <button class="back" onclick="location.href='/'">
    ← Dashboard
  </button>
</div>

<div class="container">

  <div class="filters">

    <h2>Reports Centre</h2>

    <div class="filter-grid">

      <div>
        <label>From</label>
        <input id="from" type="date">
      </div>

      <div>
        <label>To</label>
        <input id="to" type="date">
      </div>

      <div>
        <label>Garage</label>
        <select id="garage">
          <option value="">All Garages</option>
        </select>
      </div>

      <div>
        <label>Report Period</label>
        <select id="period">
          <option value="custom">Custom Dates</option>
          <option value="month">Current Month</option>
          <option value="year">Current Year</option>
        </select>
      </div>

    </div>

    <div class="actions">
      <button class="btn" onclick="generateReport()">
        Generate Report
      </button>

      <button class="btn secondary" onclick="window.print()">
        🖨 Print Report
      </button>
    </div>

  </div>

  <div class="report-title">
    <h1>NYAMBO FUEL MANAGEMENT</h1>
    <p id="printedPeriod"></p>
  </div>

  <div id="report">
    <div class="loading">Loading report data...</div>
  </div>

</div>

<script>

const SUPABASE_URL =
  'https://dyqwsydxyhomudujumxs.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6';

const db =
  supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let data = {
  stations:[],
  pumpSales:[],
  creditSales:[],
  payments:[],
  customers:[],
  purchases:[],
  expenses:[]
};

const money = n =>
  '$' + Number(n || 0).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  });

const litres = n =>
  Number(n || 0).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  }) + ' L';

function dateOnly(value){
  if(!value) return '';
  return String(value).slice(0,10);
}

function inRange(value,from,to){
  const d=dateOnly(value);
  return d >= from && d <= to;
}

function setDefaultDates(){

  const now=new Date();

  const first=new Date(
    now.getFullYear(),
    now.getMonth(),
    1
  );

  const today=new Date();

  const iso=d =>
    d.toISOString().slice(0,10);

  from.value=iso(first);
  to.value=iso(today);
}

async function loadData(){

  const results=await Promise.all([

    db.from('stations')
      .select('id,name')
      .eq('is_active',true)
      .order('name'),

    db.from('pump_reading_history')
      .select('*')
      .order('reading_date',{ascending:false}),

    db.from('credit_sales')
      .select('*')
      .order('sale_date',{ascending:false}),

    db.from('credit_payments')
      .select('*')
      .order('payment_date',{ascending:false}),

    db.from('credit_customers')
      .select('*')
      .order('name'),

    db.from('fuel_purchases')
      .select('*')
      .order('purchase_date',{ascending:false}),

    db.from('expenses')
      .select('*')
      .order('expense_date',{ascending:false})

  ]);

  data.stations=results[0].data || [];
  data.pumpSales=results[1].data || [];
  data.creditSales=results[2].data || [];
  data.payments=results[3].data || [];
  data.customers=results[4].data || [];
  data.purchases=results[5].data || [];
  data.expenses=results[6].data || [];

  if(results.some(x=>x.error)){
    console.error(results);
    report.innerHTML=
      '<div class="panel"><h2>Unable to load report</h2>' +
      '<p>Please check the database connection.</p></div>';
    return;
  }

  garage.innerHTML=
    '<option value="">All Garages</option>' +
    data.stations.map(s =>
      '<option value="'+s.id+'">'+s.name+'</option>'
    ).join('');

  generateReport();
}

function getFilters(){

  let f=from.value;
  let t=to.value;

  const now=new Date();

  if(period.value==='month'){

    f=new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    ).toISOString().slice(0,10);

    t=new Date(
      now.getFullYear(),
      now.getMonth()+1,
      0
    ).toISOString().slice(0,10);

    from.value=f;
    to.value=t;
  }

  if(period.value==='year'){

    f=now.getFullYear()+'-01-01';

    t=now.getFullYear()+'-12-31';

    from.value=f;
    to.value=t;
  }

  return {
    from:f,
    to:t,
    garage:garage.value
  };
}

function generateReport(){

  const f=getFilters();

  if(!f.from || !f.to){
    alert('Please select the report dates.');
    return;
  }

  document.getElementById('printedPeriod').textContent =
    'Report period: ' + f.from + ' to ' + f.to;

  let pumps=data.pumpSales.filter(x =>
    inRange(x.reading_date,f.from,f.to)
  );

  let credits=data.creditSales.filter(x =>
    inRange(x.sale_date,f.from,f.to)
  );

  let payments=data.payments.filter(x =>
    inRange(x.payment_date,f.from,f.to)
  );

  let purchases=data.purchases.filter(x =>
    inRange(x.purchase_date,f.from,f.to)
  );

  let expenses=data.expenses.filter(x =>
    inRange(x.expense_date,f.from,f.to)
  );

  if(f.garage){

    pumps=pumps.filter(x =>
      x.station_id===f.garage
    );

    credits=credits.filter(x =>
      x.station_id===f.garage
    );

    purchases=purchases.filter(x =>
      x.station_id===f.garage
    );

    expenses=expenses.filter(x =>
      x.station_id===f.garage
    );
  }

  renderReport(
    pumps,
    credits,
    payments,
    purchases,
    expenses,
    f
  );
}

function renderReport(
  pumps,
  credits,
  payments,
  purchases,
  expenses,
  f
){

  const petrol=pumps.filter(x =>
    String(x.fuel_type).toLowerCase()==='petrol'
  );

  const diesel=pumps.filter(x =>
    String(x.fuel_type).toLowerCase()==='diesel'
  );

  const petrolLitres=petrol.reduce(
    (a,x)=>a+Number(x.litres_sold||0),0
  );

  const dieselLitres=diesel.reduce(
    (a,x)=>a+Number(x.litres_sold||0),0
  );

  const petrolMoney=petrol.reduce(
    (a,x)=>a+Number(x.money||0),0
  );

  const dieselMoney=diesel.reduce(
    (a,x)=>a+Number(x.money||0),0
  );

  const pumpMoney=
    petrolMoney+dieselMoney;

  const creditMoney=credits.reduce(
    (a,x)=>a+Number(x.amount||0),0
  );

  const paymentMoney=payments.reduce(
    (a,x)=>a+Number(x.amount||0),0
  );

  const purchaseMoney=purchases.reduce(
    (a,x)=>a+Number(x.total_amount||0),0
  );

  const expenseMoney=expenses.reduce(
    (a,x)=>a+Number(x.amount||0),0
  );

  const businessRevenue=
    pumpMoney+creditMoney;

  const profit=
    businessRevenue-purchaseMoney-expenseMoney;

  const outstandingTotal=
    data.customers.reduce((total,c)=>{

      const cSales=data.creditSales
        .filter(x=>x.customer_id===c.id)
        .reduce((a,x)=>a+Number(x.amount||0),0);

      const cPayments=data.payments
        .filter(x=>x.customer_id===c.id)
        .reduce((a,x)=>a+Number(x.amount||0),0);

      return total + Math.max(0,cSales-cPayments);

    },0);

  report.innerHTML=`

    <div class="summary">

      <div class="card">
        <div class="label">PETROL SOLD</div>
        <div class="value green">
          ${litres(petrolLitres)}
        </div>
        <small>${money(petrolMoney)}</small>
      </div>

      <div class="card">
        <div class="label">DIESEL SOLD</div>
        <div class="value purple">
          ${litres(dieselLitres)}
        </div>
        <small>${money(dieselMoney)}</small>
      </div>

      <div class="card">
        <div class="label">TOTAL SALES</div>
        <div class="value">
          ${money(businessRevenue)}
        </div>
        <small>Pump + Credit Sales</small>
      </div>

      <div class="card">
        <div class="label">NET PROFIT / LOSS</div>
        <div class="value ${profit>=0?'green':'red'}">
          ${money(profit)}
        </div>
        <small>After purchases and expenses</small>
      </div>

    </div>

    <div class="panel">

      <h2>1. Monthly Fuel Sales</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Fuel Type</th>
          <th>Litres Sold</th>
          <th>Sales Money</th>
        </tr>

        <tr>
          <td>Petrol</td>
          <td>${litres(petrolLitres)}</td>
          <td>${money(petrolMoney)}</td>
        </tr>

        <tr>
          <td>Diesel</td>
          <td>${litres(dieselLitres)}</td>
          <td>${money(dieselMoney)}</td>
        </tr>

        <tr class="total">
          <td>TOTAL</td>
          <td>${litres(petrolLitres+dieselLitres)}</td>
          <td>${money(pumpMoney)}</td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>2. Sales by Garage</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Garage</th>
          <th>Petrol (L)</th>
          <th>Diesel (L)</th>
          <th>Total Litres</th>
          <th>Sales Money</th>
        </tr>

        ${garageRows(pumps)}

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>3. Credits Made</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Date</th>
          <th>Invoice</th>
          <th>Customer</th>
          <th>Amount</th>
        </tr>

        ${credits.length
          ? credits.map(x=>`

            <tr>
              <td>${dateOnly(x.sale_date)}</td>
              <td>${x.invoice_number||'-'}</td>
              <td>${customerName(x.customer_id)}</td>
              <td>${money(x.amount)}</td>
            </tr>

          `).join('')
          : '<tr><td colspan="4">No credit sales in this period.</td></tr>'
        }

        <tr class="total">
          <td colspan="3">TOTAL CREDIT SALES</td>
          <td>${money(creditMoney)}</td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>4. Payments Received</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Date</th>
          <th>Customer</th>
          <th>Payment Method</th>
          <th>Reference</th>
          <th>Amount</th>
        </tr>

        ${payments.length
          ? payments.map(x=>`

            <tr>
              <td>${dateOnly(x.payment_date)}</td>
              <td>${customerName(x.customer_id)}</td>
              <td>${x.payment_method||'-'}</td>
              <td>${x.reference||'-'}</td>
              <td>${money(x.amount)}</td>
            </tr>

          `).join('')
          : '<tr><td colspan="5">No payments in this period.</td></tr>'
        }

        <tr class="total">
          <td colspan="4">TOTAL PAYMENTS</td>
          <td>${money(paymentMoney)}</td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>5. Customers Owing</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Customer</th>
          <th>Total Credit</th>
          <th>Total Payments</th>
          <th>Balance Owing</th>
        </tr>

        ${customerRows()}

        <tr class="total">
          <td colspan="3">TOTAL OUTSTANDING</td>
          <td>${money(outstandingTotal)}</td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>6. Fuel Purchased</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Date</th>
          <th>Garage</th>
          <th>Fuel</th>
          <th>Litres</th>
          <th>Price/Litre</th>
          <th>Total Cost</th>
          <th>Status</th>
        </tr>

        ${purchases.length
          ? purchases.map(x=>`

            <tr>
              <td>${dateOnly(x.purchase_date)}</td>
              <td>${stationName(x.station_id)}</td>
              <td>${x.fuel_type||'-'}</td>
              <td>${litres(x.litres)}</td>
              <td>${money(x.price_per_litre)}</td>
              <td>${money(x.total_amount)}</td>
              <td>${x.payment_status||'-'}</td>
            </tr>

          `).join('')
          : '<tr><td colspan="7">No fuel purchases in this period.</td></tr>'
        }

        <tr class="total">
          <td colspan="5">TOTAL FUEL PURCHASES</td>
          <td>${money(purchaseMoney)}</td>
          <td></td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>7. Expenses</h2>

      <div class="table-wrap">
      <table>
        <tr>
          <th>Date</th>
          <th>Garage</th>
          <th>Category</th>
          <th>Description</th>
          <th>Payment Method</th>
          <th>Amount</th>
        </tr>

        ${expenses.length
          ? expenses.map(x=>`

            <tr>
              <td>${dateOnly(x.expense_date)}</td>
              <td>${stationName(x.station_id)}</td>
              <td>${x.category||'-'}</td>
              <td>${x.description||'-'}</td>
              <td>${x.payment_method||'-'}</td>
              <td>${money(x.amount)}</td>
            </tr>

          `).join('')
          : '<tr><td colspan="6">No expenses in this period.</td></tr>'
        }

        <tr class="total">
          <td colspan="5">TOTAL EXPENSES</td>
          <td>${money(expenseMoney)}</td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>8. Profit / Loss Summary</h2>

      <div class="table-wrap">
      <table>

        <tr>
          <th>Description</th>
          <th>Amount</th>
        </tr>

        <tr>
          <td>Pump Fuel Sales</td>
          <td>${money(pumpMoney)}</td>
        </tr>

        <tr>
          <td>Credit Sales</td>
          <td>${money(creditMoney)}</td>
        </tr>

        <tr class="total">
          <td>Total Business Revenue</td>
          <td>${money(businessRevenue)}</td>
        </tr>

        <tr>
          <td>Fuel Purchased</td>
          <td>${money(purchaseMoney)}</td>
        </tr>

        <tr>
          <td>Expenses</td>
          <td>${money(expenseMoney)}</td>
        </tr>

        <tr class="total">
          <td>NET PROFIT / (LOSS)</td>
          <td class="${profit>=0?'green':'red'}">
            ${money(profit)}
          </td>
        </tr>

      </table>
      </div>

    </div>

    <div class="panel">

      <h2>9. Complete Management Summary</h2>

      <div class="table-wrap">
      <table>

        <tr>
          <th>Item</th>
          <th>Total</th>
        </tr>

        <tr>
          <td>Petrol Litres Sold</td>
          <td>${litres(petrolLitres)}</td>
        </tr>

        <tr>
          <td>Diesel Litres Sold</td>
          <td>${litres(dieselLitres)}</td>
        </tr>

        <tr>
          <td>Pump Sales</td>
          <td>${money(pumpMoney)}</td>
        </tr>

        <tr>
          <td>Credits Made</td>
          <td>${money(creditMoney)}</td>
        </tr>

        <tr>
          <td>Payments Received</td>
          <td>${money(paymentMoney)}</td>
        </tr>

        <tr>
          <td>Outstanding Customer Balances</td>
          <td>${money(outstandingTotal)}</td>
        </tr>

        <tr>
          <td>Fuel Purchased</td>
          <td>${money(purchaseMoney)}</td>
        </tr>

        <tr>
          <td>Expenses</td>
          <td>${money(expenseMoney)}</td>
        </tr>

        <tr class="total">
          <td>NET PROFIT / (LOSS)</td>
          <td class="${profit>=0?'green':'red'}">
            ${money(profit)}
          </td>
        </tr>

      </table>
      </div>

    </div>

  `;
}

function stationName(id){

  const s=data.stations.find(x=>x.id===id);

  return s ? s.name : '-';
}

function customerName(id){

  const c=data.customers.find(x=>x.id===id);

  return c ? c.name : '-';
}

function garageRows(pumps){

  return data.stations.map(s=>{

    const rows=pumps.filter(x =>
      x.station_id===s.id
    );

    const petrol=rows
      .filter(x=>String(x.fuel_type).toLowerCase()==='petrol')
      .reduce((a,x)=>a+Number(x.litres_sold||0),0);

    const diesel=rows
      .filter(x=>String(x.fuel_type).toLowerCase()==='diesel')
      .reduce((a,x)=>a+Number(x.litres_sold||0),0);

    const sales=rows.reduce(
      (a,x)=>a+Number(x.money||0),0
    );

    return `
      <tr>
        <td>${s.name}</td>
        <td>${litres(petrol)}</td>
        <td>${litres(diesel)}</td>
        <td>${litres(petrol+diesel)}</td>
        <td>${money(sales)}</td>
      </tr>
    `;

  }).join('');
}

function customerRows(){

  return data.customers.map(c=>{

    const sales=data.creditSales
      .filter(x=>x.customer_id===c.id)
      .reduce(
        (a,x)=>a+Number(x.amount||0),0
      );

    const payments=data.payments
      .filter(x=>x.customer_id===c.id)
      .reduce(
        (a,x)=>a+Number(x.amount||0),0
      );

    const balance=Math.max(
      0,
      sales-payments
    );

    return `
      <tr>
        <td>${c.name}</td>
        <td>${money(sales)}</td>
        <td>${money(payments)}</td>
        <td class="${balance>0?'red':''}">
          ${money(balance)}
        </td>
      </tr>
    `;

  }).join('');
}

setDefaultDates();

loadData();

</script>

</body>
</html>
