<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Reports</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.container{max-width:1400px;margin:auto;padding:14px}.filters,.panel,.card{background:#fff;border:1px solid #e1e6ec;border-radius:12px;padding:16px;margin-bottom:14px}.filter-grid,.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.summary{margin-bottom:14px}.card{margin:0}.label{font-size:11px;font-weight:bold;color:#667085}.value{font-size:23px;font-weight:bold;margin-top:7px}.green{color:#239447}.red{color:#d71920}.purple{color:#7b3fc6}input,select{width:100%;padding:10px;border:1px solid #d7dce3;border-radius:7px;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:7px;padding:11px 15px;background:#e20d18;color:#fff;font-weight:bold}.dark{background:#172033}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f1f3f5}.notice{padding:12px;background:#fff3cd;border-radius:8px;color:#705b00;margin-bottom:12px}@media(max-width:800px){.filter-grid,.summary{grid-template-columns:1fr 1fr}}@media(max-width:500px){.filter-grid,.summary{grid-template-columns:1fr}}@media print{.filters,.actions,.header button{display:none}.header{background:#fff;color:#000;border-bottom:2px solid #222}.panel,.card{break-inside:avoid}}
</style></head><body><div class="header"><div><h1>NYAMBO FUEL MANAGEMENT</h1><small>Complete Business Reports</small></div><button class="btn" onclick="location.href='/'">← Dashboard</button></div><main class="container"><div class="filters"><h2>Reports Centre</h2><div class="filter-grid"><div><label>From</label><input id="from" type="date"></div><div><label>To</label><input id="to" type="date"></div><div><label>Garage</label><select id="garage"><option value="">All Garages</option></select></div><div><label>Period</label><select id="period"><option value="custom">Custom</option><option value="month">Current Month</option><option value="year">Current Year</option></select></div></div><div class="actions"><button class="btn" onclick="generate()">Generate Report</button><button class="btn dark" onclick="window.print()">🖨 Print Report</button></div></div><div id="msg"></div><div id="report"></div></main><script>const U='https://dyqwsydxyhomudujumxs.supabase.co',K='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6',db=supabase.createClient(U,K);let D={stations:[],pumps:[],credits:[],payments:[],customers:[],purchases:[],expenses:[],stock:[],tanks:[]};const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L',fmt=v=>{let p=String(v||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v},dateOnly=v=>String(v||'').slice(0,10),stationName=id=>(D.stations.find(s=>String(s.id)===String(id))||{}).name||'Unknown';function defaults(){let n=new Date(),f=new Date(n.getFullYear(),n.getMonth(),1);from.value=f.toISOString().slice(0,10);to.value=n.toISOString().slice(0,10)}async function init(){defaults();let r=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('pump_reading_history').select('*'),db.from('credit_sales').select('*'),db.from('credit_payments').select('*'),db.from('credit_customers').select('*'),db.from('fuel_purchases').select('*'),db.from('expenses').select('*'),db.from('daily_fuel_stock').select('*'),db.from('fuel_tanks').select('*').eq('is_active',true)]);D.stations=r[0].data||[];D.pumps=r[1].data||[];D.credits=r[2].data||[];D.payments=r[3].data||[];D.customers=r[4].data||[];D.purchases=r[5].data||[];D.expenses=r[6].data||[];D.stock=r[7].data||[];D.tanks=r[8].data||[];if(r.some(x=>x.error)){$('msg').innerHTML='<div class="notice">Some report data could not be loaded.</div>'}garage.innerHTML='<option value="">All Garages</option>'+D.stations.map(s=>'<option value="'+s.id+'">'+s.name+'</option>').join('');generate()}function filters(){let f=from.value,t=to.value,n=new Date();if(period.value==='month'){f=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10);t=new Date(n.getFullYear(),n.getMonth()+1,0).toISOString().slice(0,10);from.value=f;to.value=t}if(period.value==='year'){f=n.getFullYear()+'-01-01';t=n.getFullYear()+'-12-31';from.value=f;to.value=t}return{f,t,g:garage.value}}function between(v,f,t){let d=dateOnly(v);return d>=f&&d<=t}function generate(){let q=filters(),g=q.g,p=D.pumps.filter(x=>between(x.reading_date,q.f,q.t)),c=D.credits.filter(x=>between(x.sale_date,q.f,q.t)),pa=D.payments.filter(x=>between(x.payment_date,q.f,q.t)),pu=D.purchases.filter(x=>between(x.purchase_date,q.f,q.t)),ex=D.expenses.filter(x=>between(x.expense_date,q.f,q.t));if(g){p=p.filter(x=>String(x.station_id)===String(g));c=c.filter(x=>String(x.station_id)===String(g));pu=pu.filter(x=>String(x.station_id)===String(g));ex=ex.filter(x=>String(x.station_id)===String(g))}let pl=p.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),di=p.filter(x=>String(x.fuel_type).toLowerCase()==='diesel'),plL=pl.reduce((a,x)=>a+Number(x.litres_sold||0),0),diL=di.reduce((a,x)=>a+Number(x.litres_sold||0),0),salesMoney=p.reduce((a,x)=>a+Number(x.money||x.money_received||0),0),creditTotal=c.reduce((a,x)=>a+Number(x.amount||0),0),paymentTotal=pa.reduce((a,x)=>a+Number(x.amount||0),0),purchaseTotal=pu.reduce((a,x)=>a+Number(x.total_amount||0),0),expenseTotal=ex.reduce((a,x)=>a+Number(x.amount||0),0),profit=salesMoney-purchaseTotal-expenseTotal,owing=D.customers.reduce((a,x)=>{let cr=D.credits.filter(y=>String(y.customer_id)===String(x.id)).reduce((s,y)=>s+Number(y.amount||0),0),pm=D.payments.filter(y=>String(y.customer_id)===String(x.id)).reduce((s,y)=>s+Number(y.amount||0),0);return a+Math.max(0,cr-pm)},0);let garageRows=D.stations.filter(s=>!g||String(s.id)===String(g)).map(s=>{let z=p.filter(x=>String(x.station_id)===String(s.id));return '<tr><td>'+s.name+'</td><td>'+lit(z.filter(x=>String(x.fuel_type).toLowerCase()==='petrol').reduce((a,x)=>a+Number(x.litres_sold||0),0))+'</td><td>'+lit(z.filter(x=>String(x.fuel_type).toLowerCase()==='diesel').reduce((a,x)=>a+Number(x.litres_sold||0),0))+'</td><td>'+money(z.reduce((a,x)=>a+Number(x.money||x.money_received||0),0))+'</td></tr>'}).join('');let custRows=D.customers.filter(x=>x.is_active!==false).map(x=>{let cr=D.credits.filter(y=>String(y.customer_id)===String(x.id)).reduce((a,y)=>a+Number(y.amount||0),0),pm=D.payments.filter(y=>String(y.customer_id)===String(x.id)).reduce((a,y)=>a+Number(y.amount||0),0);return '<tr><td>'+x.name+'</td><td>'+money(cr)+'</td><td>'+money(pm)+'</td><td class="'+(cr-pm>0?'red':'green')+'">'+money(cr-pm)+'</td></tr>'}).join('');let purchaseRows=pu.map(x=>'<tr><td>'+fmt(x.purchase_date)+'</td><td>'+stationName(x.station_id)+'</td><td>'+x.fuel_type+'</td><td>'+lit(x.litres)+'</td><td>'+money(x.price_per_litre)+'</td><td>'+money(x.total_amount)+'</td></tr>').join('');let expenseRows=ex.map(x=>'<tr><td>'+fmt(x.expense_date)+'</td><td>'+stationName(x.station_id)+'</td><td>'+x.category+'</td><td>'+x.description+'</td><td>'+money(x.amount)+'</td></tr>').join('');report.innerHTML='<div class="summary"><div class="card"><div class="label">PETROL SOLD</div><div class="value green">'+lit(plL)+'</div></div><div class="card"><div class="label">DIESEL SOLD</div><div class="value purple">'+lit(diL)+'</div></div><div class="card"><div class="label">SALES MONEY</div><div class="value">'+money(salesMoney)+'</div></div><div class="card"><div class="label">NET PROFIT / LOSS</div><div class="value '+(profit>=0?'green':'red')+'">'+money(profit)+'</div></div><div class="card"><div class="label">CREDIT MADE</div><div class="value">'+money(creditTotal)+'</div></div><div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value green">'+money(paymentTotal)+'</div></div><div class="card"><div class="label">FUEL PURCHASES</div><div class="value">'+money(purchaseTotal)+'</div></div><div class="card"><div class="label">OUTSTANDING</div><div class="value red">'+money(owing)+'</div></div></div><div class="panel"><h2>Sales by Garage</h2><div class="table"><table><tr><th>Garage</th><th>Petrol</th><th>Diesel</th><th>Money</th></tr>'+garageRows+'</table></div></div><div class="panel"><h2>Credit Customers</h2><div class="table"><table><tr><th>Customer</th><th>Credit Made</th><th>Payments</th><th>Balance</th></tr>'+custRows+'</table></div></div><div class="panel"><h2>Fuel Purchased</h2><div class="table"><table><tr><th>Date</th><th>Garage</th><th>Fuel</th><th>Litres</th><th>Cost/L</th><th>Total</th></tr>'+purchaseRows+'</table></div></div><div class="panel"><h2>Expenses</h2><div class="table"><table><tr><th>Date</th><th>Garage</th><th>Category</th><th>Description</th><th>Amount</th></tr>'+expenseRows+'</table></div></div><div class="panel"><h2>Report Totals</h2><p><b>Total litres sold:</b> '+lit(plL+diL)+' &nbsp; <b>Purchases:</b> '+money(purchaseTotal)+' &nbsp; <b>Expenses:</b> '+money(expenseTotal)+' &nbsp; <b>Profit/Loss:</b> '+money(profit)+'</p><p><b>Period:</b> '+fmt(q.f)+' to '+fmt(q.t)+'</p></div>'}init();</script></body></html>
