<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyambo Fuel Management - Pump Readings</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.top{background:#111b29;color:#fff;padding:15px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:20px}.top small{color:#cbd2dc}.wrap{max-width:1100px;margin:auto;padding:12px}.back{margin:10px 0;background:#e20d18;color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:bold}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.station{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:14px}.label{font-size:12px;color:#667085;font-weight:bold}.value{font-size:24px;font-weight:bold;margin-top:7px}.green{color:#239447}.purple{color:#7b3fc6}.red{color:#d71920}.station{margin-top:12px}.station h2{margin:0 0 10px}.pump{border:1px solid #e1e6ec;border-radius:12px;padding:12px;margin:10px 0;background:#fbfcfd}.pump-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{padding:7px 10px;border-radius:20px;font-size:12px;font-weight:bold}.tag.petrol{background:#e9f7ee;color:#239447}.tag.diesel{background:#f1eafa;color:#7b3fc6}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}label{font-size:12px;font-weight:bold;color:#667085}input{width:100%;padding:11px;margin-top:5px;border:1px solid #ccd3dc;border-radius:8px;font-size:16px}.readonly{background:#eef1f4}.calc{margin-top:10px;padding:10px;background:#f3f5f7;border-radius:8px}.actions{display:flex;gap:8px;margin-top:10px}.btn{border:0;background:#e20d18;color:#fff;padding:10px 13px;border-radius:8px;font-weight:bold}.btn.secondary{background:#172033}.btn:disabled{opacity:.5}.history{margin-top:14px;overflow:auto}.history table{width:100%;border-collapse:collapse;font-size:12px}.history th,.history td{padding:9px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}.history th{background:#f1f3f5}.msg{display:none;padding:10px;border-radius:8px;margin:10px 0}.ok{background:#eaf7ef;color:#176b37}.err{background:#fdecec;color:#9d2026}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}.top h1{font-size:18px}}@media(max-width:450px){.summary{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="top"><h1>NYAMBO FUEL MANAGEMENT</h1><small>Pump Meter Readings</small></div>
<div class="wrap">
<button class="back" onclick="location.href='/'">← Dashboard</button>
<div id="msg" class="msg"></div>
<div class="summary">
<div class="card"><div class="label">PETROL SOLD</div><div id="petrolLitres" class="value green">0.00 L</div><div id="petrolMoney">$0.00</div></div>
<div class="card"><div class="label">DIESEL SOLD</div><div id="dieselLitres" class="value purple">0.00 L</div><div id="dieselMoney">$0.00</div></div>
<div class="card"><div class="label">TOTAL LITRES</div><div id="totalLitres" class="value">0.00 L</div></div>
<div class="card"><div class="label">TOTAL MONEY</div><div id="totalMoney" class="value">$0.00</div></div>
</div>
<div id="stations"></div>
<div class="history card"><h2>Recent Reading History</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Garage</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr></thead><tbody id="history"></tbody></table></div></div>
</div>
<script>
const db=supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');
let stations=[],pumps=[],readings=[];
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='msg '+type;m.style.display='block';setTimeout(()=>m.style.display='none',3500)}
function latestFor(pid){return readings.find(r=>r.pump_id===pid)||null}
function render(){
let pt=readings.filter(r=>String(r.fuel_type).toLowerCase()==='petrol'),ds=readings.filter(r=>String(r.fuel_type).toLowerCase()==='diesel');
const sum=a=>a.reduce((z,r)=>z+Number(r.litres_sold||0),0),cash=a=>a.reduce((z,r)=>z+Number(r.money||r.money_received||0),0);
document.getElementById('petrolLitres').textContent=lit(sum(pt));document.getElementById('dieselLitres').textContent=lit(sum(ds));document.getElementById('totalLitres').textContent=lit(sum(readings));document.getElementById('petrolMoney').textContent=money(cash(pt));document.getElementById('dieselMoney').textContent=money(cash(ds));document.getElementById('totalMoney').textContent=money(cash(readings));
const root=document.getElementById('stations');root.innerHTML=stations.map(s=>{const ps=pumps.filter(p=>p.station_id===s.id);return '<div class="station"><h2>'+esc(s.name)+'</h2>'+ps.map(p=>{const h=latestFor(p.id);const opening=h?Number(h.closing_meter):0;const cls=String(p.fuel_type).toLowerCase()==='petrol'?'petrol':'diesel';return '<div class="pump"><div class="pump-head"><b>'+esc(p.fuel_type)+' Pump '+esc(p.pump_number)+'</b><span class="tag '+cls+'">'+esc(p.fuel_type)+'</span></div><div class="fields"><div><label>Opening meter</label><input class="readonly" id="o-'+p.id+'" type="number" step="0.001" value="'+opening.toFixed(3)+'" readonly></div><div><label>Closing meter</label><input id="c-'+p.id+'" type="number" step="0.001" min="'+opening+'" placeholder="Enter closing"></div><div><label>Price / litre</label><input id="pr-'+p.id+'" type="number" step="0.01" min="0" placeholder="e.g. 1.90"></div><div><label>Date</label><input id="d-'+p.id+'" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><div class="calc" id="calc-'+p.id+'">Enter closing meter and price to calculate litres and money.</div><div class="actions"><button class="btn" onclick="save(\''+p.id+'\')">Save Reading</button><button class="btn secondary" onclick="showHistory(\''+p.id+'\')">History</button></div></div>'}).join('')+'</div>'}).join('');
readings.slice(0,50).forEach(r=>{const c=document.getElementById('c-'+r.pump_id),pr=document.getElementById('pr-'+r.pump_id);if(c){c.oninput=()=>calc(r.pump_id);pr.oninput=()=>calc(r.pump_id)}});
document.getElementById('history').innerHTML=readings.slice(0,50).map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+esc(r.station_name)+'</td><td>'+esc(r.pump_number)+'</td><td>'+esc(r.fuel_type)+'</td><td>'+esc(r.opening_meter)+'</td><td>'+esc(r.closing_meter)+'</td><td>'+lit(r.litres_sold)+'</td><td>'+money(r.money||r.money_received)+'</td></tr>').join('')||'<tr><td colspan="8">No readings yet.</td></tr>';
}
function calc(pid){const o=Number(document.getElementById('o-'+pid).value),c=Number(document.getElementById('c-'+pid).value),p=Number(document.getElementById('pr-'+pid).value),box=document.getElementById('calc-'+pid);if(!Number.isFinite(c)||!Number.isFinite(p)){box.textContent='Enter closing meter and price to calculate litres and money.';return}if(c<o){box.innerHTML='<span class="red"><b>Invalid:</b> closing meter cannot be lower than opening meter.</span>';return}box.textContent='Litres sold: '+lit(c-o)+'  •  Money sold: '+money((c-o)*p)}
async function save(pid){const o=Number(document.getElementById('o-'+pid).value),c=Number(document.getElementById('c-'+pid).value),p=Number(document.getElementById('pr-'+pid).value),date=document.getElementById('d-'+pid).value;if(!Number.isFinite(o)||!Number.isFinite(c)||!Number.isFinite(p)||!date)return show('Please enter closing meter, price and date.','err');if(c<o)return show('Closing meter cannot be lower than opening meter.','err');if(p<0)return show('Price per litre cannot be negative.','err');const duplicate=readings.some(r=>r.pump_id===pid&&String(r.reading_date)===date);if(duplicate)return show('A reading for this pump and date already exists.','err');const res=await db.from('pump_readings').insert({pump_id:pid,reading_date:date,opening_meter:o,closing_meter:c,price_per_litre:p,money_received:(c-o)*p});if(res.error)return show(res.error.message,'err');show('Reading saved successfully.','ok');await load();}
function showHistory(pid){const p=pumps.find(x=>x.id===pid);const rows=readings.filter(r=>r.pump_id===pid);const body=rows.map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+esc(r.opening_meter)+'</td><td>'+esc(r.closing_meter)+'</td><td>'+lit(r.litres_sold)+'</td><td>'+money(r.money||r.money_received)+'</td></tr>').join('')||'<tr><td colspan="5">No readings.</td></tr>';alert((p?p.fuel_type+' Pump '+p.pump_number:'Pump')+' history\n\n'+rows.map(r=>r.reading_date+' | '+r.opening_meter+' → '+r.closing_meter+' | '+lit(r.litres_sold)+' | '+money(r.money||r.money_received)).join('\n'))}
async function load(){const a=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type').eq('is_active',true).order('pump_number'),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);if(a.some(x=>x.error)){show('Could not load pump data from the database.','err');return}stations=a[0].data||[];pumps=a[1].data||[];readings=a[2].data||[];render()}
load();
</script>
</body>
</html>
