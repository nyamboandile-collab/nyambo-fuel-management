<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management - Pump Readings</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.top{background:#111b29;color:#fff;padding:16px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:20px}.top small{color:#cbd2dc}.wrap{max-width:1150px;margin:auto;padding:14px}.back,.btn{border:0;background:#e20d18;color:#fff;padding:11px 14px;border-radius:9px;font-weight:bold;font-size:14px;cursor:pointer}.back{margin-bottom:14px}.btn:disabled{opacity:.65;cursor:wait}.msg{display:none;padding:12px;border-radius:10px;margin-bottom:12px;font-weight:bold}.ok{background:#eaf7ef;color:#176b37}.err{background:#fdecec;color:#9d2026}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.station,.pump{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:15px}.value{font-size:25px;font-weight:bold;margin-top:7px}.label{font-size:12px;color:#667085;font-weight:bold}.green{color:#239447}.purple{color:#7b3fc6}.red{color:#d71920}.station{margin-top:14px}.station h2{margin:0 0 10px}.pump{margin:10px 0;background:#fbfcfd}.head{display:flex;justify-content:space-between;align-items:center}.tag{padding:7px 10px;border-radius:20px;font-size:12px;font-weight:bold}.tag.petrol{background:#e9f7ee;color:#239447}.tag.diesel{background:#f1eafa;color:#7b3fc6}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}label{font-size:12px;font-weight:bold;color:#667085}input{width:100%;padding:12px;margin-top:5px;border:1px solid #ccd3dc;border-radius:9px;font-size:16px}.calc{margin-top:10px;padding:11px;background:#f1f3f5;border-radius:9px}.actions{display:flex;gap:8px;margin-top:10px}.secondary{background:#172033}.history{margin-top:14px;overflow:auto}.history table{width:100%;border-collapse:collapse;font-size:12px}.history th,.history td{padding:10px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}.history th{background:#f1f3f5}.empty{text-align:center;padding:18px;color:#667085}@media(max-width:800px){.summary{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr 1fr}}@media(max-width:480px){.summary,.fields{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}.top h1{font-size:18px}}</style></head><body><div class="top"><h1>NYAMBO FUEL MANAGEMENT</h1><small>Pump Meter Readings</small></div><div class="wrap"><button class="back" onclick="location.href='/'">← Dashboard</button><div id="msg" class="msg"></div><div class="summary"><div class="card"><div class="label">PETROL SOLD</div><div id="petrolLitres" class="value green">0.00 L</div><div id="petrolMoney">$0.00</div></div><div class="card"><div class="label">DIESEL SOLD</div><div id="dieselLitres" class="value purple">0.00 L</div><div id="dieselMoney">$0.00</div></div><div class="card"><div class="label">TOTAL LITRES</div><div id="totalLitres" class="value">0.00 L</div></div><div class="card"><div class="label">TOTAL MONEY</div><div id="totalMoney" class="value">$0.00</div></div></div><div id="stations"></div><div class="history card"><h2>Recent Reading History</h2><p>The latest closing meter for each pump becomes its next opening meter.</p><table><thead><tr><th>Date</th><th>Garage</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr></thead><tbody id="history"></tbody></table></div></div><script>const db=supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');let stations=[],pumps=[],readings=[];const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const rowMoney=r=>Number(r.litres_sold||0)*Number(r.price_per_litre||0);function show(t,c){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+c;m.style.display='block';setTimeout(()=>m.style.display='none',5000)}function latest(pid){return readings.filter(r=>String(r.pump_id)===String(pid)).sort((a,b)=>String(b.reading_date).localeCompare(String(a.reading_date))||String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||'')))[0]}function render(){const pt=readings.filter(r=>String(r.fuel_type).toLowerCase()==='petrol'),ds=readings.filter(r=>String(r.fuel_type).toLowerCase()==='diesel'),sum=a=>a.reduce((z,r)=>z+Number(r.litres_sold||0),0),cash=a=>a.reduce((z,r)=>z+rowMoney(r),0);document.getElementById('petrolLitres').textContent=lit(sum(pt));document.getElementById('dieselLitres').textContent=lit(sum(ds));document.getElementById('totalLitres').textContent=lit(sum(readings));document.getElementById('petrolMoney').textContent=money(cash(pt));document.getElementById('dieselMoney').textContent=money(cash(ds));document.getElementById('totalMoney').textContent=money(cash(readings));document.getElementById('stations').innerHTML=stations.map(s=>{const ps=pumps.filter(p=>String(p.station_id)===String(s.id));return '<div class="station"><h2>'+esc(s.name)+'</h2>'+(ps.length?ps.map(p=>{const h=latest(p.id),o=h?Number(h.closing_meter):0,cls=String(p.fuel_type).toLowerCase()==='petrol'?'petrol':'diesel';return '<div class="pump"><div class="head"><b>'+esc(p.fuel_type)+' Pump '+esc(p.pump_number)+'</b><span class="tag '+cls+'">'+esc(p.fuel_type)+'</span></div><div class="fields"><div><label>Opening meter</label><input id="o-'+p.id+'" type="number" step="0.001" min="0" value="'+o.toFixed(3)+'"></div><div><label>Closing meter</label><input id="c-'+p.id+'" type="number" step="0.001" min="0" placeholder="Enter closing"></div><div><label>Price / litre</label><input id="pr-'+p.id+'" type="number" step="0.01" min="0" placeholder="e.g. 1.90"></div><div><label>Date</label><input id="d-'+p.id+'" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><div class="calc" id="calc-'+p.id+'">Enter closing meter and price.</div><div class="actions"><button class="btn" onclick="save(\''+p.id+'\',this)">Save Reading</button><button class="btn secondary" onclick="historyFor(\''+p.id+'\')">View History</button></div></div>}).join(''):'<div class="empty">No pumps configured for this garage.</div>')+'</div>'}).join('')||'<div class="card empty">No garages found.</div>';pumps.forEach(p=>{const o=document.getElementById('o-'+p.id),c=document.getElementById('c-'+p.id),pr=document.getElementById('pr-'+p.id);if(c)c.oninput=()=>calc(p.id);if(pr)pr.oninput=()=>calc(p.id);if(o)o.oninput=()=>calc(p.id)});document.getElementById('history').innerHTML=readings.slice().sort((a,b)=>String(b.reading_date).localeCompare(String(a.reading_date))||String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||''))).slice(0,60).map(r=>'<tr><td>'+esc(r.reading_date)+'</td><td>'+esc(r.station_name)+'</td><td>'+esc(r.pump_number)+'</td><td>'+esc(r.fuel_type)+'</td><td>'+esc(r.opening_meter)+'</td><td>'+esc(r.closing_meter)+'</td><td>'+lit(r.litres_sold)+'</td><td>'+money(rowMoney(r))+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">No readings saved yet.</td></tr>'}function calc(pid){const o=Number(document.getElementById('o-'+pid).value),c=Number(document.getElementById('c-'+pid).value),p=Number(document.getElementById('pr-'+pid).value),box=document.getElementById('calc-'+pid);if(document.getElementById('c-'+pid).value===''||document.getElementById('pr-'+pid).value===''){box.textContent='Enter closing meter and price.';return}if(c<o){box.innerHTML='<span class="red"><b>Invalid:</b> closing meter cannot be lower than opening meter.</span>';return}box.textContent='Litres sold: '+lit(c-o)+' • Money sold: '+money((c-o)*p)}async function save(pid,button){const pump=pumps.find(x=>String(x.id)===String(pid));if(!pump)return show('Pump not found.','err');const station=stations.find(x=>String(x.id)===String(pump.station_id)),o=Number(document.getElementById('o-'+pid).value),c=Number(document.getElementById('c-'+pid).value),p=Number(document.getElementById('pr-'+pid).value),date=document.getElementById('d-'+pid).value;if(!date||!Number.isFinite(o)||!Number.isFinite(c)||!Number.isFinite(p))return show('Enter opening meter, closing meter, price and date.','err');if(o<0)return show('Opening meter cannot be negative.','err');if(c<o)return show('Closing meter cannot be lower than opening meter.','err');if(p<0)return show('Price cannot be negative.','err');const litres=c-o,moneyReceived=litres*p;button.disabled=true;button.textContent='Saving...';const payload={pump_id:pid,station_id:pump.station_id,station_name:station?station.name:'Unknown Garage',pump_number:pump.pump_number,fuel_type:pump.fuel_type,reading_date:date,opening_meter:o,closing_meter:c,litres_sold:litres,price_per_litre:p,money:moneyReceived};let r=await db.from('pump_reading_history').select('id').eq('pump_id',pid).eq('reading_date',date).limit(1);if(r.error){button.disabled=false;button.textContent='Save Reading';return show('Could not check existing reading: '+r.error.message,'err')}if(r.data&&r.data.length){r=await db.from('pump_reading_history').update(payload).eq('id',r.data[0].id).select().single()}else{r=await db.from('pump_reading_history').insert(payload).select().single()}button.disabled=false;button.textContent='Save Reading';if(r.error)return show('Could not save: '+r.error.message,'err');show('Reading saved successfully. Closing meter '+c.toFixed(3)+' is now the next opening meter.','ok');await load()}function historyFor(pid){const p=pumps.find(x=>String(x.id)===String(pid)),rows=readings.filter(r=>String(r.pump_id)===String(pid));alert((p?p.fuel_type+' Pump '+p.pump_number:'Pump')+' history\n\n'+(rows.map(r=>r.reading_date+' | '+r.opening_meter+' → '+r.closing_meter+' | '+lit(r.litres_sold)+' | '+money(rowMoney(r))).join('\n')||'No readings.'))}async function load(){const a=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type').eq('is_active',true).order('pump_number'),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);if(a.some(x=>x.error)){show('Could not load database data.','err');return}stations=a[0].data||[];pumps=a[1].data||[];readings=a[2].data||[];render()}load();</script></body></html>
