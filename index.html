<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyambo Fuel Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f6f7f9;color:#172033}.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:#111b29;color:#fff;z-index:10;overflow:auto}.brand{background:#e20d18;padding:20px;font-weight:bold;font-size:21px}.brand small{display:block;font-size:10px}.nav{padding:10px}.nav button{width:100%;padding:12px;background:none;color:#ddd;border:0;text-align:left;border-radius:6px;margin-bottom:3px;font-size:14px}.nav button.active{background:#e20d18;color:#fff}.main{margin-left:240px;padding:25px}.mobile{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e3e7ec;border-radius:10px;padding:15px}.label{font-size:11px;font-weight:bold;color:#667085}.value{font-size:24px;font-weight:bold;margin-top:8px}.green{color:#239447}.red{color:#d71920}.purple{color:#7b3fc6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pumpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.garage{background:#fff;border:1px solid #e3e7ec;border-radius:10px;padding:14px}.fuel{padding:12px;border-radius:8px;margin-top:8px}.petrol{border-left:5px solid #239447;background:#f1faf4}.diesel{border-left:5px solid #7b3fc6;background:#f7f1fc}.fuel button,.btn{border:0;background:#e20d18;color:#fff;padding:8px 11px;border-radius:6px;margin:6px 4px 0 0}.history{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.box{background:white;padding:20px;border-radius:12px;width:min(500px,90%);max-height:90vh;overflow:auto}.box>button{float:right;border:0;background:none;font-size:24px}input{width:100%;padding:10px;box-sizing:border-box;margin:5px 0 12px;border:1px solid #ddd;border-radius:6px}.status{padding:10px;border-radius:8px;background:#fff3cd;color:#705b00;margin-bottom:12px;display:none}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin:0;padding:12px}.mobile{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mobile button{font-size:24px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:5px 10px}.cards{grid-template-columns:1fr 1fr}.pumpgrid,.grid{grid-template-columns:1fr}.value{font-size:20px}}
</style>
</head>
<body>
<aside class="side" id="side"><div class="brand">⛽ NYAMBO<small>FUEL MANAGEMENT</small></div><nav class="nav" id="nav"></nav></aside>
<main class="main"><div class="mobile"><button id="menuBtn">☰</button><b>NYAMBO FUEL MANAGEMENT</b><span>⋮</span></div><div id="status" class="status"></div><div id="view"></div></main>
<div class="modal" id="modal"><div class="box"><button id="closeModal">×</button><div id="modalBody"></div></div></div>
<script>
(function(){
'use strict';
const view=document.getElementById('view'),nav=document.getElementById('nav'),side=document.getElementById('side'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody'),status=document.getElementById('status');
const names=['Dashboard','Pump Meter Readings','Credit Customers','Credit Sale','Payment','Fuel Purchase','Fuel Stock and Levels','Expenses','Reports','Settings'];
let stations=[],pumps=[],history=[],db=null;
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L';
function menu(){nav.innerHTML=names.map((x,i)=>'<button data-i="'+i+'" class="'+(i===0?'active':'')+'">'+x+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.i),b)));}
function go(i,b){nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');side.classList.remove('open');if(i===8){location.href='reports.html';return}if(i===0)dashboard();else if(i===1)pumpPage();else modulePage(names[i]);}
function dashboard(){view.innerHTML='<h1>Dashboard</h1><p>Overview of your fuel business performance</p><div class="cards"><div class="card"><div class="label">TOTAL PETROL SALES</div><div class="value green" id="dashPetrol">0.00 L</div><small>Today</small></div><div class="card"><div class="label">TOTAL DIESEL SALES</div><div class="value purple" id="dashDiesel">0.00 L</div><small>Today</small></div><div class="card"><div class="label">TOTAL SALES</div><div class="value" id="dashTotal">0.00 L</div><small>All garages</small></div><div class="card"><div class="label">TOTAL SALES MONEY</div><div class="value" id="dashMoney">$0.00</div><small>All sales</small></div><div class="card"><div class="label">CREDITS MADE</div><div class="value">$0.00</div><small>Credit sales</small></div><div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value">$0.00</div><small>Customer payments</small></div><div class="card"><div class="label">OUTSTANDING AMOUNT</div><div class="value red">$0.00</div><small>Customers owing</small></div><div class="card"><div class="label">NET PROFIT / (LOSS)</div><div class="value">$0.00</div><small>After expenses</small></div></div><div class="grid"><div class="panel"><h2>Sales Comparison</h2><p>Petrol vs diesel sales will appear here.</p></div><div class="panel"><h2>Sales by Garage</h2><p>Garage sales comparison will appear here.</p></div></div>';updateDashboard();}
function updateDashboard(){let pt=history.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),ds=history.filter(x=>String(x.fuel_type).toLowerCase()==='diesel'),sum=a=>a.reduce((z,x)=>z+Number(x.litres_sold||0),0),cash=a=>a.reduce((z,x)=>z+Number(x.money||x.money_received||0),0);let el=id=>document.getElementById(id);if(el('dashPetrol'))el('dashPetrol').textContent=lit(sum(pt));if(el('dashDiesel'))el('dashDiesel').textContent=lit(sum(ds));if(el('dashTotal'))el('dashTotal').textContent=lit(sum(pt)+sum(ds));if(el('dashMoney'))el('dashMoney').textContent=money(cash(history));}
function modulePage(name){view.innerHTML='<div class="panel"><h1>'+name+'</h1><p>This module is ready for the next development step.</p></div>';}
function pumpPage(){let pt=history.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),ds=history.filter(x=>String(x.fuel_type).toLowerCase()==='diesel'),sum=a=>a.reduce((z,x)=>z+Number(x.litres_sold||0),0),cash=a=>a.reduce((z,x)=>z+Number(x.money||x.money_received||0),0);view.innerHTML='<h1>Pump Meter Readings</h1><p>Enter the closing meter. The previous closing becomes the next opening.</p><div class="cards"><div class="card"><div class="label">🟢 PETROL SOLD</div><div class="value green">'+lit(sum(pt))+'</div><p>'+money(cash(pt))+'</p></div><div class="card"><div class="label">🟣 DIESEL SOLD</div><div class="value purple">'+lit(sum(ds))+'</div><p>'+money(cash(ds))+'</p></div><div class="card"><div class="label">TOTAL LITRES</div><div class="value">'+lit(sum(history))+'</div></div><div class="card"><div class="label">TOTAL MONEY</div><div class="value">'+money(cash(history))+'</div></div></div><div class="pumpgrid">'+stations.map(s=>'<div class="garage"><h2>'+s.name+'</h2>'+['Petrol','Diesel'].map(f=>{let ps=pumps.filter(p=>p.station_id===s.id&&String(p.fuel_type).toLowerCase()===f.toLowerCase());return '<div class="fuel '+f.toLowerCase()+'"><b>'+(f==='Petrol'?'🟢':'🟣')+' '+f+' — '+ps.length+' pumps</b><br>'+ps.map(p=>{let h=history.find(x=>x.pump_id===p.id);return 'Pump '+p.pump_number+' — '+(h?'Last closing: '+h.closing_meter:'No reading')+'<br><button data-enter="'+p.id+'">Enter Reading</button><button data-hist="'+p.id+'">History</button><br>'}).join('')+'</div>'}).join('')+'</div>').join('')+'</div><div class="panel history"><h2>Reading History</h2><table><tr><th>Date</th><th>Garage</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+history.slice(0,50).map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.station_name+'</td><td>'+x.pump_number+'</td><td>'+x.fuel_type+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money||x.money_received)+'</td></tr>').join('')+'</table></div>';view.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>enter(b.dataset.enter));view.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>hist(b.dataset.hist));}
function enter(pid){let p=pumps.find(x=>x.id===pid),h=history.find(x=>x.pump_id===pid);if(!p)return;modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+'</h2><label>Opening Meter</label><input id="op" type="number" value="'+(h?h.closing_meter:'')+'" '+(h?'readonly':'')+'><label>Closing Meter</label><input id="cl" type="number"><label>Price per Litre</label><input id="pr" type="number" step="0.01"><label>Date</label><input id="dt" type="date" value="'+new Date().toISOString().slice(0,10)+'"><p id="calc"></p><button class="btn" id="saveBtn">Save Reading</button>';modal.classList.add('show');let calc=document.getElementById('calc');let recalc=()=>{let o=+document.getElementById('op').value,c=+document.getElementById('cl').value,pr=+document.getElementById('pr').value;calc.textContent='Litres sold: '+lit(Math.max(0,c-o))+' | Money: '+money(Math.max(0,c-o)*pr)};document.getElementById('cl').oninput=recalc;document.getElementById('pr').oninput=recalc;document.getElementById('saveBtn').onclick=()=>save(pid);}
async function save(pid){if(!db)return alert('Database is not connected. Please refresh and try again.');let o=+document.getElementById('op').value,c=+document.getElementById('cl').value,pr=+document.getElementById('pr').value;if(c<o)return alert('Closing meter cannot be lower than opening meter.');let r=await db.from('pump_readings').insert({pump_id:pid,reading_date:document.getElementById('dt').value,opening_meter:o,closing_meter:c,price_per_litre:pr,money_received:(c-o)*pr});if(r.error)alert(r.error.message);else{modal.classList.remove('show');await loadData();pumpPage();}}
function hist(pid){let p=pumps.find(x=>x.id===pid),rows=history.filter(x=>x.pump_id===pid);modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+' History</h2><table><tr><th>Date</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+rows.map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money||x.money_received)+'</td></tr>').join('')+'</table>';modal.classList.add('show');}
async function loadData(){if(!db)return;try{let results=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type').eq('is_active',true),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);stations=results[0].data||[];pumps=results[1].data||[];history=results[2].data||[];if(results.some(x=>x.error))throw new Error('Database query failed');updateDashboard();}catch(e){status.textContent='Dashboard loaded. Database data could not be loaded right now.';status.style.display='block';}}
menu();dashboard();document.getElementById('menuBtn').onclick=()=>side.classList.toggle('open');document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');
try{if(window.supabase&&window.supabase.createClient){db=window.supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');loadData();}else{status.textContent='Dashboard is running in offline mode.';status.style.display='block';}}catch(e){status.textContent='Dashboard is running in offline mode.';status.style.display='block';}
})();
</script>
</body>
</html>
