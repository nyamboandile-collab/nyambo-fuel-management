<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyambo Fuel Management</title>
<style>
:root{--red:#e20d18;--dark:#111b29;--ink:#172033;--muted:#7a8594;--line:#e4e8ed;--bg:#f6f7f9;--green:#239447;--blue:#2879d8;--orange:#e99a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh;display:flex}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;background:var(--dark);color:#fff;z-index:20;display:flex;flex-direction:column}.brand{background:var(--red);padding:20px 18px;font-weight:800;font-size:20px;line-height:1.1}.brand small{display:block;font-size:10px;letter-spacing:1px;margin-top:5px}.nav{padding:14px 10px;overflow:auto}.nav button{width:100%;border:0;background:transparent;color:#dbe2ea;text-align:left;padding:12px 13px;margin:2px 0;border-radius:6px;font-size:13px;display:flex;gap:10px;align-items:center}.nav button.active,.nav button:hover{background:var(--red);color:#fff}.icon{width:21px;text-align:center}.side-bottom{margin-top:auto;padding:14px}.side-note{background:#172638;padding:10px;border-radius:7px;font-size:10px;color:#b8c2cf;margin-bottom:7px}.signout{width:100%;border:0;background:#182638;color:#fff;padding:10px;border-radius:7px}.main{margin-left:235px;width:calc(100% - 235px);padding:25px}.mobile-top{display:none}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.head h1{font-size:28px;margin:0}.head p{margin:5px 0;color:var(--muted);font-size:13px}.date{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:#697586;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #10182808}.card{padding:16px}.label{font-size:10px;font-weight:800;color:#6d7786}.value{font-size:23px;font-weight:800;margin-top:8px}.change{font-size:10px;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.orange{color:var(--orange)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2{font-size:14px;margin:0}.sub{font-size:10px;color:var(--muted);margin:4px 0 13px}.sales{display:flex;align-items:center;gap:24px;min-height:170px}.pie{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--red) 0 35%,#29994b 35% 76%,var(--blue) 76% 100%);position:relative;flex:none}.pie:after{content:"";position:absolute;inset:40px;border-radius:50%;background:#fff}.legend{font-size:11px}.legend div{margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.dred{background:var(--red)}.dgreen{background:#29994b}.dblue{background:var(--blue)}.bars{height:175px;display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid var(--line);padding:10px 5px 0}.group{height:100%;display:flex;align-items:flex-end;gap:4px}.bar{width:14px;border-radius:3px 3px 0 0}.bp{background:var(--red)}.bd{background:#29994b}.barlabels{display:flex;justify-content:space-around;font-size:8px;color:#778292;margin-top:6px}.wide{margin-top:14px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:9px 7px;text-align:left;border-bottom:1px solid #edf0f3;white-space:nowrap}th{background:#f7f8fa;color:#566273}.bottom{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:14px}.section{display:none}.section.active{display:block}.form{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:11px;font-weight:700;color:#566273;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #dce1e7;border-radius:7px}.btn{border:0;background:var(--red);color:#fff;padding:11px 17px;border-radius:7px;font-weight:700;margin-top:14px}.back{background:#fff;color:var(--ink);border:1px solid var(--line);margin-bottom:12px}.stationgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.station{border:1px solid var(--line);background:#fff;border-radius:9px;padding:15px;text-align:left}.station b{display:block;margin-bottom:5px}.station span{font-size:11px;color:var(--muted)}
@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.bottom{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:.2s;width:245px}.sidebar.open{transform:translateX(0)}.main{margin:0;width:100%;padding:12px}.mobile-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.hamb{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:22px}.mobile-name{font-weight:800;color:var(--red);font-size:15px}.head{margin-bottom:12px}.head h1{font-size:24px}.head p{font-size:12px;max-width:230px;line-height:1.35}.date{font-size:11px}.stats{gap:8px}.card{padding:12px;min-height:105px}.label{font-size:9px}.value{font-size:18px}.grid2{grid-template-columns:1fr;gap:10px}.panel{padding:13px}.sales{min-height:145px;gap:14px}.pie{width:120px;height:120px}.pie:after{inset:33px}.bars{height:145px}.bottom{gap:8px}.formgrid,.stationgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="side"><div class="brand">⛽ NYAMBO<small>FUEL MANAGEMENT</small></div><nav class="nav" id="nav"></nav><div class="side-bottom"><div class="side-note">Red Range Investments<br>5 Service Stations</div><button class="signout" onclick="alert('Sign Out')">↪ Sign Out</button></div></aside>
<main class="main">
<div class="mobile-top"><button class="hamb" onclick="toggle()">☰</button><div class="mobile-name">NYAMBO FUEL MANAGEMENT</div><div>⋮</div></div>
<div id="view"></div>
</main></div>
<script>
const items=[['Dashboard','📊','dash'],['Pump Meter Readings','⛽','pump'],['Credit Customers','👥','customers'],['Credit Sale','🧾','credit'],['Payment','💵','payment'],['Fuel Purchase','🛢️','purchase'],['Fuel Stock and Levels','⛽','stock'],['Expenses','📋','expenses'],['Reports','📈','reports'],['Settings','⚙️','settings']];
const garages=['Renkini','12th Avenue','Pumula South','Maphisa','FairBridge'];
const nav=document.getElementById('nav');
function buildNav(){nav.innerHTML=items.map((x,i)=>`<button class="${i===0?'active':''}" onclick="openPage('${x[2]}',this)"><span class="icon">${x[1]}</span>${x[0]}</button>`).join('')}
function dash(){document.getElementById('view').innerHTML=`<div class="head"><div><h1>Dashboard</h1><p>Overview of your fuel business performance</p></div><div class="date">📅 28 Aug 2026</div></div><div class="stats"><div class="card"><div class="label">TOTAL PETROL SALES</div><div class="value">0.00 L</div><div class="change green">↑ Today</div></div><div class="card"><div class="label">TOTAL DIESEL SALES</div><div class="value">0.00 L</div><div class="change green">↑ Today</div></div><div class="card"><div class="label">TOTAL SALES</div><div class="value">0.00 L</div><div class="change blue">All garages</div></div><div class="card"><div class="label">TOTAL SALES MONEY</div><div class="value">$0.00</div><div class="change blue">All sales</div></div><div class="card"><div class="label">CREDITS MADE</div><div class="value">$0.00</div><div class="change orange">Credit sales</div></div><div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value">$0.00</div><div class="change green">Customer payments</div></div><div class="card"><div class="label">OUTSTANDING AMOUNT</div><div class="value red">$0.00</div><div class="change red">Customers owing</div></div><div class="card"><div class="label">NET PROFIT / (LOSS)</div><div class="value">$0.00</div><div class="change">After expenses</div></div></div><div class="grid2"><div class="panel"><h2>Sales Comparison</h2><div class="sub">Petrol and diesel sales</div><div class="sales"><div class="pie"></div><div class="legend"><div><i class="dot dred"></i>Petrol</div><div><i class="dot dgreen"></i>Diesel</div><div><i class="dot dblue"></i>Other</div></div></div></div><div class="panel"><h2>Sales by Garage</h2><div class="sub">Petrol and diesel litres sold</div><div class="bars">${[35,50,42,30,55].map((p,i)=>`<div class="group"><i class="bar bp" style="height:${p}%"></i><i class="bar bd" style="height:${Math.min(80,p+20)}%"></i></div>`).join('')}</div><div class="barlabels">${garages.map(x=>`<span>${x}</span>`).join('')}</div></div></div><div class="panel wide"><h2>Creditors (Amount Owing)</h2><div class="sub">Customers with outstanding balances</div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Credit Made</th><th>Payments</th><th>Balance</th></tr></thead><tbody>${['Malandu','Pride','Sandile','Rhino Rue','Townsend High School'].map(x=>`<tr><td>${x}</td><td>$0.00</td><td>$0.00</td><td class="red">$0.00</td></tr>`).join('')}</tbody></table></div></div><div class="panel wide"><h2>Fuel Purchased Summary</h2><div class="sub">Fuel purchased across all garages</div><div class="tablewrap"><table><thead><tr><th>Garage</th><th>Petrol (L)</th><th>Diesel (L)</th><th>Total (L)</th></tr></thead><tbody>${garages.map(x=>`<tr><td>${x}</td><td>0.00</td><td>0.00</td><td>0.00</td></tr>`).join('')}</tbody></table></div></div><div class="bottom"><div class="card"><div class="label">TOTAL FUEL PURCHASED</div><div class="value">0.00 L</div></div><div class="card"><div class="label">TOTAL EXPENSES</div><div class="value">$0.00</div></div><div class="card"><div class="label">CREDIT PROFIT</div><div class="value green">$0.00</div></div><div class="card"><div class="label">NET PROFIT / LOSS</div><div class="value orange">$0.00</div></div></div>`}
function page(title,body){document.getElementById('view').innerHTML=`<button class="btn back" onclick="openPage('dash',nav.children[0])">← Dashboard</button><div class="form"><h2>${title}</h2>${body}</div>`}
function openPage(id,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('side').classList.remove('open');if(id==='dash')dash();if(id==='pump')page('Pump Meter Readings',`<p class="sub">Record opening and closing readings for each pump.</p><div class="stationgrid">${garages.map(g=>`<button class="station" onclick="pumpForm('${g}')"><b>${g}</b><span>Open station readings</span></button>`).join('')}</div>`);if(id==='customers')page('Credit Customers',form('Customer Name','Phone Number','Add Customer'));if(id==='credit')page('Credit Sale',form('Customer','Garage','Record Credit Sale'));if(id==='payment')page('Payment',form('Customer','Payment Amount','Record Payment'));if(id==='purchase')page('Fuel Purchase',form('Garage','Fuel Type','Save Fuel Purchase'));if(id==='stock')page('Fuel Stock and Levels',`<p class="sub">Current stock levels for all five service stations.</p><div class="stationgrid">${garages.map(g=>`<div class="station"><b>${g}</b><span>Petrol: 0.00 L &nbsp; Diesel: 0.00 L</span></div>`).join('')}</div>`);if(id==='expenses')page('Expenses',form('Expense Description','Amount','Save Expense'));if(id==='reports')page('Reports',`<div class="stationgrid"><button class="station"><b>Sales Report</b><span>Petrol, diesel and total sales</span></button><button class="station"><b>Credit Report</b><span>Credits, payments and balances</span></button><button class="station"><b>Profit & Loss</b><span>Revenue, purchases and expenses</span></button><button class="station"><b>Fuel Purchase Report</b><span>Fuel purchased by garage</span></button></div>`);if(id==='settings')page('Settings',form('Business Name','Currency','Save Settings'))}
function form(a,b,c){return `<div class="formgrid"><div class="field"><label>${a}</label><input placeholder="${a}"></div><div class="field"><label>${b}</label><input placeholder="${b}"></div></div><button class="btn">${c}</button>`}
function pumpForm(g){page(g+' — Pump Meter Readings',`<div class="formgrid"><div class="field"><label>Fuel Type</label><select><option>Petrol</option><option>Diesel</option></select></div><div class="field"><label>Pump Number</label><input type="number" value="1"></div><div class="field"><label>Opening Reading</label><input type="number"></div><div class="field"><label>Closing Reading</label><input type="number"></div></div><button class="btn">Save Reading</button>`)}
function toggle(){document.getElementById('side').classList.toggle('open')}
buildNav();dash();
</script></body></html>
