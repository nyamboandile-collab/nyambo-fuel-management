<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f6f7f9;color:#172033}.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:#111b29;color:#fff}.brand{background:#e20d18;padding:20px;font-weight:bold;font-size:21px}.brand small{display:block;font-size:10px}.nav{padding:10px}.nav button{width:100%;padding:12px;background:none;color:#ddd;border:0;text-align:left}.nav button.active{background:#e20d18}.main{margin-left:240px;padding:25px}.mobile{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e3e7ec;border-radius:10px;padding:15px}.label{font-size:10px;font-weight:bold}.value{font-size:22px;font-weight:bold;margin-top:8px}.green{color:#239447}.purple{color:#7b3fc6}.pumpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.garage{background:#fff;border:1px solid #e3e7ec;border-radius:10px;padding:14px}.fuel{padding:12px;border-radius:8px;margin-top:8px}.petrol{border-left:5px solid #239447;background:#f1faf4}.diesel{border-left:5px solid #7b3fc6;background:#f7f1fc}.fuel button,.btn{border:0;background:#e20d18;color:#fff;padding:8px 11px;border-radius:6px;margin:6px 4px 0 0}.history{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:white;padding:20px;border-radius:12px;width:min(500px,90%)}input{width:100%;padding:10px;box-sizing:border-box;margin:5px 0 12px;border:1px solid #ddd;border-radius:6px}@media(max-width:700px){.side{transform:translateX(-100%);z-index:5;transition:.2s}.side.open{transform:translateX(0)}.main{margin:0;padding:12px}.mobile{display:flex;justify-content:space-between;margin-bottom:12px}.cards,.pumpgrid{grid-template-columns:1fr 1fr}.pumpgrid{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.value{font-size:18px}}</style></head><body><aside class="side" id="side"><div class="brand">⛽ NYAMBO<small>FUEL MANAGEMENT</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="mobile"><button onclick="side.classList.toggle('open')">☰</button><b>NYAMBO FUEL MANAGEMENT</b><span>⋮</span></div><div id="view"></div></main><div class="modal" id="modal"><div class="box"><button onclick="modal.classList.remove('show')">×</button><div id="modalBody"></div></div></div><script>const URL='https://dyqwsydxyhomudujumxs.supabase.co',KEY='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6',db=supabase.createClient(URL,KEY);const names=['Dashboard','Pump Meter Readings','Credit Customers','Credit Sale','Payment','Fuel Purchase','Fuel Stock and Levels','Expenses','Reports','Settings'];nav.innerHTML=names.map((x,i)=>`<button class="${i?'':'active'}" onclick="go(${i},this)">${x}</button>`).join('');let stations=[],pumps=[],history=[];const money=n=>'$'+Number(n||0).toFixed(2),lit=n=>Number(n||0).toFixed(2)+' L';async function load(){let[s,p,h]=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type').eq('is_active',true),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);stations=s.data||[];pumps=p.data||[];history=h.data||[]}function go(i,b){if(i===8){location.href='reports.html';return}document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');side.classList.remove('open');i===0?dashboard():i===1?pumpPage():view.innerHTML='<div class="panel"><h1>'+names[i]+'</h1><p>Module will be built next.</p></div>'}function dashboard(){view.innerHTML='<h1>Dashboard</h1><p>Overview of your fuel business performance</p><div class="cards"><div class="card"><div class="label">TOTAL PETROL SALES</div><div class="value green">0.00 L</div></div><div class="card"><div class="label">TOTAL DIESEL SALES</div><div class="value purple">0.00 L</div></div><div class="card"><div class="label">TOTAL SALES</div><div class="value">0.00 L</div></div><div class="card"><div class="label">TOTAL SALES MONEY</div><div class="value">$0.00</div></div></div><div class="grid"><div class="panel"><h2>Sales Comparison</h2></div><div class="panel"><h2>Sales by Garage</h2></div></div>'}function pumpPage(){let pt=history.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),ds=history.filter(x=>String(x.fuel_type).toLowerCase()==='diesel'),sum=a=>a.reduce((z,x)=>z+Number(x.litres_sold||0),0),cash=a=>a.reduce((z,x)=>z+Number(x.money||0),0);view.innerHTML='<h1>Pump Meter Readings</h1><p>Enter the closing meter. The previous closing becomes the next opening.</p><div class="cards"><div class="card"><div class="label">🟢 PETROL SOLD</div><div class="value green">'+lit(sum(pt))+'</div><p>'+money(cash(pt))+'</p></div><div class="card"><div class="label">🟣 DIESEL SOLD</div><div class="value purple">'+lit(sum(ds))+'</div><p>'+money(cash(ds))+'</p></div><div class="card"><div class="label">TOTAL LITRES</div><div class="value">'+lit(sum(history))+'</div></div><div class="card"><div class="label">TOTAL MONEY</div><div class="value">'+money(cash(history))+'</div></div></div><div class="pumpgrid">'+stations.map(s=>'<div class="garage"><h2>'+s.name+'</h2>'+['Petrol','Diesel'].map(f=>{let ps=pumps.filter(p=>p.station_id===s.id&&String(p.fuel_type).toLowerCase()===f.toLowerCase());return '<div class="fuel '+f.toLowerCase()+'"><b>'+(f==='Petrol'?'🟢':'🟣')+' '+f+' — '+ps.length+' pumps</b><br>'+ps.map(p=>{let h=history.find(x=>x.pump_id===p.id);return 'Pump '+p.pump_number+' — '+(h?'Last closing: '+h.closing_meter:'No reading')+'<br><button onclick="enter(\''+p.id+'\')">Enter Reading</button><button onclick="hist(\''+p.id+'\')">History</button><br>'}).join('')+'</div>'}).join('')+'</div>').join('')+'</div><div class="panel history"><h2>Reading History</h2><table><tr><th>Date</th><th>Garage</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+history.slice(0,50).map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.station_name+'</td><td>'+x.pump_number+'</td><td class="'+(String(x.fuel_type).toLowerCase()==='petrol'?'green':'purple')+'">'+x.fuel_type+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money)+'</td></tr>').join('')+'</table></div>'}function enter(pid){let p=pumps.find(x=>x.id===pid),h=history.find(x=>x.pump_id===pid);modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+'</h2><label>Opening Meter</label><input id="op" type="number" value="'+(h?h.closing_meter:'')+'" '+(h?'readonly':'')+'><label>Closing Meter</label><input id="cl" type="number"><label>Price per Litre</label><input id="pr" type="number" step="0.01"><label>Date</label><input id="dt" type="date" value="'+new Date().toISOString().slice(0,10)+'"><p id="calc"></p><button class="btn" onclick="save(\''+pid+'\')">Save Reading</button>';modal.classList.add('show');cl.oninput=pr.oninput=()=>{let o=+op.value,c=+cl.value,p=+pr.value;calc.textContent='Litres sold: '+lit(Math.max(0,c-o))+' | Money: '+money(Math.max(0,c-o)*p)}}async function save(pid){let o=+op.value,c=+cl.value,p=+pr.value;if(c<o)return alert('Closing meter cannot be lower than opening meter.');let r=await db.from('pump_readings').insert({pump_id:pid,reading_date:dt.value,opening_meter:o,closing_meter:c,price_per_litre:p,money_received:(c-o)*p});if(r.error)alert(r.error.message);else{modal.classList.remove('show');await load();pumpPage()}}function hist(pid){let p=pumps.find(x=>x.id===pid),rows=history.filter(x=>x.pump_id===pid);modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+' History</h2><table><tr><th>Date</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+rows.map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money)+'</td></tr>').join('')+'</table>';modal.classList.add('show')}load().then(dashboard)</script></body></html>
