</style></head><body><aside class="side" id="side"><div class="brand">⛽ NYAMBO<small>FUEL MANAGEMENT</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="mobile"><button id="menuBtn">☰</button><b>NYAMBO FUEL MANAGEMENT</b><span>⋮</span></div><div id="status" class="status"></div><div id="view"></div></main><div class="modal" id="modal"><div class="box"><button id="closeModal">×</button><div id="modalBody"></div></div></div><script>(function(){'use strict';const U='https://dyqwsydxyhomudujumxs.supabase.co',K='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6',db=supabase.createClient(U,K);const view=$('view'),nav=$('nav'),side=$('side'),modal=$('modal'),modalBody=$('modalBody'),status=$('status');let stations=[],pumps=[],history=[],currentGarage=null;const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L',same=(a,b)=>String(a)===String(b),today=()=>new Date().toISOString().slice(0,10),$=id=>document.getElementById(id);const names=['Dashboard','Pump Meter Readings','Credit Customers','Credit Sale','Payment','Fuel Purchase','Fuel Stock and Levels','Expenses','Reports','Settings'];function menu(){nav.innerHTML=names.map((x,i)=>'<button data-i="'+i+'" class="'+(i?'':'active')+'">'+x+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i,b))}function go(i,b){nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');side.classList.remove('open');let urls={2:'credit-customers.html',3:'credit-sale.html',4:'payment.html',5:'fuel-purchase.html',6:'fuel-stock.html',7:'expenses.html',8:'reports.html'};if(urls[i])return location.href=urls[i];if(i===0)dashboard();else if(i===1)pumpPage();else view.innerHTML='<div class="panel"><h1>'+names[i]+'</h1><p>Use the module from the navigation.</p></div>'}async function dashboard(){view.innerHTML='<h1>Dashboard</h1><p>Overview of your fuel business performance</p><div class="cards"><div class="card"><div class="label">PETROL SALES TODAY</div><div class="value green" id="dp">0 L</div></div><div class="card"><div class="label">DIESEL SALES TODAY</div><div class="value purple" id="dd">0 L</div></div><div class="card"><div class="label">TOTAL SALES</div><div class="value" id="dt">0 L</div></div><div class="card"><div class="label">SALES MONEY</div><div class="value" id="dm">$0.00</div></div><div class="card"><div class="label">CREDIT MADE</div><div class="value" id="dc">$0.00</div></div><div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value green" id="dpm">$0.00</div></div><div class="card"><div class="label">OUTSTANDING</div><div class="value red" id="do">$0.00</div></div><div class="card"><div class="label">NET PROFIT / LOSS</div><div class="value" id="dprofit">$0.00</div></div></div><div class="grid"><div class="panel"><h2>Sales Comparison</h2><div id="comparison"></div></div><div class="panel"><h2>Sales by Garage</h2><div id="garageSales"></div></div></div><div class="panel"><h2>Quick Actions</h2><button class="btn" onclick="location.href='credit-sale.html'">+ Credit Sale</button><button class="btn" onclick="location.href='payment.html'">+ Payment</button><button class="btn" onclick="location.href='fuel-purchase.html'">+ Fuel Purchase</button><button class="btn" onclick="location.href='expenses.html'">+ Expense</button><button class="btn secondary" onclick="location.href='reports.html'">Reports</button></div>';updateDashboard()}async function updateDashboard(){let r=await Promise.all([db.from('pump_reading_history').select('*'),db.from('credit_sales').select('amount'),db.from('credit_payments').select('amount'),db.from('fuel_purchases').select('total_amount'),db.from('expenses').select('amount'),db.from('stations').select('id,name').eq('is_active',true).order('name')]);history=r[0].data||[];let credits=r[1].data||[],payments=r[2].data||[],purchases=r[3].data||[],expenses=r[4].data||[];let pt=history.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),ds=history.filter(x=>String(x.fuel_type).toLowerCase()==='diesel'),sumL=a=>a.reduce((s,x)=>s+Number(x.litres_sold||0),0),sumM=a=>a.reduce((s,x)=>s+Number(x.money||x.money_received||0),0),cm=credits.reduce((s,x)=>s+Number(x.amount||0),0),pm=payments.reduce((s,x)=>s+Number(x.amount||0),0),salesMoney=sumM(history),purchaseMoney=purchases.reduce((s,x)=>s+Number(x.total_amount||0),0),expenseMoney=expenses.reduce((s,x)=>s+Number(x.amount||0),0),el=id=>$(id);el('dp').textContent=lit(pt.filter(x=>String(x.reading_date).slice(0,10)===today()).reduce((s,x)=>s+Number(x.litres_sold||0),0));el('dd').textContent=lit(ds.filter(x=>String(x.reading_date).slice(0,10)===today()).reduce((s,x)=>s+Number(x.litres_sold||0),0));el('dt').textContent=lit(sumL(history));el('dm').textContent=money(salesMoney);el('dc').textContent=money(cm);el('dpm').textContent=money(pm);el('do').textContent=money(Math.max(0,cm-pm));el('dprofit').textContent=money(salesMoney-purchaseMoney-expenseMoney);el('comparison').innerHTML='<p><b>Petrol:</b> '+lit(sumL(pt))+' &nbsp; <b>Diesel:</b> '+lit(sumL(ds))+'</p><p><b>Fuel purchased:</b> '+money(purchaseMoney)+' &nbsp; <b>Expenses:</b> '+money(expenseMoney)+'</p>';stations=r[5].data||[];el('garageSales').innerHTML='<div class="history"><table><tr><th>Garage</th><th>Litres</th><th>Money</th></tr>'+stations.map(s=>{let a=history.filter(x=>same(x.station_id,s.id));return '<tr><td>'+s.name+'</td><td>'+lit(sumL(a))+'</td><td>'+money(sumM(a))+'</td></tr>'}).join('')+'</table></div>'}function latest(pid){return history.filter(x=>same(x.pump_id,pid)).sort((a,b)=>String(b.reading_date).localeCompare(String(a.reading_date)))[0]}async function pumpPage(){let r=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type'),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);stations=r[0].data||[];pumps=r[1].data||[];history=r[2].data||[];view.innerHTML='<h1>Pump Meter Readings</h1><p>Select a garage to open all pumps and history.</p><div class="cards"><div class="card"><div class="label">GARAGES</div><div class="value">'+stations.length+'</div></div><div class="card"><div class="label">PETROL PUMPS</div><div class="value green">'+pumps.filter(x=>String(x.fuel_type).toLowerCase()==='petrol').length+'</div></div><div class="card"><div class="label">DIESEL PUMPS</div><div class="value purple">'+pumps.filter(x=>String(x.fuel_type).toLowerCase()==='diesel').length+'</div></div><div class="card"><div class="label">READINGS</div><div class="value">'+history.length+'</div></div></div><div class="pumpgrid">'+stations.map(s=>{let ps=pumps.filter(p=>same(p.station_id,s.id)),hs=history.filter(x=>same(x.station_id,s.id));return '<div class="garage clickable" onclick="openGarage(\''+s.id+'\')"><h2>'+s.name+'</h2><p class="garage-meta">'+ps.length+' pumps • '+hs.length+' readings</p><div class="fuel petrol">Petrol: '+ps.filter(p=>String(p.fuel_type).toLowerCase()==='petrol').length+' pumps</div><div class="fuel diesel">Diesel: '+ps.filter(p=>String(p.fuel_type).toLowerCase()==='diesel').length+' pumps</div><button class="btn">Open Garage →</button></div>'}).join('')+'</div>'}function openGarage(id){currentGarage=stations.find(s=>same(s.id,id));let ps=pumps.filter(p=>same(p.station_id,id)),hs=history.filter(x=>same(x.station_id,id)),total=hs.reduce((s,x)=>s+Number(x.litres_sold||0),0),moneyTotal=hs.reduce((s,x)=>s+Number(x.money||x.money_received||0),0);view.innerHTML='<button class="backbtn" onclick="pumpPage()">← All Garages</button><h1>'+currentGarage.name+' — Pump Meter Readings</h1><div class="cards"><div class="card"><div class="label">TOTAL LITRES SOLD</div><div class="value">'+lit(total)+'</div></div><div class="card"><div class="label">TOTAL MONEY SOLD</div><div class="value green">'+money(moneyTotal)+'</div></div><div class="card"><div class="label">PUMPS</div><div class="value">'+ps.length+'</div></div><div class="card"><div class="label">HISTORY</div><div class="value">'+hs.length+'</div></div></div><div class="pumpgrid">'+ps.map(p=>{let h=latest(p.id);return '<div class="pump-detail"><h3>'+p.fuel_type+' Pump '+p.pump_number+'</h3><p>Next opening: <b>'+(h?h.closing_meter:'Not set')+'</b></p><button class="btn" onclick="enter(\''+p.id+'\')">Enter Reading</button><button class="btn secondary" onclick="showHistory(\''+p.id+'\')">History</button></div>'}).join('')+'</div><div class="panel history"><h2>Complete Reading History</h2><table><tr><th>Date</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+hs.map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.pump_number+'</td><td>'+x.fuel_type+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money||x.money_received)+'</td></tr>').join('')+'</table></div>'}function enter(pid){let p=pumps.find(x=>same(x.id,pid)),h=latest(pid);modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+'</h2><label>Opening Meter</label><input id="op" type="number" value="'+(h?h.closing_meter:'')+'" '+(h?'readonly':'')+'><label>Closing Meter</label><input id="cl" type="number"><label>Price per Litre</label><input id="pr" type="number" step="0.01"><label>Date</label><input id="dt" type="date" value="'+today()+'"><p id="calc">Litres sold: 0.00 L | Money: $0.00</p><button class="btn" onclick="saveReading(\''+pid+'\')">Save Reading</button>';modal.classList.add('show');function rec(){let o=+$('op').value,c=+$('cl').value,p=+$('pr').value;$('calc').textContent='Litres sold: '+lit(Math.max(0,c-o))+' | Money: '+money(Math.max(0,c-o)*p)}$('cl').oninput=rec;$('pr').oninput=rec}async function saveReading(pid){let o=+$('op').value,c=+$('cl').value,p=+$('pr').value;if(c<o)return alert('Closing meter cannot be lower than opening meter.');let r=await db.from('pump_readings').insert({pump_id:pid,reading_date:$('dt').value,opening_meter:o,closing_meter:c,price_per_litre:p,money_received:(c-o)*p});if(r.error)return alert(r.error.message);modal.classList.remove('show');await pumpPage();}function showHistory(pid){let p=pumps.find(x=>same(x.id,pid)),rows=history.filter(x=>same(x.pump_id,pid));modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+' History</h2><div class="history"><table><tr><th>Date</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+rows.map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money||x.money_received)+'</td></tr>').join('')+'</table></div>';modal.classList.add('show')}menu();dashboard();$('menuBtn').onclick=()=>side.classList.toggle('open');$('closeModal').onclick=()=>modal.classList.remove('show')})();</script></body></html>
