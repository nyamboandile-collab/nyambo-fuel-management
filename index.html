<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--red:#e20d18;--dark:#111b29;--ink:#172033;--muted:#788392;--line:#e3e7ec;--bg:#f6f7f9;--green:#239447;--blue:#2879d8;--orange:#e99a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:240px;background:var(--dark);color:#fff;z-index:20;display:flex;flex-direction:column}.brand{background:var(--red);padding:21px 18px;font-size:21px;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:1px;margin-top:5px}.nav{padding:12px 10px;overflow:auto}.nav button{width:100%;border:0;background:none;color:#dce3eb;text-align:left;padding:12px;border-radius:7px;margin:2px 0;font-size:13px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--red);color:#fff}.bottom{margin-top:auto;padding:12px}.note{background:#172638;padding:10px;border-radius:7px;font-size:10px;color:#b8c3cf}.main{margin-left:240px;padding:25px}.mobile{display:none}.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.head h1{margin:0;font-size:29px}.head p{margin:6px 0;color:var(--muted);font-size:13px}.date{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 14px;color:#697586}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel,.form{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #10182808}.card{padding:16px}.label{font-size:10px;font-weight:800;color:#6b7685}.value{font-size:24px;font-weight:800;margin-top:8px}.change{font-size:10px;margin-top:6px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.orange{color:var(--orange)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2{font-size:14px;margin:0}.sub{font-size:10px;color:var(--muted);margin:5px 0 13px}.sales{display:flex;align-items:center;gap:25px;min-height:170px}.pie{width:145px;height:145px;border-radius:50%;background:conic-gradient(var(--red) 0 35%,#29994b 35% 76%,var(--blue) 76%);position:relative}.pie:after{content:"";position:absolute;inset:40px;background:#fff;border-radius:50%}.legend{font-size:11px}.legend div{margin:10px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.bars{height:175px;display:flex;align-items:flex-end;justify-content:space-around;border-bottom:1px solid var(--line)}.grp{height:100%;display:flex;align-items:flex-end;gap:4px}.bar{width:14px;border-radius:3px 3px 0 0}.bp{background:var(--red)}.bd{background:#29994b}.labels{display:flex;justify-content:space-around;font-size:8px;color:#788494;margin-top:6px}.wide{margin-top:14px}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px}th,td{padding:9px 7px;border-bottom:1px solid #edf0f3;text-align:left;white-space:nowrap}th{background:#f7f8fa;color:#566273}.bottomgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-top:14px}.page{display:none}.page.show{display:block}.form{padding:18px}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:11px;font-weight:700;color:#566273;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #dce1e7;border-radius:7px;font:inherit}.btn{border:0;background:var(--red);color:#fff;padding:11px 17px;border-radius:7px;font-weight:700;margin-top:14px;cursor:pointer}.back{background:#fff;color:var(--ink);border:1px solid var(--line);margin:0 0 12px}.stations{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.station{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;text-align:left}.station b{display:block;margin-bottom:5px}.station span{font-size:11px;color:var(--muted)}.status{margin-top:10px;font-size:11px}.loading{text-align:center;padding:25px;color:var(--muted)}@media(max-width:950px){.stats,.bottomgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s;width:245px}.side.open{transform:translateX(0)}.main{margin:0;padding:12px}.mobile{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hamb{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:22px}.mname{font-weight:800;color:var(--red);font-size:15px}.head h1{font-size:24px}.head p{font-size:12px;max-width:220px;line-height:1.4}.stats{gap:8px}.card{padding:12px;min-height:105px}.label{font-size:9px}.value{font-size:18px}.grid{grid-template-columns:1fr;gap:10px}.panel{padding:13px}.sales{min-height:145px;gap:14px}.pie{width:120px;height:120px}.pie:after{inset:33px}.bars{height:145px}.bottomgrid{gap:8px}.fields,.stations{grid-template-columns:1fr}}</style></head><body><aside class="side" id="side"><div class="brand">⛽ NYAMBO<small>FUEL MANAGEMENT</small></div><nav class="nav" id="nav"></nav><div class="bottom"><div class="note">Red Range Investments<br>5 Service Stations</div><button class="nav" style="margin-top:6px" onclick="signOut()">↪ Sign Out</button></div></aside><main class="main"><div class="mobile"><button class="hamb" onclick="toggle()">☰</button><div class="mname">NYAMBO FUEL MANAGEMENT</div><div>⋮</div></div><div id="view"></div></main><script>const SB_URL='https://dyqwsydxyhomudujumxs.supabase.co';const SB_KEY='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6';const db=window.supabase.createClient(SB_URL,SB_KEY);const items=[['Dashboard','📊','dash'],['Pump Meter Readings','⛽','pump'],['Credit Customers','👥','customers'],['Credit Sale','🧾','credit'],['Payment','💵','payment'],['Fuel Purchase','🛢️','purchase'],['Fuel Stock and Levels','⛽','stock'],['Expenses','📋','expenses'],['Reports','📈','reports'],['Settings','⚙️','settings']];let stations=[],customers=[],pumps=[];const nav=document.getElementById('nav'),view=document.getElementById('view');nav.innerHTML=items.map((x,i)=>`<button class="${i?'':'active'}" onclick="openPage('${x[2]}',this)">${x[1]} &nbsp;${x[0]}</button>`).join('');function money(n){return '$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}function litres(n){return Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L'}async function loadBase(){const [s,c,p]=await Promise.all([db.from('stations').select('id,name,code').eq('is_active',true).order('name'),db.from('credit_customers').select('id,name,phone,credit_limit').eq('is_active',true).order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type').eq('is_active',true).order('pump_number')]);stations=s.data||[];customers=c.data||[];pumps=p.data||[]}async function dashboard(){view.innerHTML='<div class="loading">Loading live dashboard…</div>';const [m,ps,cs,cp,fu,ex,st]=await Promise.all([db.from('dashboard_management_summary').select('*').single(),db.from('dashboard_pump_summary').select('*'),db.from('credit_sales').select('amount'),db.from('credit_payments').select('amount'),db.from('fuel_purchases').select('total_amount'),db.from('expenses').select('amount'),db.from('dashboard_station_summary').select('*').order('station_name')]);const a=m.data||{};const pump=ps.data||[];const creditSales=(cs.data||[]).reduce((x,r)=>x+Number(r.amount||0),0);const payments=(cp.data||[]).reduce((x,r)=>x+Number(r.amount||0),0);const purchases=(fu.data||[]).reduce((x,r)=>x+Number(r.total_amount||0),0);const expenses=(ex.data||[]).reduce((x,r)=>x+Number(r.amount||0),0);const petrol=pump.filter(r=>String(r.fuel_type).toLowerCase()==='petrol').reduce((x,r)=>x+Number(r.litres_sold||0),0);const diesel=pump.filter(r=>String(r.fuel_type).toLowerCase()==='diesel').reduce((x,r)=>x+Number(r.litres_sold||0),0);const totalLitres=petrol+diesel;const outstanding=Math.max(0,creditSales-payments);const net=creditSales-payments-purchases-expenses;view.innerHTML=`<div class="head"><div><h1>Dashboard</h1><p>Overview of your fuel business performance</p></div><div class="date">📅 28 Aug<br>2026</div></div><div class="stats"><div class="card"><div class="label">TOTAL PETROL SALES</div><div class="value">${litres(petrol)}</div><div class="change green">↑ Pump readings</div></div><div class="card"><div class="label">TOTAL DIESEL SALES</div><div class="value">${litres(diesel)}</div><div class="change green">↑ Pump readings</div></div><div class="card"><div class="label">TOTAL SALES</div><div class="value">${litres(totalLitres)}</div><div class="change blue">All garages</div></div><div class="card"><div class="label">TOTAL SALES MONEY</div><div class="value">${money(creditSales)}</div><div class="change blue">Credit + cash</div></div><div class="card"><div class="label">CREDITS MADE</div><div class="value">${money(creditSales)}</div><div class="change orange">${a.credit_sales_count||0} credit sales</div></div><div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value">${money(payments)}</div><div class="change green">${a.payments_count||0} payments</div></div><div class="card"><div class="label">OUTSTANDING AMOUNT</div><div class="value red">${money(outstanding)}</div><div class="change red">Customers owing</div></div><div class="card"><div class="label">NET PROFIT / (LOSS)</div><div class="value ${net>=0?'green':'red'}">${money(net)}</div><div class="change">After purchases & expenses</div></div></div><div class="grid"><div class="panel"><h2>Sales Comparison</h2><div class="sub">Petrol and diesel litres sold</div><div class="sales"><div class="pie" style="background:conic-gradient(var(--red) 0 ${totalLitres?petrol/totalLitres*100:0}%,#29994b ${totalLitres?petrol/totalLitres*100:0}% 100%)"></div><div class="legend"><div><i class="dot" style="background:var(--red)"></i>Petrol ${litres(petrol)}</div><div><i class="dot" style="background:#29994b"></i>Diesel ${litres(diesel)}</div></div></div></div><div class="panel"><h2>Sales by Garage</h2><div class="sub">Petrol and diesel litres sold</div><div class="bars">${(st.data||[]).map(r=>{const val=Number(r.credit_sales||0);const max=Math.max(...(st.data||[]).map(x=>Number(x.credit_sales||0)),1);return `<div class="grp"><i class="bar bp" style="height:${Math.max(3,val/max*100)}%"></i></div>`}).join('')}</div><div class="labels">${(st.data||[]).map(r=>`<span>${r.station_name}</span>`).join('')}</div></div></div><div class="panel wide"><h2>Creditors (Amount Owing)</h2><div class="sub">Live customer balances</div><div class="table"><table><thead><tr><th>Customer</th><th>Credit Made</th><th>Payments</th><th>Balance</th></tr></thead><tbody id="creditRows"><tr><td colspan="4">Loading…</td></tr></tbody></table></div></div><div class="panel wide"><h2>Fuel Purchased Summary</h2><div class="sub">Live station performance</div><div class="table"><table><thead><tr><th>Garage</th><th>Fuel Spend</th><th>Other Expenses</th><th>Credit Sales</th></tr></thead><tbody>${(st.data||[]).map(r=>`<tr><td>${r.station_name}</td><td>${money(r.fuel_spend)}</td><td>${money(r.other_expenses)}</td><td>${money(r.credit_sales)}</td></tr>`).join('')}</tbody></table></div></div><div class="bottomgrid"><div class="card"><div class="label">TOTAL FUEL PURCHASED</div><div class="value">${money(purchases)}</div></div><div class="card"><div class="label">TOTAL EXPENSES</div><div class="value">${money(expenses)}</div></div><div class="card"><div class="label">CREDIT PROFIT</div><div class="value green">${money(creditSales-payments)}</div></div><div class="card"><div class="label">NET PROFIT / LOSS</div><div class="value ${net>=0?'orange':'red'}">${money(net)}</div></div></div>`;const {data:rows}=await db.from('dashboard_credit_summary').select('*').order('outstanding_balance',{ascending:false});document.getElementById('creditRows').innerHTML=(rows||[]).map(r=>`<tr><td>${r.customer_name}</td><td>${money(r.total_credit_sales)}</td><td>${money(r.total_payments)}</td><td class="red">${money(r.outstanding_balance)}</td></tr>`).join('')||'<tr><td colspan="4">No credit customers yet.</td></tr>'}function openPage(id,btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');side.classList.remove('open');if(id==='dash')dashboard();else if(id==='pump')pumpPage();else if(id==='customers')customerPage();else if(id==='credit')creditPage();else if(id==='payment')paymentPage();else if(id==='purchase')purchasePage();else if(id==='stock')stockPage();else if(id==='expenses')expensePage();else if(id==='reports')reportsPage();else settingsPage()}function back(){openPage('dash',nav.children[0])}function form(title,fields,action){view.innerHTML=`<button class="btn back" onclick="back()">← Dashboard</button><div class="form"><h2>${title}</h2><div class="fields">${fields.join('')}</div><button class="btn" onclick="${action}">Save</button><div id="msg" class="status"></div></div>`}const stationSelect=()=>`<select id="station">${stations.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>`;const customerSelect=()=>`<select id="customer">${customers.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>`;function pumpPage(){view.innerHTML=`<button class="btn back" onclick="back()">← Dashboard</button><div class="form"><h2>Pump Meter Readings</h2><div class="sub">Choose a station, pump and record today's opening and closing readings.</div><div class="fields"><div class="field"><label>Garage</label>${stationSelect()}</div><div class="field"><label>Pump</label><select id="pump">${pumps.map(p=>`<option value="${p.id}">${stations.find(s=>s.id===p.station_id)?.name||''} — Pump ${p.pump_number} ${p.fuel_type}</option>`).join('')}</select></div><div class="field"><label>Reading Date</label><input id="rdate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Opening Meter</label><input id="open" type="number" step="0.001"></div><div class="field"><label>Closing Meter</label><input id="close" type="number" step="0.001"></div><div class="field"><label>Price per Litre</label><input id="price" type="number" step="0.01"></div><div class="field"><label>Money Received</label><input id="received" type="number" step="0.01"></div></div><button class="btn" onclick="savePump()">Save Reading</button><div id="msg" class="status"></div></div>`}async function savePump(){const pump=pumps.find(p=>p.id===document.getElementById('pump').value);const o=Number(document.getElementById('open').value),c=Number(document.getElementById('close').value),price=Number(document.getElementById('price').value||0);const {error}=await db.from('pump_readings').insert({pump_id:pump.id,reading_date:document.getElementById('rdate').value,opening_meter:o,closing_meter:c,price_per_litre:price,money_received:Number(document.getElementById('received').value||0)});msg.textContent=error?error.message:'Reading saved successfully.';if(!error)dashboard()}function customerPage(){form('Credit Customers',[`<div class="field"><label>Name</label><input id="name"></div>`,`<div class="field"><label>Phone</label><input id="phone"></div>`,`<div class="field"><label>Address</label><input id="address"></div>`,`<div class="field"><label>Credit Limit</label><input id="limit" type="number" step="0.01">`],'saveCustomer()')}async function saveCustomer(){const {error}=await db.from('credit_customers').insert({name:name.value,phone:phone.value,address:address.value,credit_limit:Number(limit.value||0),is_active:true});msg.textContent=error?error.message:'Customer added successfully.';if(!error){await loadBase();customerPage()}}function creditPage(){form('Credit Sale',[`<div class="field"><label>Customer</label>${customerSelect()}</div>`,`<div class="field"><label>Garage</label>${stationSelect()}</div>`,`<div class="field"><label>Amount</label><input id="amount" type="number" step="0.01"></div>`,`<div class="field"><label>Invoice Number</label><input id="invoice"></div>`,`<div class="field"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>`],'saveCredit()')}async function saveCredit(){const {error}=await db.from('credit_sales').insert({customer_id:customer.value,station_id:station.value,amount:Number(amount.value),invoice_number:invoice.value,sale_date:date.value});msg.textContent=error?error.message:'Credit sale recorded.';if(!error)dashboard()}function paymentPage(){form('Payment',[`<div class="field"><label>Customer</label>${customerSelect()}</div>`,`<div class="field"><label>Amount</label><input id="amount" type="number" step="0.01"></div>`,`<div class="field"><label>Payment Method</label><select id="method"><option>Cash</option><option>Bank Transfer</option><option>Ecocash</option><option>Other</option></select></div>`,`<div class="field"><label>Reference</label><input id="reference"></div>`],'savePayment()')}async function savePayment(){const {error}=await db.from('credit_payments').insert({customer_id:customer.value,amount:Number(amount.value),payment_method:method.value,reference:reference.value,payment_date:new Date().toISOString()});msg.textContent=error?error.message:'Payment recorded successfully.';if(!error)dashboard()}function purchasePage(){form('Fuel Purchase',[`<div class="field"><label>Garage</label>${stationSelect()}</div>`,`<div class="field"><label>Fuel Type</label><select id="fuel"><option>Petrol</option><option>Diesel</option></select></div>`,`<div class="field"><label>Litres</label><input id="litres" type="number" step="0.001"></div>`,`<div class="field"><label>Price per Litre</label><input id="price" type="number" step="0.01"></div>`,`<div class="field"><label>Total Amount</label><input id="total" type="number" step="0.01"></div>`,`<div class="field"><label>Invoice Number</label><input id="invoice"></div>`],'savePurchase()')}async function savePurchase(){const {error}=await db.from('fuel_purchases').insert({station_id:station.value,fuel_type:fuel.value,litres:Number(litres.value),price_per_litre:Number(price.value),total_amount:Number(total.value),invoice_number:invoice.value,purchase_date:new Date().toISOString().slice(0,10)});msg.textContent=error?error.message:'Fuel purchase recorded.';if(!error)dashboard()}function stockPage(){view.innerHTML=`<button class="btn back" onclick="back()">← Dashboard</button><div class="form"><h2>Fuel Stock and Levels</h2><div class="stations">${stations.map(s=>`<div class="station"><b>${s.name}</b><span>Loading live tank levels…</span></div>`).join('')}</div></div>`}function expensePage(){form('Expenses',[`<div class="field"><label>Garage</label>${stationSelect()}</div>`,`<div class="field"><label>Category</label><input id="category" placeholder="Utilities, wages, repairs…"></div>`,`<div class="field"><label>Description</label><input id="description"></div>`,`<div class="field"><label>Amount</label><input id="amount" type="number" step="0.01"></div>`],'saveExpense()')}async function saveExpense(){const {error}=await db.from('expenses').insert({station_id:station.value,category:category.value,description:description.value,amount:Number(amount.value),expense_date:new Date().toISOString().slice(0,10)});msg.textContent=error?error.message:'Expense recorded.';if(!error)dashboard()}function reportsPage(){view.innerHTML=`<button class="btn back" onclick="back()">← Dashboard</button><div class="form"><h2>Reports</h2><div class="stations"><div class="station"><b>Sales Report</b><span>Petrol, diesel and sales by garage.</span></div><div class="station"><b>Credit Report</b><span>Credits, payments and outstanding balances.</span></div><div class="station"><b>Profit & Loss</b><span>Sales less fuel purchases and expenses.</span></div><div class="station"><b>Fuel Purchase Report</b><span>Fuel purchased by garage and type.</span></div></div></div>`}function settingsPage(){form('Settings',[`<div class="field"><label>Business Name</label><input value="Red Range Investments"></div>`,`<div class="field"><label>System Name</label><input value="Nyambo Fuel Management"></div>`,`<div class="field"><label>Currency</label><select><option>USD</option><option>ZWL</option></select></div>`],'msg.textContent="Settings saved locally."')}function toggle(){side.classList.toggle('open')}function signOut(){alert('Sign Out will be connected to authentication.')}(async()=>{await loadBase();dashboard()})();</script></body></html>
