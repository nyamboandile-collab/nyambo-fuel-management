<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyambo Fuel Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f6f7f9;color:#172033}.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:#111b29;color:#fff;z-index:10;overflow:auto}.brand{background:#e20d18;padding:20px;font-weight:bold;font-size:21px}.brand small{display:block;font-size:10px}.nav{padding:10px}.nav button{width:100%;padding:12px;background:none;color:#ddd;border:0;text-align:left;border-radius:6px;margin-bottom:3px;font-size:14px}.nav button.active{background:#e20d18;color:#fff}.main{margin-left:240px;padding:25px}.mobile{display:none}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e3e7ec;border-radius:10px;padding:15px}.label{font-size:11px;font-weight:bold;color:#667085}.value{font-size:24px;font-weight:bold;margin-top:8px}.green{color:#239447}.red{color:#d71920}.purple{color:#7b3fc6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.pumpgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.garage{background:#fff;border:1px solid #e3e7ec;border-radius:12px;padding:16px}.garage.clickable{cursor:pointer}.garage h2{margin:0 0 8px}.garage-meta{color:#667085;font-size:13px;margin:0 0 12px}.fuel{padding:12px;border-radius:8px;margin-top:8px}.petrol{border-left:5px solid #239447;background:#f1faf4}.diesel{border-left:5px solid #7b3fc6;background:#f7f1fc}.btn{border:0;background:#e20d18;color:#fff;padding:9px 12px;border-radius:6px;margin:6px 4px 0 0}.btn.secondary{background:#172033}.backbtn{border:0;background:#fff;border:1px solid #dfe3e8;border-radius:8px;padding:10px 14px;font-weight:bold;margin-bottom:14px}.pump-detail{padding:14px;background:#fff;border:1px solid #e3e7ec;border-radius:10px}.history{margin-top:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f1f3f5}.empty{padding:18px;text-align:center;color:#667085;background:#fff;border:1px dashed #ccd2da;border-radius:10px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:20}.modal.show{display:flex}.box{background:white;padding:20px;border-radius:12px;width:min(500px,90%);max-height:90vh;overflow:auto}.box>button{float:right;border:0;background:none;font-size:24px}input{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #ddd;border-radius:6px}.status{padding:10px;border-radius:8px;background:#fff3cd;color:#705b00;margin-bottom:12px;display:none}@media(max-width:700px){.side{transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin:0;padding:12px}.mobile{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.mobile button{font-size:24px;background:#fff;border:1px solid #ddd;border-radius:6px;padding:5px 10px}.cards{grid-template-columns:1fr 1fr}.pumpgrid,.grid{grid-template-columns:1fr}.value{font-size:20px}}
</style></head><body><aside class="side" id="side"><div class="brand">⛽ NYAMBO<small>FUEL MANAGEMENT</small></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="mobile"><button id="menuBtn">☰</button><b>NYAMBO FUEL MANAGEMENT</b><span>⋮</span></div><div id="status" class="status"></div><div id="view"></div></main><div class="modal" id="modal"><div class="box"><button id="closeModal">×</button><div id="modalBody"></div></div></div><script>
(function(){'use strict';
const view=document.getElementById('view'),nav=document.getElementById('nav'),side=document.getElementById('side'),modal=document.getElementById('modal'),modalBody=document.getElementById('modalBody'),status=document.getElementById('status');
const names=['Dashboard','Pump Meter Readings','Credit Customers','Credit Sale','Payment','Fuel Purchase','Fuel Stock and Levels','Expenses','Reports','Settings'];let stations=[],pumps=[],history=[],db=null,currentGarage=null;
const money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});const lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L';const same=(a,b)=>String(a)===String(b);
function menu(){nav.innerHTML=names.map((x,i)=>'<button data-i="'+i+'" class="'+(i===0?'active':'')+'">'+x+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i,b)))}
function go(i,b){nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');side.classList.remove('open');if(i===2){location.href='credit-customers.html';return}if(i===8){location.href='reports.html';return}if(i===0)dashboard();else if(i===1)pumpPage();else modulePage(names[i])}
function dashboard(){view.innerHTML='<h1>Dashboard</h1><p>Overview of your fuel business performance</p><div class="cards"><div class="card"><div class="label">TOTAL PETROL SALES</div><div class="value green" id="dashPetrol">0.00 L</div><small>Today</small></div><div class="card"><div class="label">TOTAL DIESEL SALES</div><div class="value purple" id="dashDiesel">0.00 L</div><small>Today</small></div><div class="card"><div class="label">TOTAL SALES</div><div class="value" id="dashTotal">0.00 L</div><small>All garages</small></div><div class="card"><div class="label">TOTAL SALES MONEY</div><div class="value" id="dashMoney">$0.00</div><small>All sales</small></div><div class="card"><div class="label">CREDITS MADE</div><div class="value" id="dashCredits">$0.00</div><small>Credit sales</small></div><div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value" id="dashPayments">$0.00</div><small>Customer payments</small></div><div class="card"><div class="label">OUTSTANDING AMOUNT</div><div class="value red" id="dashOutstanding">$0.00</div><small>Customers owing</small></div><div class="card"><div class="label">NET PROFIT / (LOSS)</div><div class="value" id="dashProfit">$0.00</div><small>After expenses</small></div></div><div class="grid"><div class="panel"><h2>Sales Comparison</h2><p>Petrol vs diesel sales will appear here.</p></div><div class="panel"><h2>Sales by Garage</h2><p>Garage sales comparison will appear here.</p></div></div>';updateDashboard()}
async function updateDashboard(){let pt=history.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),ds=history.filter(x=>String(x.fuel_type).toLowerCase()==='diesel'),sum=a=>a.reduce((z,x)=>z+Number(x.litres_sold||0),0),cash=a=>a.reduce((z,x)=>z+Number(x.money||x.money_received||0),0);let el=id=>document.getElementById(id);if(el('dashPetrol'))el('dashPetrol').textContent=lit(sum(pt));if(el('dashDiesel'))el('dashDiesel').textContent=lit(sum(ds));if(el('dashTotal'))el('dashTotal').textContent=lit(sum(pt)+sum(ds));if(el('dashMoney'))el('dashMoney').textContent=money(cash(history));try{let a=await db.from('credit_sales').select('amount');let p=await db.from('credit_payments').select('amount');let cm=(a.data||[]).reduce((z,x)=>z+Number(x.amount||0),0),pm=(p.data||[]).reduce((z,x)=>z+Number(x.amount||0),0);if(el('dashCredits'))el('dashCredits').textContent=money(cm);if(el('dashPayments'))el('dashPayments').textContent=money(pm);if(el('dashOutstanding'))el('dashOutstanding').textContent=money(cm-pm)}catch(e){}}
function modulePage(name){view.innerHTML='<div class="panel"><h1>'+name+'</h1><p>This module is ready for the next development step.</p></div>'}
function latestForPump(pid){return history.filter(x=>same(x.pump_id,pid)).sort((a,b)=>String(b.reading_date||'').localeCompare(String(a.reading_date||'')))[0]}
function pumpPage(){currentGarage=null;let totalP=pumps.filter(p=>String(p.fuel_type).toLowerCase()==='petrol').length,totalD=pumps.filter(p=>String(p.fuel_type).toLowerCase()==='diesel').length;view.innerHTML='<h1>Pump Meter Readings</h1><p>Select a garage to open <b>all its pump meters and complete reading history</b>.</p><div class="cards"><div class="card"><div class="label">GARAGES</div><div class="value">'+stations.length+'</div><small>All garages</small></div><div class="card"><div class="label">PETROL PUMPS</div><div class="value green">'+totalP+'</div></div><div class="card"><div class="label">DIESEL PUMPS</div><div class="value purple">'+totalD+'</div></div><div class="card"><div class="label">READINGS</div><div class="value">'+history.length+'</div></div></div><div class="pumpgrid">'+(stations.length?stations.map(s=>{let ps=pumps.filter(p=>same(p.station_id,s.id)),hs=history.filter(x=>same(x.station_id,s.id));return '<div class="garage clickable" data-garage="'+s.id+'"><h2>'+s.name+'</h2><p class="garage-meta">'+ps.length+' pumps • '+hs.length+' saved readings</p><div class="fuel petrol"><b>🟢 Petrol</b><br>'+ps.filter(p=>String(p.fuel_type).toLowerCase()==='petrol').length+' pumps</div><div class="fuel diesel"><b>🟣 Diesel</b><br>'+ps.filter(p=>String(p.fuel_type).toLowerCase()==='diesel').length+' pumps</div><button class="btn">Open Garage →</button></div>'}).join(''):'<div class="empty">No garages found.</div>')+'</div>';view.querySelectorAll('[data-garage]').forEach(b=>b.onclick=()=>openGarage(b.dataset.garage))}
function openGarage(id){currentGarage=stations.find(s=>same(s.id,id));if(!currentGarage){pumpPage();return}let ps=pumps.filter(p=>same(p.station_id,currentGarage.id)),hs=history.filter(x=>same(x.station_id,currentGarage.id)),total=hs.reduce((z,x)=>z+Number(x.litres_sold||0),0),moneyTotal=hs.reduce((z,x)=>z+Number(x.money||x.money_received||0),0);view.innerHTML='<button class="backbtn" id="backGarages">← All Garages</button><h1>'+currentGarage.name+' — Pump Meter Readings</h1><p>All pumps for this garage. The latest closing meter becomes the next opening meter.</p><div class="cards"><div class="card"><div class="label">TOTAL LITRES SOLD</div><div class="value">'+lit(total)+'</div></div><div class="card"><div class="label">TOTAL MONEY SOLD</div><div class="value green">'+money(moneyTotal)+'</div></div><div class="card"><div class="label">PUMPS</div><div class="value">'+ps.length+'</div></div><div class="card"><div class="label">HISTORY</div><div class="value">'+hs.length+'</div></div></div><div class="pumpgrid">'+(ps.length?ps.map(p=>{let h=latestForPump(p.id),ph=history.filter(x=>same(x.pump_id,p.id));return '<div class="pump-detail"><h3>'+(String(p.fuel_type).toLowerCase()==='petrol'?'🟢':'🟣')+' '+p.fuel_type+' Pump '+p.pump_number+'</h3><p>Current opening meter: <b>'+(h?h.closing_meter:'Not set')+'</b></p><p>History entries: <b>'+ph.length+'</b></p><button class="btn" data-enter="'+p.id+'">Enter New Reading</button><button class="btn secondary" data-hist="'+p.id+'">View History</button></div>'}).join(''):'<div class="empty">No pumps are configured for this garage.</div>')+'</div><div class="panel history"><h2>'+currentGarage.name+' — Complete Reading History</h2><table><tr><th>Date</th><th>Pump</th><th>Fuel</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+hs.map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.pump_number+'</td><td>'+x.fuel_type+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money||x.money_received)+'</td></tr>').join('')+'</table></div>';document.getElementById('backGarages').onclick=pumpPage;view.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>enter(b.dataset.enter));view.querySelectorAll('[data-hist]').forEach(b=>b.onclick=()=>hist(b.dataset.hist))}
function enter(pid){let p=pumps.find(x=>same(x.id,pid)),h=latestForPump(pid);if(!p)return;modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+'</h2><label>Opening Meter</label><input id="op" type="number" value="'+(h?h.closing_meter:'')+'" '+(h?'readonly':'')+'><label>Closing Meter</label><input id="cl" type="number"><label>Price per Litre</label><input id="pr" type="number" step="0.01"><label>Date</label><input id="dt" type="date" value="'+new Date().toISOString().slice(0,10)+'"><p id="calc">Litres sold: 0.00 L | Money: $0.00</p><button class="btn" id="saveBtn">Save Reading</button>';modal.classList.add('show');let calc=document.getElementById('calc'),recalc=()=>{let o=+op.value,c=+cl.value,prv=+pr.value;calc.textContent='Litres sold: '+lit(Math.max(0,c-o))+' | Money: '+money(Math.max(0,c-o)*prv)};cl.oninput=recalc;pr.oninput=recalc;saveBtn.onclick=()=>save(pid)}
async function save(pid){let o=+op.value,c=+cl.value,prv=+pr.value;if(c<o)return alert('Closing meter cannot be lower than opening meter.');let r=await db.from('pump_readings').insert({pump_id:pid,reading_date:dt.value,opening_meter:o,closing_meter:c,price_per_litre:prv,money_received:(c-o)*prv});if(r.error)alert(r.error.message);else{modal.classList.remove('show');await loadData();openGarage(currentGarage?currentGarage.id:stations[0]?.id)}}
function hist(pid){let p=pumps.find(x=>same(x.id,pid)),rows=history.filter(x=>same(x.pump_id,pid)).sort((a,b)=>String(b.reading_date||'').localeCompare(String(a.reading_date||'')));modalBody.innerHTML='<h2>'+p.fuel_type+' Pump '+p.pump_number+' History</h2><table><tr><th>Date</th><th>Opening</th><th>Closing</th><th>Litres</th><th>Money</th></tr>'+rows.map(x=>'<tr><td>'+x.reading_date+'</td><td>'+x.opening_meter+'</td><td>'+x.closing_meter+'</td><td>'+lit(x.litres_sold)+'</td><td>'+money(x.money||x.money_received)+'</td></tr>').join('')+'</table>';if(!rows.length)modalBody.innerHTML+='<p class="empty">No readings have been saved for this pump yet.</p>';modal.classList.add('show')}
async function loadData(){if(!db)return;try{let results=await Promise.all([db.from('stations').select('id,name').order('name'),db.from('pumps').select('id,station_id,pump_number,fuel_type'),db.from('pump_reading_history').select('*').order('reading_date',{ascending:false})]);stations=results[0].data||[];pumps=results[1].data||[];history=results[2].data||[];updateDashboard()}catch(e){status.textContent='Dashboard loaded, but database data could not be loaded right now.';status.style.display='block'}}
menu();dashboard();document.getElementById('menuBtn').onclick=()=>side.classList.toggle('open');document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');
try{const projectUrl='https://dyqwsydxyhomudujumxs.supabase.co';const projectKey=['sb_publishable_','rH-erFTla9rTfqA5eGwwNA_ad0BgDq6'].join('');db=window.supabase.createClient(projectUrl,projectKey);loadData()}catch(e){status.textContent='Dashboard is running in offline mode.';status.style.display='block'}
})();</script></body></html>
