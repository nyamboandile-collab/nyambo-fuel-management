<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyambo Fuel Management</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fa;
    color:#172033;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    min-width:250px;
    background:#101b29;
    color:white;
    min-height:100vh;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    overflow-y:auto;
    z-index:20;
}

.brand{
    background:#e20d18;
    padding:20px 18px;
    font-weight:800;
    font-size:21px;
    line-height:1.1;
}

.brand small{
    font-size:10px;
    letter-spacing:1px;
}

.nav{
    padding:14px 10px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:#dbe2ea;
    text-align:left;
    padding:13px 14px;
    margin:3px 0;
    border-radius:7px;
    cursor:pointer;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:12px;
}

.nav button:hover{
    background:#1d2b3c;
}

.nav button.active{
    background:#e20d18;
    color:#fff;
    font-weight:700;
}

.nav-icon{
    width:20px;
    text-align:center;
    font-size:16px;
}

.sidebar-bottom{
    position:absolute;
    bottom:15px;
    left:15px;
    right:15px;
}

.status{
    background:#172536;
    padding:12px;
    border-radius:8px;
    font-size:11px;
    color:#b9c4d0;
    margin-bottom:8px;
}

.signout{
    width:100%;
    border:0;
    background:#182638;
    color:#fff;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
}

/* MAIN */
.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
}

.page-title h1{
    margin:0;
    font-size:28px;
}

.page-title p{
    margin:7px 0 0;
    color:#778294;
    font-size:13px;
}

.date-btn{
    border:1px solid #dce1e8;
    background:#fff;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:#fff;
    border:1px solid #e2e6eb;
    border-radius:10px;
    padding:17px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.card-label{
    font-size:11px;
    color:#687385;
    font-weight:700;
}

.card-value{
    font-size:24px;
    font-weight:800;
    margin-top:9px;
}

.card-change{
    margin-top:6px;
    font-size:10px;
    color:#6f7d8c;
}

.red{color:#e20d18}
.green{color:#169447}
.blue{color:#2879d8}
.orange{color:#e99a12}

/* CONTENT */
.content-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-top:16px;
}

.panel{
    background:#fff;
    border:1px solid #e2e6eb;
    border-radius:10px;
    padding:17px;
    overflow:hidden;
}

.panel h2{
    margin:0;
    font-size:15px;
}

.panel-sub{
    color:#7b8795;
    font-size:11px;
    margin:5px 0 15px;
}

/* PIE */
.pie-area{
    display:flex;
    align-items:center;
    gap:25px;
}

.pie{
    width:150px;
    height:150px;
    border-radius:50%;
    background:conic-gradient(
        #e20d18 0 35%,
        #2d994b 35% 75%,
        #2879d8 75% 100%
    );
    position:relative;
}

.pie:after{
    content:"";
    position:absolute;
    width:65px;
    height:65px;
    background:#fff;
    border-radius:50%;
    top:42px;
    left:42px;
}

.legend{
    font-size:11px;
}

.legend div{
    margin:10px 0;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:50%;
    margin-right:7px;
}

.dot.red-dot{background:#e20d18}
.dot.green-dot{background:#2d994b}
.dot.blue-dot{background:#2879d8}

/* BAR CHART */
.chart{
    height:190px;
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    gap:9px;
    padding:10px 5px 0;
    border-bottom:1px solid #e5e8ec;
}

.bar-group{
    height:100%;
    display:flex;
    align-items:flex-end;
    gap:4px;
}

.bar{
    width:14px;
    border-radius:3px 3px 0 0;
}

.petrol{background:#e20d18}
.diesel{background:#2d994b}

.bar-labels{
    display:flex;
    justify-content:space-around;
    font-size:9px;
    color:#788494;
    margin-top:7px;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:11px;
}

th{
    background:#f7f8fa;
    font-weight:700;
    color:#4c5968;
}

th,td{
    padding:10px 8px;
    border-bottom:1px solid #edf0f3;
    text-align:left;
    white-space:nowrap;
}

.amount-red{
    color:#e20d18;
    font-weight:700;
}

/* BOTTOM CARDS */
.bottom-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:16px;
}

/* SECTION */
.section{
    display:none;
}

.section.active-section{
    display:block;
}

/* FORMS */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group label{
    font-size:12px;
    font-weight:700;
    color:#566273;
}

.form-group input,
.form-group select{
    padding:11px;
    border:1px solid #dce1e7;
    border-radius:7px;
    background:#fff;
    font-size:13px;
}

.primary-btn{
    background:#e20d18;
    color:#fff;
    border:0;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:700;
    margin-top:15px;
}

/* MOBILE */
.mobile-header{
    display:none;
}

@media(max-width:1000px){
    .cards{
        grid-template-columns:repeat(2,1fr);
    }

    .bottom-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:750px){

    .sidebar{
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .main{
        margin-left:0;
        width:100%;
        padding:14px;
    }

    .mobile-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:15px;
    }

    .menu-btn{
        background:#fff;
        border:1px solid #dfe4ea;
        border-radius:8px;
        width:42px;
        height:42px;
        font-size:21px;
    }

    .mobile-brand{
        font-weight:800;
        color:#e20d18;
        font-size:17px;
    }

    .topbar{
        align-items:flex-start;
    }

    .page-title h1{
        font-size:23px;
    }

    .date-btn{
        font-size:11px;
    }

    .cards{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .card{
        padding:12px;
    }

    .card-value{
        font-size:18px;
    }

    .content-grid{
        grid-template-columns:1fr;
    }

    .bottom-grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }
}

/* SMALL PHONE */
@media(max-width:430px){

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .card-label{
        font-size:9px;
    }

    .card-value{
        font-size:16px;
    }

    .pie{
        width:115px;
        height:115px;
    }

    .pie:after{
        width:50px;
        height:50px;
        top:32px;
        left:32px;
    }

    .pie-area{
        gap:12px;
    }

    .legend{
        font-size:9px;
    }
}
</style>
</head>
