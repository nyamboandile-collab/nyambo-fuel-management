<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Range Petroleum - Create Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f9;font-family:Arial,sans-serif;color:#151515}.box{width:min(480px,94vw);background:#fff;border:1px solid #e3e7ec;border-radius:16px;padding:28px;box-shadow:0 12px 35px #0001}.logo{display:block;width:100%;height:100px;margin:auto}.title{text-align:center;font-size:25px;font-weight:800;margin:4px 0}.sub{text-align:center;color:#667085;margin:7px 0 22px}label{display:block;font-size:13px;font-weight:700;margin:13px 0 7px}input,select{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:8px;font-size:16px;background:#fff}button{width:100%;border:0;background:#ef101b;color:#fff;padding:13px;border-radius:8px;font-weight:800;font-size:16px;margin-top:20px;cursor:pointer}button:disabled{opacity:.6}.back{display:block;text-align:center;margin-top:15px;color:#ef101b;text-decoration:none;font-size:14px;font-weight:700}.msg{min-height:22px;margin-top:13px;text-align:center;font-size:13px}.error{color:#d71920}.ok{color:#239447}.hint{font-size:12px;color:#667085;margin-top:5px}</style></head><body><div class="box"><svg class="logo" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg"><g transform="translate(8 8)"><rect x="0" y="18" width="42" height="62" rx="3" fill="#f4d33e" stroke="#172033" stroke-width="4"/><rect x="8" y="27" width="26" height="18" rx="2" fill="#fff"/><rect x="15" y="31" width="12" height="8" fill="#ef101b"/><path d="M42 31h11v42c0 9 5 14 13 14" fill="none" stroke="#f4d33e" stroke-width="5"/></g><text x="78" y="52" font-family="Georgia,serif" font-weight="700" font-size="30">RED RANGE</text><text x="78" y="84" font-family="Georgia,serif" font-weight="700" font-size="25">PETROLEUM</text><g transform="skewX(-18)"><rect x="82" y="94" width="45" height="14" fill="#d21862"/><rect x="127" y="94" width="45" height="14" fill="#5d2b88"/><rect x="172" y="94" width="45" height="14" fill="#f4d33e"/></g></svg><h1 class="title" id="pageTitle">Create your company account</h1><p class="sub" id="pageSub">Start managing your fuel business in the cloud.</p><form id="form"><label>Full name</label><input id="name" required autocomplete="name" placeholder="Your name"><label>Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"><label>Company / Garage Group</label><input id="company" required placeholder="e.g. ABC Fuel Services"><label>First garage name <span style="font-weight:400">(optional)</span></label><input id="station" placeholder="e.g. Main Branch"><div class="hint">You can add more garages after signing in.</div><label>Plan</label><select id="plan"><option value="business">Business — 14-day trial</option><option value="starter">Starter — 14-day trial</option><option value="professional">Professional — 14-day trial</option></select><button id="btn">Create Account</button><div id="msg" class="msg"></div></form><a class="back" href="login.html">Already have an account? Sign in</a></div><script>const db=supabase.createClient('https://dyqwsydxyhomudujumxs.supabase.co','sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6');const $=id=>document.getElementById(id);const inviteToken=new URLSearchParams(location.search).get('invite');if(inviteToken){$('pageTitle').textContent='Join a company';$('pageSub').textContent='Create your account using the invitation you received.';$('company').style.display='none';$('station').style.display='none';$('plan').style.display='none';document.querySelector('label[for="company"]')?.remove();$('btn').textContent='Join Company'}db.auth.getSession().then(({data})=>{if(data.session&&!inviteToken)location.replace('index.html')});$('form').addEventListener('submit',async e=>{e.preventDefault();$('btn').disabled=true;$('btn').textContent=inviteToken?'Creating account...':'Creating account...';$('msg').className='msg';$('msg').textContent='';const name=$('name').value.trim(),email=$('email').value.trim(),password=$('password').value,company=$('company').value.trim(),station=$('station').value.trim(),plan=$('plan').value;const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name:name}}});if(error){$('msg').textContent=error.message;$('msg').className='msg error';$('btn').disabled=false;$('btn').textContent=inviteToken?'Join Company':'Create Account';return}if(!data.session){$('msg').textContent='Account created. Check your email to confirm, then return to this invitation link and sign in.';$('msg').className='msg ok';$('btn').textContent='Account Created';return}if(inviteToken){const {error:inviteError}=await db.rpc('accept_company_invitation',{p_token:inviteToken,p_full_name:name});if(inviteError){$('msg').textContent=inviteError.message;$('msg').className='msg error';$('btn').disabled=false;$('btn').textContent='Join Company';return}$('msg').textContent='You joined the company. Opening your dashboard...';$('msg').className='msg ok';location.replace('index.html');return}const {data:org,error:orgError}=await db.rpc('create_company_account',{p_company_name:company,p_slug:company,p_full_name:name,p_plan_code:plan,p_first_station:station||null});if(orgError){await db.auth.signOut();$('msg').textContent=orgError.message;$('msg').className='msg error';$('btn').disabled=false;$('btn').textContent='Create Account';return}$('msg').textContent='Company created. Opening your dashboard...';$('msg').className='msg ok';location.replace('index.html')});</script></body></html>
