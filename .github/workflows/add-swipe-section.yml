name: Add Swipe Section
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          replacements=[
          ("<a href=\"payment.html\"><span class=\"icon\">$</span><span>Payment</span></a>","<a href=\"payment.html\"><span class=\"icon\">$</span><span>Payment</span></a><a href=\"swipe.html\"><span class=\"icon\">💳</span><span>Swipe Received</span></a>"),
          ('<div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value green" id="payments">$0.00</div></div>','<div class="card"><div class="label">PAYMENTS RECEIVED</div><div class="value green" id="payments">$0.00</div></div><div class="card"><div class="label">SWIPE RECEIVED</div><div class="value green" id="swipeReceived">$0.00</div></div>'),
          ("db.from('garage_cash_collections').select('*')", "db.from('swipe_collections').select('*'),db.from('garage_cash_collections').select('*')"),
          ("let h=r[0].data||[],c=r[1].data||[],p=r[2].data||[],pu=r[3].data||[],ex=r[4].data||[],st=r[5].data||[],cu=r[6].data||[],cashRows=r[7].data||[];", "let h=r[0].data||[],c=r[1].data||[],p=r[2].data||[],pu=r[3].data||[],ex=r[4].data||[],st=r[5].data||[],cu=r[6].data||[],swRows=r[7].data||[],cashRows=r[8].data||[];"),
          ("salesMoney=sumM(h),cashTotal=", "salesMoney=sumM(h),swipeTotal=swRows.reduce((s,x)=>s+Number(x.amount||0),0),cashTotal="),
          ("$('payments').textContent=money(pm);$('outstanding')", "$('payments').textContent=money(pm);$('swipeReceived').textContent=money(swipeTotal);$('outstanding')"),
          ("let a=h.filter(x=>String(x.station_id)===String(s.id)),cc=", "let a=h.filter(x=>String(x.station_id)===String(s.id)),sw=swRows.filter(x=>String(x.station_id)===String(s.id)).reduce((q,x)=>q+Number(x.amount||0),0),cc="),
          ("expected=sm-cc-ee,v=cash-expected;", "expected=sm-cc-sw-ee,v=cash-expected;"),
          ("<th>Credits</th><th>Expenses</th><th>Expected Cash</th>", "<th>Credits</th><th>Swipe</th><th>Expenses</th><th>Expected Cash</th>"),
          ("money(sm)+'</td><td>'+money(cc)+'</td><td>'+money(ee)", "money(sm)+'</td><td>'+money(cc)+'</td><td>'+money(sw)+'</td><td>'+money(ee)"),
          ('Expected cash = sales − credits − expenses.', 'Expected cash = sales − credits − swipe − expenses.')]
          for old,new in replacements:
              if old not in s:
                  raise SystemExit('Expected dashboard pattern not found: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm -f swipe-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html swipe-trigger.txt
          git commit -m "Add swipe received section"
          git push
