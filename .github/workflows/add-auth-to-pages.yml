name: Add authentication to app pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  protect-pages:
    if: ${{ !contains(github.event.head_commit.message, '[auth-injected]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared auth script to every app page
        shell: bash
        run: |
          set -e
          for file in *.html; do
            [ "$file" = "login.html" ] && continue
            if grep -q 'src="auth.js"' "$file"; then
              continue
            fi
            python3 - "$file" <<'PY'
import pathlib,sys
p=pathlib.Path(sys.argv[1])
s=p.read_text()
needle='</head>'
if needle not in s:
    raise SystemExit(f'No </head> in {p}')
s=s.replace(needle,'<script src="auth.js"></script></head>',1)
p.write_text(s)
PY
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Protect app pages with Supabase auth [auth-injected]"
          git push
