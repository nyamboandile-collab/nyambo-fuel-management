name: Fix pump labels 2
on:
  push:
    paths:
      - fix-pump-labels2.trigger
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pump-readings.html')
          s=p.read_text()
          s=s.replace("<b>'+p.fuel_type+' Pump '+p.pump_number+'</b>", "<b>'+(p.pump_name || (p.fuel_type+' Pump '+p.pump_number))+'</b>")
          s=s.replace("<td>'+r.pump_number+'</td>", "<td>'+(pumps.find(x=>x.id===r.pump_id)?.pump_name || r.pump_number)+'</td>")
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pump-readings.html .github/workflows/fix-pump-labels2.yml
          git rm .github/workflows/fix-pump-labels2.yml
          git commit -m 'Show named pumps on readings page' || exit 0
          git push
