name: Fix FairBridge pump list

on:
  push:
    paths:
      - '.github/fairbridge-pump-list.trigger'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add missing FairBridge pumps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pump-readings.html')
          s=p.read_text()
          ids=['f413a0b3-6ac8-483b-9a2a-e93933a3369b','a00b12fb-23be-490f-a22b-cd8e6a37eb3b']
          if not all(i in s for i in ids):
              marker="\n].map(x=>({id:x[0],station_id:x[1],pump_number:x[2],fuel_type:x[3],pump_name:pumpNames?.[x[0]]||null}))"
              rows="\n['f413a0b3-6ac8-483b-9a2a-e93933a3369b','c0a2f3f2-c15e-433e-acf7-7397e14a0fe8',3,'Diesel'],['a00b12fb-23be-490f-a22b-cd8e6a37eb3b','c0a2f3f2-c15e-433e-acf7-7397e14a0fe8',4,'Diesel'],"
              if marker in s:
                  s=s.replace(marker, ','+rows.rstrip(',')+marker, 1)
              else:
                  raise SystemExit('Could not find pumps array end marker')
              p.write_text(s)
          else:
              print('FairBridge diesel pumps already present')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pump-readings.html
          git commit -m 'Add missing FairBridge diesel pumps' || true
          git push
      - name: Remove trigger
        run: |
          rm -f .github/fairbridge-pump-list.trigger
          git add -A
          git commit -m 'Remove FairBridge pump list trigger' || true
          git push
