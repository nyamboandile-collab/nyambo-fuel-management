name: Patch pump names
on:
  push:
    paths:
      - '.github/pump-name-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pump pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pump-readings.html')
          s=p.read_text()
          # Add pump_name from the database to the existing pump records by ID.
          names={
          'd75b298e-a16f-4b62-abed-f2dcbf0714f0':'Petrol Pump B1','ae4ce226-d175-4bc7-b11c-812ed8f377be':'Petrol Pump B2','a7abf09a-a627-49c4-a06a-5ee3ea26a375':'Petrol Pump B3','7df96f90-6c8e-464d-bd97-627d1e5790aa':'Petrol Pump B4','bfb02ac4-c770-4766-b76e-bbe7bb815d5c':'Diesel Pump A','878fb9eb-2fbc-4c8f-9196-71a09a78d5cf':'Diesel Pump B',
          '08ba346f-4b1f-484a-b248-69c22895bef9':'Petrol Pump B1','00cd74f2-1362-44f6-ac7a-e3d06dcbee7d':'Petrol Pump B2','0c3eb12c-cf46-4899-bd0b-052d96a7cdc0':'Petrol Pump B3','87db8459-c4b2-431b-af15-b29ef6de0091':'Petrol Pump B4','adf7ac51-d3ca-4cb2-a99f-4f7aa6f6c9f4':'Petrol Pump B5','31b42fbb-7049-4a57-89d0-25ccb28c4f23':'Petrol Pump B6','f67aa708-4145-448e-93b9-8cc803d4b8cf':'Diesel Pump A1','901bc442-93e8-402b-a193-7548d0f3aef5':'Diesel Pump A2','28985db6-6c09-4a50-9f8f-84e5dd858b5b':'Diesel Pump B','2b0b3b16-b445-4f41-8006-a739cf2c5d24':'Diesel Pump C1','12f258e5-6d33-4655-b837-6f0e75c58f3d':'Diesel Pump C2'}
          for pid,name in names.items():
              s=s.replace("['"+pid+"',", "['"+pid+"',")
          # Attach names through a lookup so future DB names can be added without changing pump numbering.
          marker="let readings=[];let selectedGarage=garages[0].id;"
          lookup="const pumpNames="+repr(names).replace("'",'\\\"')+";\n"
          lookup=lookup.replace('\\\"','\"')
          if 'const pumpNames=' not in s:
              s=s.replace(marker,lookup+marker)
          s=s.replace(".map(x=>({id:x[0],station_id:x[1],pump_number:x[2],fuel_type:x[3]}));",".map(x=>({id:x[0],station_id:x[1],pump_number:x[2],fuel_type:x[3],pump_name:pumpNames?.[x[0]]||null})).filter(x=>x.id!=='8c499885-0437-4cde-aa70-79983eba5e15');")
          # Make displayed pump name use the new name, with old number as fallback.
          s=s.replace("'<div class=\"head\"><b>Pump '+p.pump_number+'</b>","'<div class=\"head\"><b>'+(p.pump_name||('Pump '+p.pump_number))+'</b>")
          s=s.replace("<td>Pump '+r.pump_number+'</td>","<td>'+(r.pump_name||('Pump '+r.pump_number))+'</td>")
          p.write_text(s)

          p=Path('garage-dashboard.html')
          s=p.read_text()
          s=s.replace("station_id:p.station_id,fuel_type:p.fuel_type,pump_number:p.pump_number","station_id:p.station_id,fuel_type:p.fuel_type,pump_number:p.pump_number,pump_name:p.pump_name")
          s=s.replace("'<tr><td>Pump '+x.pump_number+'</td>","'<tr><td>'+(x.pump_name||('Pump '+x.pump_number))+'</td>")
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          rm -f .github/pump-name-trigger
          rm -f .github/workflows/patch-pump-names.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pump-readings.html garage-dashboard.html .github
          git commit -m 'Display named pumps and hide inactive Renkini pump' || exit 0
          git push
