name: Fix pump readings initialization
on:
  push:
    paths:
      - pump-readings.html
      - README.md
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix declaration order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pump-readings.html')
          s=p.read_text()
          start=s.find('const pumpNames=')
          pumps=s.find('const pumps=')
          if start < 0 or pumps < 0 or start > pumps:
              print('No broken declaration order found; nothing to do.')
              raise SystemExit(0)
          end=s.find(';', start)
          if end < 0:
              raise SystemExit('Could not find end of pumpNames declaration')
          decl=s[start:end+1]
          s=s[:start]+s[end+1:]
          pumps=s.find('const pumps=')
          s=s[:pumps]+decl+'\n'+s[pumps:]
          p.write_text(s)
          print('Fixed pumpNames declaration order.')
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pump-readings.html .github/workflows/fix-pump-readings.yml
          git rm .github/workflows/fix-pump-readings.yml
          git commit -m 'Fix pump readings garage selector' || exit 0
          git push
