name: Reorder Garage Dashboard Cards
on:
  push:
    paths:
      - 'reorder-garage-dashboard.trigger'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix pump readings JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('pump-readings.html')
          s=p.read_text()
          m=re.search(r'const pumpNames=\{.*?\};', s, re.S)
          if not m:
              raise SystemExit('pumpNames declaration not found')
          decl=m.group(0)
          s=s[:m.start()]+s[m.end():]
          marker='const pumps=['
          pos=s.find(marker)
          if pos<0:
              raise SystemExit('pumps declaration not found')
          s=s[:pos]+decl+'\n'+s[pos:]
          p.write_text(s)
          print('Moved pumpNames declaration before pumps.')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pump-readings.html
          git commit -m 'Fix pump readings initialization' || exit 0
          git push
      - name: Remove trigger
        if: always()
        run: |
          rm -f reorder-garage-dashboard.trigger
          git add -A
          git commit -m 'Remove fix trigger' || true
          git push || true
