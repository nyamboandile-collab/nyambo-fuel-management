name: Add FairBridge pumps
on:
  push:
    paths:
      - '.github/fairbridge-pumps.trigger'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add FairBridge pump labels and fallback pumps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('pump-readings.html')
          s=p.read_text()
          pairs=[
            ('b79ad4ae-1430-4f58-a544-d28f810bf985','Globelite A1'),
            ('847aed1d-0533-4a4b-8faf-20741c4ad7d6','Globelite A2'),
            ('3bb4ccd6-dac4-420f-b89a-cc03850bba87','Petrol Pump A1'),
            ('820fee23-372d-4805-8b3e-2d10fd5fbe77','Petrol Pump A2'),
            ('f413a0b3-6ac8-483b-9a2a-e93933a3369b','Wyne A1'),
            ('a00b12fb-23be-490f-a22b-cd8e6a37eb3b','Wyne A2'),
          ]
          for pid,name in pairs:
              needle='"'+pid+'"'
              if needle not in s:
                  marker='const pumpNames={'
                  entry=needle+': "'+name+'", '
                  s=s.replace(marker, marker+entry, 1)
          station='c0a2f3f2-c15e-433e-acf7-7397e14a0fe8'
          pumps=[
            ('3bb4ccd6-dac4-420f-b89a-cc03850bba87',1,'Petrol'),
            ('820fee23-372d-4805-8b3e-2d10fd5fbe77',2,'Petrol'),
            ('b79ad4ae-1430-4f58-a544-d28f810bf985',1,'Diesel'),
            ('847aed1d-0533-4a4b-8faf-20741c4ad7d6',2,'Diesel'),
            ('f413a0b3-6ac8-483b-9a2a-e93933a3369b',3,'Diesel'),
            ('a00b12fb-23be-490f-a22b-cd8e6a37eb3b',4,'Diesel'),
          ]
          entries=[]
          for pid,num,fuel in pumps:
              if "['"+pid+"'" not in s:
                  entries.append("['%s','%s',%d,'%s'],"%(pid,station,num,fuel))
          if entries:
              s=s.replace('const pumps=[\n','const pumps=[\n'+''.join(entries),1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pump-readings.html
          git diff --cached --quiet || git commit -m 'Add FairBridge pump names'
          git push
      - name: Remove trigger
        run: |
          rm -f .github/fairbridge-pumps.trigger
          git add .github/fairbridge-pumps.trigger
          git diff --cached --quiet || git commit -m 'Remove FairBridge pump trigger'
          git push
