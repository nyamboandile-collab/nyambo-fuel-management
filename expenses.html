<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Range Petroleum - Expenses</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}.header h1{margin:0;font-size:22px}.header small{color:#cbd2dc}.container{max-width:1100px;margin:auto;padding:18px}.panel,.card{background:#fff;border:1px solid #e1e6ec;border-radius:14px;padding:18px;margin-bottom:18px}.grid,.summary{display:grid;grid-template-columns:1fr 1fr;gap:14px}.summary{grid-template-columns:repeat(3,1fr);margin-bottom:18px}.label{font-size:12px;color:#667085;font-weight:bold}.value{font-size:24px;font-weight:bold;margin-top:8px}.red{color:#d71920}.btn{border:0;border-radius:8px;padding:12px 16px;font-weight:bold;background:#e20d18;color:#fff;cursor:pointer}.dark{background:#172033}.field{margin-bottom:12px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px;color:#475467}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d7dce3;border-radius:8px;font:inherit}.field textarea{min-height:80px}.notice,.success,.error{padding:12px;border-radius:8px;margin-bottom:14px}.notice{background:#fff3cd;color:#705b00}.success{background:#e9f8ef;color:#176b36}.error{background:#fde8e8;color:#a61b1b}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e8ebef;text-align:left;white-space:nowrap}th{background:#f1f3f5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}.header{padding:14px}.header h1{font-size:18px}.container{padding:10px}}</style></head><body><div class="header"><div><h1>RED RANGE PETROLEUM</h1><small>Expenses</small></div><div class="actions"><button class="btn dark" onclick="location.href='reports.html'">Reports</button><button class="btn" onclick="location.href='/'">Dashboard</button></div></div><main class="container"><div id="msg"></div><div class="summary"><div class="card"><div class="label">TOTAL EXPENSES</div><div class="value red" id="total">$0.00</div></div><div class="card"><div class="label">THIS MONTH</div><div class="value" id="month">$0.00</div></div><div class="card"><div class="label">RECORDS</div><div class="value" id="count">0</div></div></div><div class="panel form-panel"><h2>Record Expense</h2><div class="grid"><div class="field"><label>Garage</label><select id="station"><option value="">Select garage</option><option value="3724f21d-466a-4c11-88fc-3b539906a6d3">12th Avenue</option><option value="40419e28-21c3-4230-ae03-a2e3866b2a9f">Renkini</option><option value="9a33b834-5daf-404d-af27-f8c07f966103">Pumula South</option><option value="95e3eb03-08a9-444e-b874-3df1a93a8360">Maphisa</option><option value="c0a2f3f2-c15e-433e-acf7-7397e14a0fe8">FairBridge</option></select></div><div class="field"><label>Date</label><input id="date" type="date"></div><div class="field"><label>Category</label><select id="category"><option>Staff</option><option>Electricity</option><option>Water</option><option>Repairs & Maintenance</option><option>Transport</option><option>Security</option><option>Rent</option><option>Bank Charges</option><option>Other</option></select></div><div class="field"><label>Payment Method</label><select id="method"><option>Cash</option><option>Bank Transfer</option><option>Ecocash</option><option>Swipe / POS</option><option>Other</option></select></div><div class="field"><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="0.00"></div><div class="field"><label>Description</label><input id="description" placeholder="What was the expense for?"></div></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional notes"></textarea></div><button class="btn" id="save">Save Expense</button></div><div class="panel"><h2>Expense History</h2><div class="table"><table><thead><tr><th>Date</th><th>Garage</th><th>Category</th><th>Description</th><th>Method</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>(function(){const U='https://dyqwsydxyhomudujumxs.supabase.co',K='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6',db=supabase.createClient(U,K);const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});function msg(t,c){$('msg').innerHTML='<div class="'+c+'">'+t+'</div>'}async function loadRows(){let e=await db.from('expenses').select('*').order('expense_date',{ascending:false});if(e.error){msg('Could not load expenses: '+e.error.message,'error');return}const rows=e.data||[];const total=rows.reduce((a,x)=>a+Number(x.amount||0),0),ym=new Date().toISOString().slice(0,7),month=rows.filter(x=>String(x.expense_date).slice(0,7)===ym).reduce((a,x)=>a+Number(x.amount||0),0);$('total').textContent=money(total);$('month').textContent=money(month);$('count').textContent=rows.length;const names={'3724f21d-466a-4c11-88fc-3b539906a6d3':'12th Avenue','40419e28-21c3-4230-ae03-a2e3866b2a9f':'Renkini','9a33b834-5daf-404d-af27-f8c07f966103':'Pumula South','95e3eb03-08a9-444e-b874-3df1a93a8360':'Maphisa','c0a2f3f2-c15e-433e-acf7-7397e14a0fe8':'FairBridge'};$('rows').innerHTML=rows.length?rows.map(x=>'<tr><td>'+String(x.expense_date||'').slice(0,10)+'</td><td>'+String(names[x.station_id]||'Unknown')+'</td><td>'+String(x.category||'')+'</td><td>'+String(x.description||'—')+'</td><td>'+String(x.payment_method||'—')+'</td><td>'+money(x.amount)+'</td></tr>').join(''):'<tr><td colspan="6" style="text-align:center">No expenses recorded yet.</td></tr>'}async function save(){const btn=$('save'),station=$('station').value,date=$('date').value,category=$('category').value,amount=Number($('amount').value);if(!station||!date||!category||!Number.isFinite(amount)||amount<=0){msg('Please select a garage, date, category and enter an amount greater than 0.','error');return}btn.disabled=true;btn.textContent='Saving...';const payload={station_id:station,expense_date:date,category:category,description:$('description').value.trim()||null,amount:amount,payment_method:$('method').value||null};const r=await db.from('expenses').insert(payload);if(r.error){btn.disabled=false;btn.textContent='Save Expense';msg('Could not save expense: '+r.error.message,'error');return}btn.disabled=false;btn.textContent='Save Expense';msg('Expense saved successfully.','success');$('amount').value='';$('description').value='';$('notes').value='';await loadRows()}$('date').value=new Date().toISOString().slice(0,10);$('save').addEventListener('click',save);loadRows()})();</script></body></html>
