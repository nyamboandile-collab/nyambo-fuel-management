<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fuel Purchases | Red Range Petroleum</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#172033}.header{background:#111b29;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.container{max-width:1100px;margin:auto;padding:14px}.grid,.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{grid-template-columns:repeat(4,1fr);margin-bottom:14px}.panel,.card{background:#fff;border:1px solid #e1e6ec;border-radius:12px;padding:16px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d7dce3;border-radius:8px}.amount,.value{font-size:24px;font-weight:bold;margin-top:7px}.green{color:#239447}.purple{color:#7b3fc6}.btn{border:0;border-radius:8px;padding:11px 15px;background:#e20d18;color:#fff;font-weight:bold}.dark{background:#172033}.notice,.success,.error{padding:11px;border-radius:8px;margin-bottom:12px}.notice{background:#fff3cd;color:#705b00}.success{background:#e9f8ef;color:#176b36}.error{background:#fde8e8;color:#a61b1b}.table{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f1f3f5}@media(max-width:700px){.grid,.summary{grid-template-columns:1fr}.header h1{font-size:18px}}
</style></head><body><div class="header"><div><h1>RED RANGE PETROLEUM</h1><small>Fuel Purchases</small></div><button class="btn dark" onclick="location.href='/'">← Dashboard</button></div><main class="container"><div id="msg"></div><div class="summary"><div class="card"><div class="label">TOTAL FUEL BOUGHT</div><div class="value" id="total">0.00 L</div></div><div class="card"><div class="label">PETROL BOUGHT</div><div class="value green" id="petrol">0.00 L</div></div><div class="card"><div class="label">DIESEL BOUGHT</div><div class="value purple" id="diesel">0.00 L</div></div><div class="card"><div class="label">PURCHASE COST</div><div class="value" id="cost">$0.00</div></div></div><div class="panel"><h2>Record Fuel Purchase</h2><div class="grid"><div class="field"><label>Garage</label><select id="station"></select></div><div class="field"><label>Supplier</label><select id="supplier"><option value="">No supplier selected</option></select></div><div class="field"><label>Fuel Type</label><select id="fuel"><option>Petrol</option><option>Diesel</option></select></div><div class="field"><label>Invoice Number</label><input id="invoice" placeholder="FUEL-0001"></div><div class="field"><label>Purchase Date</label><input id="date" type="date"></div><div class="field"><label>Litres Purchased</label><input id="litres" type="number" min="0" step="0.01"></div><div class="field"><label>Cost per Litre</label><input id="price" type="number" min="0" step="0.01"></div><div class="field"><label>Total Cost</label><div class="amount" id="amount">$0.00</div></div></div><div class="field"><label>Notes</label><textarea id="notes"></textarea></div><button class="btn" id="save">Save Fuel Purchase</button></div><div class="panel"><h2>Purchase History</h2><div class="table"><table><tr><th>Date</th><th>Garage</th><th>Fuel</th><th>Invoice</th><th>Litres</th><th>Cost/L</th><th>Total</th><th>Status</th></tr><tbody id="rows"></tbody></table></div></div></main><script>(function(){const U='https://dyqwsydxyhomudujumxs.supabase.co',K='sb_publishable_rH-erFTla9rTfqA5eGwwNA_ad0BgDq6',db=supabase.createClient(U,K);let stations=[],suppliers=[];const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),lit=n=>Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' L',fmt=v=>{let p=String(v||'').slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};function msg(t,c='notice'){$('msg').innerHTML='<div class="'+c+'">'+t+'</div>'}async function init(){$('date').value=new Date().toISOString().slice(0,10);let[s,sp]=await Promise.all([db.from('stations').select('id,name').eq('is_active',true).order('name'),db.from('suppliers').select('id,name').order('name')]);if(s.error)return msg(s.error.message,'error');stations=s.data||[];suppliers=sp.data||[];$('station').innerHTML=stations.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');$('supplier').innerHTML='<option value="">No supplier selected</option>'+suppliers.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');await load()}function calc(){$('amount').textContent=money((+$('litres').value||0)*(+$('price').value||0))}$('litres').oninput=calc;$('price').oninput=calc;async function load(){let r=await db.from('fuel_purchases').select('*').order('purchase_date',{ascending:false});if(r.error)return msg(r.error.message,'error');let a=r.data||[],p=a.filter(x=>String(x.fuel_type).toLowerCase()==='petrol'),d=a.filter(x=>String(x.fuel_type).toLowerCase()==='diesel');$('total').textContent=lit(a.reduce((s,x)=>s+Number(x.litres||0),0));$('petrol').textContent=lit(p.reduce((s,x)=>s+Number(x.litres||0),0));$('diesel').textContent=lit(d.reduce((s,x)=>s+Number(x.litres||0),0));$('cost').textContent=money(a.reduce((s,x)=>s+Number(x.total_amount||0),0));$('rows').innerHTML=a.length?a.map(x=>'<tr><td>'+fmt(x.purchase_date)+'</td><td>'+((stations.find(s=>String(s.id)===String(x.station_id))||{}).name||'Unknown')+'</td><td>'+x.fuel_type+'</td><td>'+x.invoice_number+'</td><td>'+lit(x.litres)+'</td><td>'+money(x.price_per_litre)+'</td><td>'+money(x.total_amount)+'</td><td>'+x.payment_status+'</td></tr>').join(''):'<tr><td colspan="8">No fuel purchases recorded yet.</td></tr>'}async function save(){let l=+$('litres').value||0,p=+$('price').value||0;if(!$('station').value||!$('invoice').value.trim()||l<=0||p<=0)return msg('Please complete garage, invoice, litres and cost per litre.','error');let r=await db.from('fuel_purchases').insert({station_id:$('station').value,supplier_id:$('supplier').value||null,invoice_number:$('invoice').value.trim(),purchase_date:$('date').value,total_amount:l*p,payment_status:'paid',notes:$('notes').value.trim()||null,fuel_type:$('fuel').value,litres:l,price_per_litre:p});if(r.error)return msg(r.error.message,'error');msg('Fuel purchase saved successfully.','success');$('invoice').value='';$('litres').value='';$('price').value='';$('notes').value='';calc();load()}$('save').onclick=save;init()})();</script></body></html>
